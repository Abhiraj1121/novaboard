  if (!nbAiKey(s)) {
    return (
      <div className="space-y-2 text-xs text-slate-300" onPointerDown={stop}>
        <p>Add a free Gemini, Groq or OpenRouter API key to turn on the assistant. It stays in this browser.</p>
        <button className="nb-btn" onClick={() => open && open('ai')}>Open AI settings</button>
      </div>
    );
  }

  const send = () => {
    const text = input.trim(); if (!text || busy) return;
    const next = [...msgs, { role: 'user', content: text }];
    setMsgs(next); setInput('');
    run(async () => { const out = await call({ messages: next.slice(-12) }); setMsgs((m) => [...m, { role: 'assistant', content: out }]); });
  };
  const generate = () => {
    if (!topic.trim() || busy) return;
    const lead = NB_AI_KINDS.find((k) => k[0] === kind)[2];
    run(async () => {
      const out = await call({ maxTokens: 900, messages: [{ role: 'user', content: `${lead}: ${topic.trim()}.\nReturn ONLY a JSON array of strings, one string per item, each under 200 characters. No markdown, no extra text.` }] });
      let arr; try { arr = JSON.parse(out.replace(/```json|```/g, '').trim()); } catch (e) { arr = null; }
      if (!Array.isArray(arr) || !arr.length) throw new Error('The AI reply could not be read. Try again.');
      const vp = viewportRef && viewportRef.current;
      if (!vp) throw new Error('Open a board first.');
      vp.addAiNotes(arr.slice(0, 9).map(String));

  };
  const askPage = (prompt) => run(async () => {
    const vp = viewportRef && viewportRef.current; const url = vp && vp.getPagePng();
    if (!url) throw new Error('Could not capture the page.');
    const small = await nbShrinkImage(url);
    const data = small.split(',')[1];
    const out = await call({ messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data } }, { type: 'text', text: prompt }] }] });
    setPageOut(out);
  });
  const addPageNote = () => { const vp = viewportRef && viewportRef.current; if (vp && pageOut) vp.addAiNotes([pageOut]); };

  const box = 'w-full px-2 py-1.5 rounded-md bg-slate-900/60 border border-slate-600/50 text-xs text-slate-100';
  return (
    <div className="space-y-2" onPointerDown={stop}>
      <div className="flex gap-1.5">
        {[['chat', 'Chat'], ['make', 'Create'], ['page', 'Page']].map(([id, l]) => <button key={id} onClick={() => setTab(id)} className={`nb-chip ${tab === id ? 'on' : 'text-slate-400'}`}>{l}</button>)}
      </div>
      {tab === 'chat' && (<>
        <div ref={endRef} className="h-48 overflow-y-auto space-y-1.5 text-xs">
          {msgs.length === 0 && <p className="text-slate-500">Ask a question or request an explanation.</p>}
          {msgs.map((m, i) => <div key={i} className={`rounded-lg px-2 py-1.5 whitespace-pre-wrap ${m.role === 'user' ? 'bg-cyan-500/15 text-cyan-100 ml-6' : 'bg-slate-700/40 text-slate-100 mr-6'}`}>{m.content}</div>)}
          {busy && <div className="text-slate-500">Thinking…</div>}
        </div>
        <div className="flex gap-1.5">
          <input className={box} value={input} placeholder="Ask anything…" onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') send(); }} />
          <button className="nb-btn" disabled={busy} onClick={send}>Send</button>
        </div>
        {msgs.length > 0 && <div className="flex gap-1.5">
          <button className="nb-btn sec" onClick={() => { const l = [...msgs].reverse().find((m) => m.role === 'assistant'); const vp = viewportRef.current; if (l && vp) vp.addAiNotes([l.content]); }}>Add last reply to board</button>
          <button className="nb-btn sec" onClick={() => setMsgs([])}>Clear</button>
        </div>}
      </>)}
      {tab === 'make' && (<>
        <div className="flex flex-wrap gap-1.5">{NB_AI_KINDS.map(([id, l]) => <button key={id} onClick={() => setKind(id)} className={`nb-chip ${kind === id ? 'on' : 'text-slate-400'}`}>{l}</button>)}</div>
        <input className={box} value={topic} placeholder="Topic, e.g. Photosynthesis, grade 6" onChange={(e) => setTopic(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') generate(); }} />
        <button className="nb-btn" disabled={busy || !topic.trim()} onClick={generate}>{busy ? 'Generating…' : 'Add to board as sticky notes'}</button>
      </>)}
      {tab === 'page' && (<>
        <p className="text-[11px] text-slate-500">Sends an image of the current page to the AI.</p>
        <div className="flex flex-wrap gap-1.5">{NB_AI_PAGE.map(([id, l, pr]) => <button key={id} className="nb-btn" disabled={busy} onClick={() => askPage(pr)}>{l}</button>)}</div>
        {busy && <div className="text-xs text-slate-500">Looking at the page…</div>}
        {pageOut && !busy && (<>
          <div className="max-h-44 overflow-y-auto rounded-lg bg-slate-700/40 text-slate-100 text-xs px-2 py-1.5 whitespace-pre-wrap">{pageOut}</div>
          <button className="nb-btn sec" onClick={addPageNote}>Add answer to board</button>
        </>)}
      </>)}
      {err && <div className="text-xs text-red-300" role="alert">{err}</div>}
    </div>
  );
}

/* ---- Live Share (one-way, peer-to-peer): host broadcasts the board as frames; viewers join with a passcode ---- */
const ILive = (p) => <Svg {...p}><circle cx="12" cy="12" r="2.5" /><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2" /></Svg>;
const NB_LIVE_PREFIX = 'novaboard-live-';
const NB_LIVE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function nbLiveCode() {
  const a = new Uint32Array(6); (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.from(a, (n) => NB_LIVE_ALPHABET[n % NB_LIVE_ALPHABET.length]).join('');
}
const nbLiveFmt = (c) => (c ? `${c.slice(0, 3)}-${c.slice(3)}` : '');
const nbLiveClean = (v) => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);

/* The host session lives outside React so minimizing or re-opening the Live Share window never drops viewers. */
const nbLive = {
  status: 'idle', code: '', viewers: 0, err: '', v: 0,
  peer: null, conns: new Set(), timer: null, busy: false, last: null, lastSent: 0, vpRef: null, missing: 0,
  subs: new Set(),
  set(patch) { Object.assign(this, patch); this.v++; this.subs.forEach((f) => f()); },
  teardown() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    try { this.conns.forEach((c) => c.close()); } catch (e) { /* ignore */ }
    this.conns.clear(); this.last = null; this.busy = false;
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* ignore */ }
    this.peer = null;
  },
  end() { this.teardown(); this.set({ status: 'idle', code: '', viewers: 0, err: '' }); },
  async sendFrame(force) {
    const vp = this.vpRef && this.vpRef.current;
    if (!vp) { if (++this.missing > 10) this.end(); return; } // the board was closed: stop sharing
    this.missing = 0;
    if (this.busy || this.conns.size === 0) return;
    if (!vp.liveDirty() && !force) return;
    this.busy = true;
    try {
      const buf = await vp.getLiveFrame(1280);
      if (!buf) return;
      this.last = buf; this.lastSent = Date.now();
      this.conns.forEach((c) => { try { if (c.open && !(c.dataChannel && c.dataChannel.bufferedAmount > 1.5e6)) c.send(buf); } catch (e) { /* skip */ } });
    } finally { this.busy = false; }
  },
  start(viewportRef, attempt = 0) {
    if (!window.Peer) { this.set({ status: 'error', err: 'The sharing library did not load. Check your internet connection and reload.' }); return; }
    this.teardown(); this.vpRef = viewportRef; this.missing = 0;
    const code = nbLiveCode();
    this.set({ status: 'starting', code, viewers: 0, err: '' });
    const peer = new window.Peer(NB_LIVE_PREFIX + code);
    this.peer = peer;
    peer.on('open', () => {
      this.set({ status: 'live' });
      this.timer = setInterval(() => this.sendFrame(Date.now() - this.lastSent > 3000), 300);
    });
    peer.on('connection', (conn) => {
      conn.on('open', () => {
        this.conns.add(conn); this.set({ viewers: this.conns.size });
        if (this.last) { try { conn.send(this.last); } catch (e) { /* ignore */ } } else this.sendFrame(true);
      });
      const gone = () => { this.conns.delete(conn); this.set({ viewers: this.conns.size }); };
      conn.on('close', gone); conn.on('error', gone);
    });
    peer.on('error', (e) => {
      if (e && e.type === 'unavailable-id' && attempt < 3) { this.start(viewportRef, attempt + 1); return; }
      if (e && e.type === 'peer-unavailable') return;
      this.teardown();
      this.set({ status: 'error', err: 'Could not start sharing (' + ((e && e.type) || 'network') + '). Try again.' });
    });
    peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) { /* ignore */ } });
  },
};

function LiveShareTool({ viewportRef }) {
  const [, force] = useState(0);

function LiveViewer({ onClose }) {
  const [input, setInput] = useState('');
  const [status, setStatus] = useState('idle'); // idle | connecting | watching | ended | error
  const [err, setErr] = useState('');
  const [src, setSrc] = useState(null);
  const ref = useRef({ peer: null, url: null, timer: null });
  const cleanup = useCallback(() => {
    const r = ref.current;
    if (r.timer) { clearTimeout(r.timer); r.timer = null; }
    try { if (r.peer) r.peer.destroy(); } catch (e) { /* ignore */ }
    r.peer = null;
    if (r.url) { URL.revokeObjectURL(r.url); r.url = null; }
  }, []);
  useEffect(() => cleanup, [cleanup]);
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onClose]);

  const join = () => {
    const c = nbLiveClean(input);
    if (c.length !== 6) { setErr('Enter the 6-character passcode.'); return; }
    if (!window.Peer) { setErr('The sharing library did not load. Check your internet connection and reload.'); return; }
    cleanup(); setErr(''); setStatus('connecting');
    const r = ref.current;
    const fail = (m) => { cleanup(); setStatus('error'); setErr(m); };
    const peer = new window.Peer(); r.peer = peer;
    r.timer = setTimeout(() => fail('Could not connect. Check the passcode and that the host is sharing.'), 15000);
    peer.on('open', () => {
      const conn = peer.connect(NB_LIVE_PREFIX + c, { reliable: true });
      conn.on('open', () => { if (r.timer) { clearTimeout(r.timer); r.timer = null; } setStatus('watching'); });
      conn.on('data', (d) => {
        try {
          const url = URL.createObjectURL(new Blob([d], { type: 'image/jpeg' }));
          if (r.url) URL.revokeObjectURL(r.url);
          r.url = url; setSrc(url);
        } catch (e) { /* ignore a bad frame */ }
      });
      conn.on('close', () => { setStatus('ended'); });
    });
    peer.on('error', (e) => {
      if (e && e.type === 'peer-unavailable') fail('No live board found for that passcode.');
      else fail('Connection problem (' + ((e && e.type) || 'network') + ').');
    });
  };
  const leave = () => { cleanup(); onClose(); };

  if (status === 'watching' || status === 'ended') {
    return (
      <div className="fixed inset-0 z-[90] bg-black flex items-center justify-center" style={{ paddingTop: 'env(safe-area-inset-top, 0px)', paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
        {src ? <img src={src} alt="Live board" className="max-w-full max-h-full object-contain" /> : <p className="text-slate-400 text-sm">Waiting for the board…</p>}
        <div className="absolute top-3 left-3 right-3 flex items-center justify-between pointer-events-none">
          <span className="px-2.5 py-1 rounded-full text-xs bg-black/60 text-slate-100 pointer-events-auto">
            <span className={`inline-block w-2 h-2 rounded-full mr-1.5 ${status === 'ended' ? 'bg-slate-400' : 'bg-emerald-400'}`} />{status === 'ended' ? 'Host ended the session' : 'Live'}
          </span>
          <button className="nb-btn pointer-events-auto" onClick={leave}>Leave</button>
        </div>
      </div>
    );
  }
  return (
    <div className="fixed inset-0 z-[90] flex items-center justify-center bg-black/60 px-4" onPointerDown={(e) => { if (e.target === e.currentTarget) leave(); }}>
      <div className="glass-strong rounded-2xl p-5 w-full max-w-sm space-y-3">
        <div className="flex items-center gap-2 text-slate-100 font-semibold"><ILive size={18} /> Join live board</div>
        <p className="text-xs text-slate-400">Type the passcode shown on the host's board. You will watch in read-only mode.</p>
        <input autoFocus value={nbLiveFmt(nbLiveClean(input))} onChange={(e) => setInput(nbLiveClean(e.target.value))} onKeyDown={(e) => { if (e.key === 'Enter') join(); }}
          placeholder="ABC-DEF" aria-label="Passcode" className="w-full text-center mono text-2xl tracking-widest px-3 py-2 rounded-xl bg-slate-900/60 border border-slate-600/50 text-cyan-200" />
        {err && <div className="text-xs text-red-300" role="alert">{err}</div>}
        <div className="flex gap-2 justify-end">
          <button className="nb-btn sec" onClick={leave}>Cancel</button>
          <button className="nb-btn" disabled={status === 'connecting'} onClick={join}>{status === 'connecting' ? 'Connecting…' : 'Join'}</button>
        </div>
      </div>
    </div>
  );
}

/* ============================== 3.0 : COLOUR CANVAS + GRID MENU ============================== */
function nbHexToHsv(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); const n = parseInt(m ? m[1] : 'ffffff', 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: (h * 60 + 360) % 360, s: mx ? d / mx : 0, v: mx };
}
function nbHsvToHex(h, s, v) {
  const f = (n) => { const k = (n + h / 60) % 6; const x = v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); return Math.round(x * 255).toString(16).padStart(2, '0'); };
  return '#' + f(5) + f(3) + f(1);
}
function ColorCanvas({ value, onChange }) {
  const [hsv, setHsv] = useState(() => nbHexToHsv(value));
  const cv = useRef(null);
  useEffect(() => {
    if (nbHsvToHex(hsv.h, hsv.s, hsv.v) === (value || '').toLowerCase()) return;
    const n = nbHexToHsv(value); setHsv((p) => ({ h: n.s === 0 || n.v === 0 ? p.h : n.h, s: n.s, v: n.v }));
  }, [value]);
  useEffect(() => {
    const c = cv.current; if (!c) return; const x = c.getContext('2d'); const W = c.width, H = c.height;
    x.fillStyle = `hsl(${hsv.h}, 100%, 50%)`; x.fillRect(0, 0, W, H);
    let g = x.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, '#000'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  }, [hsv.h]);
  const emit = (n) => { setHsv(n); onChange(nbHsvToHex(n.h, n.s, n.v)); };
  const drag = (e) => {
    e.preventDefault(); e.stopPropagation(); const el = e.currentTarget; el.setPointerCapture && el.setPointerCapture(e.pointerId);
    const at = (ev) => { const r = el.getBoundingClientRect(); emit({ h: hsv.h, s: Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)), v: 1 - Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height)) }); };
    at(e);
    const mv = (ev) => at(ev); const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  };
  return (
    <div className="space-y-2.5 mb-3">
      <div className="relative rounded-xl overflow-hidden touch-none cursor-crosshair" style={{ boxShadow: 'inset 0 0 0 1px rgba(148,163,184,.35)' }} onPointerDown={drag}>
        <canvas ref={cv} width="240" height="130" className="block w-full" style={{ height: 130 }} />
        <span className="absolute w-4 h-4 rounded-full pointer-events-none" style={{ left: `calc(${hsv.s * 100}% - 8px)`, top: `calc(${(1 - hsv.v) * 100}% - 8px)`, border: '2px solid #fff', boxShadow: '0 0 0 1.5px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.5)', background: value }} />
      </div>
      <input type="range" min="0" max="360" value={Math.round(hsv.h)} onChange={(e) => emit({ ...hsv, h: +e.target.value })} className="nb-hue" aria-label="Hue" />
    </div>
  );
}

const NB_GRID_OPTS = [['off', 'Off'], ['grid', 'Grid'], ['dots', 'Dots'], ['lines', 'Lines'], ['graph', 'Graph'], ['iso', 'Isometric']];
function nbGridStyle(mode, z, ink) {

  if (mode === 'grid') return { backgroundImage: `linear-gradient(${g(0.12)} 1px, transparent 1px), linear-gradient(90deg, ${g(0.12)} 1px, transparent 1px)`, backgroundSize: `${z}px ${z}px` };
  if (mode === 'dots') return { backgroundImage: `radial-gradient(${g(0.3)} 1.4px, transparent 1.6px)`, backgroundSize: `${z}px ${z}px` };
  if (mode === 'lines') return { backgroundImage: `linear-gradient(${g(0.14)} 1px, transparent 1px)`, backgroundSize: `100% ${Math.round(z * 1.125)}px` };
  if (mode === 'graph') return {
    backgroundImage: `${ln(g(0.34), '180deg')}, ${ln(g(0.34), '90deg')}, ${ln(g(0.13), '180deg')}, ${ln(g(0.13), '90deg')}`,
    backgroundSize: `${z * 5}px ${z * 5}px, ${z * 5}px ${z * 5}px, ${z}px ${z}px, ${z}px ${z}px`, backgroundPosition: 'center',
  };
  if (mode === 'iso') return { backgroundImage: `radial-gradient(${g(0.32)} 1.4px, transparent 1.6px), radial-gradient(${g(0.32)} 1.4px, transparent 1.6px)`, backgroundSize: `${z}px ${z * 1.732}px`, backgroundPosition: `0 0, ${z / 2}px ${z * 0.866}px` };
  return {};
}
function GridAxes({ ink }) {
  const c = `rgba(${ink},0.75)`;
  return (<>
    <div className="pointer-events-none absolute left-0 right-0" style={{ top: '50%', height: 2, marginTop: -1, background: c }} />
    <div className="pointer-events-none absolute top-0 bottom-0" style={{ left: '50%', width: 2, marginLeft: -1, background: c }} />
    <span className="pointer-events-none absolute mono text-[11px]" style={{ left: 'calc(50% + 6px)', top: 6, color: c }}>y</span>
    <span className="pointer-events-none absolute mono text-[11px]" style={{ right: 8, top: 'calc(50% + 6px)', color: c }}>x</span>
    <span className="pointer-events-none absolute mono text-[10px]" style={{ left: 'calc(50% + 5px)', top: 'calc(50% + 4px)', color: c }}>0</span>
  </>);
}
function GridMenu({ anchorRef, mode, size, onMode, onSize, onClose, down }) {
  const wrap = useRef(null);
  useKeepInView(wrap);
  useEffect(() => {
    const onDown = (e) => { if (anchorRef.current && !anchorRef.current.contains(e.target)) onClose(); };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('pointerdown', onDown); window.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('pointerdown', onDown); window.removeEventListener('keydown', onKey); };
  }, [anchorRef, onClose]);
  return (
    <div ref={wrap} className={`absolute ${down ? 'top-full mt-3' : 'bottom-full mb-3'} left-0 z-40`}>
      <div className="glass-strong modal-in rounded-2xl p-3 w-64 shadow-2xl" role="dialog" aria-label="Background guide">
        <div className="mono text-[10px] tracking-wider text-slate-500 mb-2">BACKGROUND GUIDE</div>
        <div className="grid grid-cols-3 gap-2">
          {NB_GRID_OPTS.map(([id, label]) => (
            <button key={id} onClick={() => onMode(id)} className={`rounded-xl p-1.5 border text-center focus-ring ${mode === id ? 'border-cyan-400/70 bg-cyan-500/10' : 'border-slate-700/60 hover:border-slate-500/70'}`}>
              <div className="rounded-md mb-1 relative overflow-hidden" style={{ height: 34, background: '#1e293b', ...(id === 'off' ? {} : nbGridStyle(id, 10, '255,255,255')) }}>
                {id === 'graph' && <div className="absolute inset-0" style={{ background: 'linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,.8)) center/100% 1px no-repeat, linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,.8)) center/1px 100% no-repeat' }} />}
              </div>
              <div className="text-[11px] text-slate-300">{label}</div>
            </button>
          ))}
        </div>
        <div className="flex items-center justify-between mt-3 mb-1"><span className="mono text-[10px] tracking-wider text-slate-500">SPACING</span><span className="mono text-xs text-slate-300">{size}px</span></div>
        <input type="range" min="16" max="80" step="4" value={size} onChange={(e) => onSize(+e.target.value)} className="nb-slider w-full" aria-label="Guide spacing" />
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
