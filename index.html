<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NovaBoard OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #090d16;
    --bg-panel: #0f1420;
    --cyan: #38bdf8;
    --indigo: #818cf8;
    --line: rgba(148, 163, 184, 0.14);
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background: var(--bg-deep);
    color: #e5e9f0;
    font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ---- Splash ---- */
  .splash-bg {
    background:
      radial-gradient(60% 60% at 50% 42%, rgba(56,189,248,0.10) 0%, rgba(56,189,248,0) 70%),
      radial-gradient(80% 80% at 50% 50%, #0b101c 0%, #090d16 100%);
  }
  .orbit-ring {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    border: 1px solid rgba(56,189,248,0.28);
    transform: translate(-50%, -50%);
  }
  .orbit-ring.r2 { border-color: rgba(129,140,248,0.22); }
  @keyframes spin-slow { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes spin-rev { from { transform: translate(-50%, -50%) rotate(360deg); } to { transform: translate(-50%, -50%) rotate(0deg); } }
  .spin-a { animation: spin-slow 6s linear infinite; }
  .spin-b { animation: spin-rev 9s linear infinite; }

  @keyframes core-pulse {
    0%, 100% { opacity: 0.65; filter: drop-shadow(0 0 10px rgba(56,189,248,0.6)); transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; filter: drop-shadow(0 0 26px rgba(56,189,248,0.95)); transform: translate(-50%, -50%) scale(1.08); }
  }
  .core-dot { animation: core-pulse 1.8s ease-in-out infinite; }

  @keyframes fade-up-in {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fade-up-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  @keyframes splash-exit {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
  .splash-exit { animation: splash-exit 0.35s ease forwards; }

  @keyframes track-in {
    0% { opacity: 0; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1); }
  }
  .track-in { animation: track-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  /* ---- Shared ---- */
  .glass {
    background: rgba(24, 29, 43, 0.68);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
  }
  .glass-strong {
    background: rgba(15, 20, 32, 0.86);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(148, 163, 184, 0.18);
  }
  .scanline-hairline {
    background: linear-gradient(90deg, transparent, rgba(56,189,248,0.5), transparent);
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 8px; }

  @keyframes breathe {
    0%, 100% { opacity: 0.5; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
    50% { opacity: 1; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0); }
  }
  .breathe-dot { animation: breathe 2.2s ease-in-out infinite; }

  .card-hover { transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), border-color 0.25s ease, background 0.25s ease; }
  .card-hover:hover { transform: translateY(-3px); }

  @keyframes modal-in {
    0% { opacity: 0; transform: translateY(8px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-in { animation: modal-in 0.28s cubic-bezier(0.16,1,0.3,1) forwards; }

  .focus-ring:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .spin-a, .spin-b, .core-dot, .breathe-dot { animation: none !important; }
  }

  /* ---- Phase 2: drawing engine ---- */
  .canvas-stage { position: relative; }
  .canvas-stage .canvas-container { position: absolute !important; inset: 0; width: 100% !important; height: 100% !important; }
  .canvas-stage canvas { touch-action: none; }
  .tool-btn {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #94a3b8; border: 1px solid transparent;
    transition: all 0.15s ease;
  }
  .tool-btn:hover { background: rgba(148,163,184,0.08); color: #cbd5e1; }
  .tool-btn.active {
    background: rgba(56,189,248,0.14);
    border-color: rgba(56,189,248,0.4);
    color: #38bdf8;
  }
  .tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .tool-btn:disabled:hover { background: transparent; color: #94a3b8; }

  input[type="range"].nb-slider {
    -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 999px;
    background: rgba(148,163,184,0.25);
    outline: none;
  }
  input[type="range"].nb-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px rgba(56,189,248,0.7);
    cursor: pointer;
    border: 2px solid #0f1420;
  }
  input[type="range"].nb-slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #38bdf8; border: 2px solid #0f1420;
    box-shadow: 0 0 8px rgba(56,189,248,0.7);
    cursor: pointer;
  }

  input[type="color"].nb-swatch {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px; border-radius: 8px;
    border: 2px solid rgba(148,163,184,0.3);
    padding: 0; background: none; cursor: pointer;
  }
  input[type="color"].nb-swatch::-webkit-color-swatch-wrapper { padding: 0; border-radius: 6px; }
  input[type="color"].nb-swatch::-webkit-color-swatch { border: none; border-radius: 6px; }

  .preset-swatch {
    width: 20px; height: 20px; border-radius: 6px;
    border: 1.5px solid rgba(255,255,255,0.15);
    transition: transform 0.12s ease;
    flex-shrink: 0;
  }
  .preset-swatch:hover { transform: scale(1.15); }
  .preset-swatch.active { outline: 2px solid #38bdf8; outline-offset: 2px; }

  /* ---- Phase 4: slides + PDF ---- */
  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-spin { animation: spin 1s linear infinite; }

  .thumb-strip { transition: width 0.25s cubic-bezier(0.16,1,0.3,1), opacity 0.2s ease; }
  .thumb-card {
    border: 2px solid transparent;
    transition: border-color 0.15s ease, transform 0.15s ease;
    cursor: pointer;
  }
  .thumb-card:hover { transform: translateY(-1px); }
  .thumb-card.active {
    border-color: #38bdf8;
    box-shadow: 0 0 0 1px rgba(56,189,248,0.3), 0 0 16px rgba(56,189,248,0.35);
  }
  .navdock-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px;
    color: #94a3b8; transition: all 0.15s ease;
  }
  .navdock-btn:hover:not(:disabled) { background: rgba(148,163,184,0.1); color: #e2e8f0; }
  .navdock-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ---- Phase 5: floating widgets ---- */
  .widget-window {
    background: rgba(24, 24, 27, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(63, 63, 70, 0.7);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
  }
  .widget-header { cursor: grab; user-select: none; touch-action: none; }
  .widget-header:active { cursor: grabbing; }
  .widget-pill {
    background: rgba(24, 24, 27, 0.92);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(63, 63, 70, 0.7);
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .calc-key {
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-size: 15px; font-weight: 500;
    background: rgba(148,163,184,0.08); color: #e2e8f0;
    transition: background 0.1s ease, transform 0.1s ease;
    user-select: none;
  }
  .calc-key:hover { background: rgba(148,163,184,0.16); }
  .calc-key:active { transform: scale(0.94); }
  .calc-key.op { background: rgba(56,189,248,0.16); color: #7dd3fc; }
  .calc-key.op:hover { background: rgba(56,189,248,0.26); }
  .calc-key.fn { background: rgba(148,163,184,0.05); color: #94a3b8; font-size: 12px; }
  .calc-key.accent { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0b1220; }

  .laser-trail-canvas { position: absolute; inset: 0; pointer-events: auto; z-index: 25; cursor: crosshair; }

  @keyframes ring-dash { to { stroke-dashoffset: var(--ring-target, 0); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo, useImperativeHandle } = React;

/* ============================== UTIL ============================== */

function useClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return now;
}

function formatClock(d) {
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const s = String(d.getSeconds()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  return { time: `${String(h).padStart(2, '0')}:${m}:${s}`, ampm };
}

function formatDateLong(d) {
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

function greetingFor(d) {
  const h = d.getHours();
  if (h < 5) return 'Still up';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  if (h < 21) return 'Good evening';
  return 'Good evening';
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  return `${day}d ago`;
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

const SESSIONS_KEY = 'novaboard.sessions.v1';

function loadSessions() {
  try {
    const raw = window.localStorage.getItem(SESSIONS_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveSessions(sessions) {
  try {
    window.localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
  } catch (e) {
    /* storage unavailable — fail silently, session list just won't persist */
  }
}

/* ============================== ICONS ============================== */
/* Inline SVG icon set (Lucide-style, hand-drawn to match) — self-contained,
   no external icon package dependency needed for this artifact runtime. */

const Svg = ({ children, size = 18, className = "" }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
       fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"
       className={className} style={{ pointerEvents: 'none' }}>
    {children}
  </svg>
);
const IPlus = (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
const IUpload = (p) => <Svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></Svg>;
const IClock = (p) => <Svg {...p}><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></Svg>;
const IChevronRight = (p) => <Svg {...p}><polyline points="9 18 15 12 9 6"/></Svg>;
const IChevronLeft = (p) => <Svg {...p}><polyline points="15 18 9 12 15 6"/></Svg>;
const IX = (p) => <Svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Svg>;
const ICheck = (p) => <Svg {...p}><polyline points="20 6 9 17 4 12"/></Svg>;
const IArrowLeft = (p) => <Svg {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></Svg>;
const ISparkles = (p) => <Svg {...p}><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></Svg>;
const ILayers = (p) => <Svg {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></Svg>;
const IFileText = (p) => <Svg {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></Svg>;
const IGrid = (p) => <Svg {...p}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></Svg>;
const IPalette = (p) => <Svg {...p}><circle cx="13.5" cy="6.5" r="0.5" fill="currentColor"/><circle cx="17.5" cy="10.5" r="0.5" fill="currentColor"/><circle cx="8.5" cy="7.5" r="0.5" fill="currentColor"/><circle cx="6.5" cy="12.5" r="0.5" fill="currentColor"/><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.4-.3-.4-.5-.9-.5-1.4 0-1.1.9-2 2-2h2.4c1.7 0 3.1-1.4 3.1-3.1C20.5 6.4 16.7 2 12 2z"/></Svg>;
const ITrash = (p) => <Svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Svg>;
const IDot = (p) => <Svg {...p}><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></Svg>;

/* ============================== SPLASH ============================== */

function SplashScreen({ onDone }) {
  const [exiting, setExiting] = useState(false);

  useEffect(() => {
    const exitTimer = setTimeout(() => setExiting(true), 1450);
    const doneTimer = setTimeout(() => onDone(), 1800);
    return () => { clearTimeout(exitTimer); clearTimeout(doneTimer); };
  }, [onDone]);

  return (
    <div className={`splash-bg fixed inset-0 flex items-center justify-center ${exiting ? 'splash-exit' : ''}`}>
      <div className="relative" style={{ width: 260, height: 260 }}>
        <div className="orbit-ring spin-a" style={{ width: 220, height: 220 }} />
        <div className="orbit-ring r2 spin-b" style={{ width: 160, height: 160 }} />
        <div className="orbit-ring" style={{ width: 100, height: 100, borderColor: 'rgba(56,189,248,0.15)' }} />
        <div
          className="core-dot absolute rounded-full"
          style={{
            top: '50%', left: '50%', width: 14, height: 14,
            background: 'radial-gradient(circle, #7dd3fc 0%, #38bdf8 60%, transparent 100%)',
          }}
        />
      </div>
      <div className="absolute bottom-[30%] left-1/2 -translate-x-1/2 text-center fade-up" style={{ animationDelay: '0.35s', opacity: 0 }}>
        <div className="text-2xl tracking-[0.2em] font-semibold" style={{
          backgroundImage: 'linear-gradient(90deg, #e5e9f0, #a5b4fc)',
          WebkitBackgroundClip: 'text', backgroundClip: 'text', color: 'transparent'
        }}>
          NOVABOARD OS
        </div>
        <div className="mono text-[11px] text-slate-500 mt-2 tracking-wider">initializing canvas kernel…</div>
      </div>
    </div>
  );
}

/* ============================== HOME ============================== */

function HeroGreeting() {
  const now = useClock();
  return (
    <div>
      <div className="mono text-xs text-cyan-400/80 tracking-wider mb-2">{formatDateLong(now).toUpperCase()}</div>
      <h1 className="text-4xl sm:text-5xl font-semibold text-slate-100 leading-tight">
        {greetingFor(now)}.
      </h1>
      <p className="text-slate-400 mt-2 max-w-md">
        Pick up where you left off, or start a fresh board.
      </p>
    </div>
  );
}

const BG_PRESETS = [
  { id: 'chalk-green', label: 'Chalkboard Green', hex: '#0d3824' },
  { id: 'blueprint', label: 'Blueprint Blue', hex: '#0b2545' },
  { id: 'charcoal', label: 'Matte Charcoal', hex: '#18181b' },
  { id: 'white', label: 'Pure White', hex: '#ffffff' },
];

function NewBoardModal({ onClose, onCreate }) {
  const [selected, setSelected] = useState('chalk-green');
  const [customHex, setCustomHex] = useState('#38bdf8');
  const [useCustom, setUseCustom] = useState(false);
  const [title, setTitle] = useState('Untitled Board');
  const dialogRef = useRef(null);

  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  const activeHex = useCustom ? customHex : (BG_PRESETS.find(p => p.id === selected)?.hex || '#0d3824');
  const hexValid = /^#([0-9A-Fa-f]{6})$/.test(customHex);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="new-board-title">
      <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
      <div ref={dialogRef} className="glass-strong modal-in relative w-full max-w-md rounded-2xl p-6 shadow-2xl">
        <div className="flex items-start justify-between mb-5">
          <div>
            <h2 id="new-board-title" className="text-lg font-semibold text-slate-100">New blank board</h2>
            <p className="text-sm text-slate-400 mt-1">Choose a canvas tone to start on.</p>
          </div>
          <button onClick={onClose} className="text-slate-500 hover:text-slate-300 transition-colors focus-ring rounded-md p-1" aria-label="Close dialog">
            <IX size={18} />
          </button>
        </div>

        <label className="block text-xs text-slate-400 mb-1.5 mono tracking-wide">BOARD NAME</label>
        <input
          value={title}
          onChange={(e) => setTitle(e.target.value)}
          className="w-full mb-5 rounded-lg bg-slate-950/60 border border-slate-700/60 px-3 py-2 text-sm text-slate-100 focus-ring focus:border-cyan-500/50 outline-none"
          placeholder="Untitled Board"
        />

        <label className="block text-xs text-slate-400 mb-2 mono tracking-wide">CANVAS TONE</label>
        <div className="grid grid-cols-4 gap-2.5 mb-4">
          {BG_PRESETS.map((p) => (
            <button
              key={p.id}
              onClick={() => { setSelected(p.id); setUseCustom(false); }}
              className={`group relative aspect-square rounded-xl border-2 transition-all focus-ring ${
                !useCustom && selected === p.id ? 'border-cyan-400 scale-[1.03]' : 'border-slate-700/60 hover:border-slate-500'
              }`}
              style={{ background: p.hex }}
              aria-label={p.label}
              title={p.label}
            >
              {!useCustom && selected === p.id && (
                <span className="absolute -top-1.5 -right-1.5 bg-cyan-400 rounded-full p-0.5 text-slate-950">
                  <ICheck size={11} />
                </span>
              )}
            </button>
          ))}
        </div>

        <button
          onClick={() => setUseCustom(v => !v)}
          className={`w-full flex items-center gap-2.5 rounded-lg border px-3 py-2.5 mb-1 transition-colors focus-ring ${
            useCustom ? 'border-cyan-500/50 bg-cyan-500/5' : 'border-slate-700/60 hover:border-slate-500'
          }`}
        >
          <span className="rounded-md w-6 h-6 border border-slate-600 flex-shrink-0" style={{ background: hexValid ? customHex : '#333' }} />
          <span className="text-sm text-slate-300">Custom hex</span>
          {useCustom && (
            <input
              value={customHex}
              onChange={(e) => setCustomHex(e.target.value)}
              onClick={(e) => e.stopPropagation()}
              className="ml-auto mono text-xs bg-slate-950/70 border border-slate-700 rounded px-2 py-1 w-24 text-slate-200 outline-none focus:border-cyan-500/50"
              maxLength={7}
            />
          )}
        </button>

        <div className="flex items-center gap-3 mt-6">

function HomeScreen({ onEnterCanvas, sessions, setSessions }) {
  const [modal, setModal] = useState(null); // null | 'new' | 'upload'
  const fileInputRef = useRef(null);

  const createSession = useCallback((meta) => {
    const session = {
      id: uid(),
      title: meta.title,
      bg: meta.bg,
      pageCount: 1,
      updatedAt: Date.now(),
      source: meta.source || 'blank',
    };
    setSessions(prev => {
      const next = [session, ...prev].slice(0, 12);
      saveSessions(next);
      return next;
    });
    // pdfFile (a live File object) can't be persisted to localStorage, so it's
    // attached only to the in-memory session handed to onEnterCanvas, never
    // to the copy saved into Recent Sessions.
    onEnterCanvas(meta.pdfFile ? { ...session, pdfFile: meta.pdfFile } : session);
  }, [onEnterCanvas, setSessions]);

  const handleFilePicked = useCallback((file) => {
    if (!file) return;
    createSession({
      title: file.name.replace(/\.pdf$/i, ''),
      bg: '#ffffff',
      source: 'pdf',
      pdfFile: file,
    });
  }, [createSession]);

  return (
    <div className="track-in relative h-full overflow-y-auto">
      <div className="max-w-5xl mx-auto px-6 sm:px-10 pt-16 pb-20">
        <HeroGreeting />

        <div className="grid sm:grid-cols-3 gap-4 mt-10">
          <ActionCard
            icon={IPlus}
            title="New blank board"
            desc="Start fresh with a canvas tone of your choice."
            onClick={() => setModal('new')}
            accent="cyan"
          />
          <ActionCard
            icon={IUpload}
            title="Open document / PDF"
            desc="Import a PDF and mark it up page by page."
            onClick={() => fileInputRef.current?.click()}
            accent="indigo"
          />
          <div className="sm:row-span-1">
            <ActionCard
              icon={IClock}
              title="Recent sessions"
              desc="Jump back into a board you were working on."
              onClick={() => {
                const list = document.getElementById('recent-sessions-anchor');
                list?.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }}
              accent="cyan"
            />
          </div>
        </div>

        <input
          ref={fileInputRef}
          type="file"
          accept="application/pdf"
          className="hidden"
          onChange={(e) => handleFilePicked(e.target.files?.[0])}
        />

        <div id="recent-sessions-anchor" className="mt-10">
          <RecentSessions
            sessions={sessions}
            onOpen={(s) => onEnterCanvas(s)}
            onClear={() => { setSessions([]); saveSessions([]); }}
          />
        </div>
      </div>

      {modal === 'new' && (
        <NewBoardModal
          onClose={() => setModal(null)}
          onCreate={(meta) => { setModal(null); createSession(meta); }}
        />
      )}
    </div>
  );
}

/* ---------- Helpers ---------- */

function hexToRgba(hex, alpha) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

/* Contain / letterbox frame. Fits a page of (pageW x pageH) inside the stage
   (stageW x stageH) with no extra margin and centres it:
     scale   = min(stageW / pageW, stageH / pageH)
     offsetX = (stageW - pageW * scale) / 2
     offsetY = (stageH - pageH * scale) / 2 */
function computePageFrame(pageW, pageH, stageW, stageH) {
  const scale = Math.min(stageW / pageW, stageH / pageH);
  return {
    scale,
    offsetX: (stageW - pageW * scale) / 2,
    offsetY: (stageH - pageH * scale) / 2,
  };
}

/* "Page space" = the page's own pixel grid (scale 1, no offset). PDF slides store
   their vector JSON in page space so annotations stay glued to the page no matter
   how the stage is resized. */
const PAGE_SPACE = { scale: 1, offsetX: 0, offsetY: 0 };

/* Re-map objects (live fabric objects OR plain toJSON objects) from one frame to
   another. The mapping is a uniform similarity, so strokes, shapes and their
   line widths all stay aligned with the page. */
function reframeObjects(objs, from, to) {
  if (!from || !to || !from.scale || !to.scale) return;
  const k = to.scale / from.scale;
  objs.forEach((o) => {
    const vals = {
      left: ((o.left || 0) - from.offsetX) * k + to.offsetX,
      top: ((o.top || 0) - from.offsetY) * k + to.offsetY,
      scaleX: (o.scaleX == null ? 1 : o.scaleX) * k,
      scaleY: (o.scaleY == null ? 1 : o.scaleY) * k,
    };
    if (typeof o.setCoords === 'function') { o.set(vals); o.setCoords(); }
    else Object.assign(o, vals);
  });
}

/* Position the locked PDF page image inside the current frame. */
function placeBgImage(img, page, frame) {
  if (!img || !page || !frame) return;
  img.set({
    left: frame.offsetX, top: frame.offsetY,
    scaleX: (page.w * frame.scale) / img.width,
    scaleY: (page.h * frame.scale) / img.height,
  });
  img.setCoords();
}

/* Perceived-luminance test on a #rrggbb / #rgb colour. */
function isLightColor(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return false;
  const n = parseInt(h, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150;
}

/* Build a smooth SVG path string from raw points using quadratic midpoints. */
function pointsToSmoothPath(points) {
  if (points.length === 0) return '';
  if (points.length === 1) {
    const p = points[0];
    return `M ${p.x} ${p.y} L ${p.x + 0.01} ${p.y + 0.01}`;
  }
  if (points.length === 2) {
    return `M ${points[0].x} ${points[0].y} L ${points[1].x} ${points[1].y}`;
  }
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length - 1; i++) {
    const mx = (points[i].x + points[i + 1].x) / 2;
    const my = (points[i].y + points[i + 1].y) / 2;
    d += ` Q ${points[i].x} ${points[i].y} ${mx} ${my}`;
  }
  const last = points[points.length - 1];
  d += ` L ${last.x} ${last.y}`;
  return d;
}

/* Build a variable-width filled polygon from points + per-point widths (calligraphy). */
function buildVariableWidthPath(points, widths) {
  if (points.length < 2) {
    const p = points[0];
    const r = (widths[0] || 2) / 2;
    return `M ${p.x - r} ${p.y} a ${r} ${r} 0 1 0 ${r * 2} 0 a ${r} ${r} 0 1 0 ${-r * 2} 0 Z`;
  }
  const left = [], right = [];
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const prev = points[Math.max(0, i - 1)];
    const next = points[Math.min(points.length - 1, i + 1)];
    let dx = next.x - prev.x, dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const nx = -dy, ny = dx;
    const w = (widths[i] || 2) / 2;
    left.push({ x: p.x + nx * w, y: p.y + ny * w });
    right.push({ x: p.x - nx * w, y: p.y - ny * w });
  }
  let d = `M ${left[0].x} ${left[0].y}`;
  for (let i = 1; i < left.length; i++) {
    const mx = (left[i - 1].x + left[i].x) / 2;
    const my = (left[i - 1].y + left[i].y) / 2;
    d += ` Q ${left[i - 1].x} ${left[i - 1].y} ${mx} ${my}`;
  }
  d += ` L ${left[left.length - 1].x} ${left[left.length - 1].y}`;
  d += ` L ${right[right.length - 1].x} ${right[right.length - 1].y}`;
  for (let i = right.length - 2; i >= 0; i--) {
    const mx = (right[i + 1].x + right[i].x) / 2;
    const my = (right[i + 1].y + right[i].y) / 2;
    d += ` Q ${right[i + 1].x} ${right[i + 1].y} ${mx} ${my}`;
  }
  d += ' Z';
  return d;
}

/* ---------- Phase 5: safe calculator expression evaluator (no eval) ---------- */

function safeEvalExpr(expr) {
  let i = 0;
  const s = String(expr).replace(/\s+/g, '');

  const peek = () => s[i];
  const eat = (ch) => { if (s[i] !== ch) throw new Error('Malformed expression'); i++; };

  function parseNumber() {
    const start = i;
    if (s[i] === '-') i++;
    while (i < s.length && /[0-9.]/.test(s[i])) i++;
    if (start === i) throw new Error('Expected number');
    const n = parseFloat(s.slice(start, i));
    if (Number.isNaN(n)) throw new Error('Invalid number');
    return n;
  }
  function parseAtom() {
    if (peek() === '(') { eat('('); const v = parseExpr(); eat(')'); return v; }
    if (peek() === '-') { i++; return -parseAtom(); }
    return parseNumber();
  }
  function parsePow() {
    const left = parseAtom();
    if (peek() === '^') { i++; return Math.pow(left, parsePow()); }
    return left;
  }
  function parseTerm() {
    let left = parsePow();
    while (peek() === '*' || peek() === '/' || peek() === '%') {
      const op = s[i]; i++;
      const right = parsePow();
      if (op === '*') left *= right;
      else if (op === '/') { if (right === 0) throw new Error('Division by zero'); left /= right; }
      else left %= right;
    }
    return left;
  }
  function parseExpr() {
    let left = parseTerm();
    while (peek() === '+' || peek() === '-') {
      const op = s[i]; i++;
      left = op === '+' ? left + parseTerm() : left - parseTerm();
    }
    return left;
  }

  if (s.length === 0) return 0;
  const result = parseExpr();
  if (i !== s.length) throw new Error('Unexpected trailing characters');
  return result;
}

/* ---------- Phase 5: Web Audio bell chime (no external audio files) ---------- */

let sharedAudioCtx = null;
function getAudioCtx() {
  if (!sharedAudioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    sharedAudioCtx = new Ctx();
  }
  if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
  return sharedAudioCtx;
}

/* A soft two-tone bell: two partials with a fast attack and slow exponential decay. */
function playChime() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0, now);
  master.connect(ctx.destination);

  const partials = [
    { freq: 880, gain: 0.22, decay: 1.4 },
    { freq: 1320, gain: 0.12, decay: 1.0 },
    { freq: 1760, gain: 0.06, decay: 0.7 },
  ];
  partials.forEach(({ freq, gain, decay }) => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gain, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + decay + 0.05);
  });
  master.gain.setValueAtTime(1, now);
}

/* ---------- Multi-slide data model ---------- */

const PDF_LETTERBOX_BG = '#090d16';
const SLATE_BG = '#090d16';
const WHITE_BG = '#ffffff';

function makeSlide(bg, opts = {}) {
  return {
    id: uid(),
    bg: bg || '#0d3824',
    bgImage: opts.bgImage || null,   // dataURL, e.g. rasterized PDF page
    bgImageW: opts.bgImageW || null, // natural px size of bgImage, for export sizing
    bgImageH: opts.bgImageH || null,
    json: null,       // fabric.toJSON() snapshot of this slide's objects (null = empty)
    history: { stack: [], index: -1 }, // per-slide undo/redo
    thumb: null,      // dataURL thumbnail for the sidebar
  };
}

/* ---------- PDF.js loader/config (lazy — only touched when a PDF is actually opened) ---------- */

let pdfjsReadyPromise = null;
function ensurePdfJs() {
  if (pdfjsReadyPromise) return pdfjsReadyPromise;
  pdfjsReadyPromise = new Promise((resolve, reject) => {
    const lib = window.pdfjsLib;
    if (!lib) { reject(new Error('PDF.js failed to load.')); return; }
    lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    resolve(lib);
  });
  return pdfjsReadyPromise;
}

/* Rasterize every page of a PDF File to dataURLs at a target CSS pixel width,
   rendered at devicePixelRatio for crispness. Returns [{dataUrl, width, height}]. */
async function rasterizePdfPages(file, onProgress) {
  const lib = await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf }).promise;
  const pages = [];
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const baseViewport = page.getViewport({ scale: 1 });
    // Target ~1400px wide canvas for a good quality/size tradeoff, scaled by DPR.
    const targetCssWidth = 1400;
    const scale = (targetCssWidth / baseViewport.width) * dpr;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    pages.push({
      dataUrl: canvas.toDataURL('image/jpeg', 0.9),
      width: viewport.width / dpr,
      height: viewport.height / dpr,
    });
    if (onProgress) onProgress(i, pdf.numPages);
  }
  return pages;
}

/* ---------- jsPDF export ---------- */

/* Build a flattened raster of one slide (background + vector objects) as a dataURL,
   by rendering into an offscreen Fabric StaticCanvas at the slide's native size. */
async function rasterizeSlideForExport(slide, fallbackW, fallbackH) {
  const w = slide.bgImageW || fallbackW;
  const h = slide.bgImageH || fallbackH;
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const staticCanvas = new fabric.StaticCanvas(off, { width: w, height: h });
  staticCanvas.backgroundColor = slide.bg;

  // Load vector objects first (loadFromJSON replaces the canvas's object list
  // and its own backgroundColor), then layer the background image behind
  // everything, then reassert the slide's real bg color. Order matters here.
  if (slide.json) {
    await new Promise((resolve) => {
      staticCanvas.loadFromJSON(slide.json, () => resolve());
    });
  }
  staticCanvas.backgroundColor = slide.bg;

  if (slide.bgImage) {
    await new Promise((resolve) => {
      fabric.Image.fromURL(slide.bgImage, (img) => {
        img.set({ left: 0, top: 0, scaleX: w / img.width, scaleY: h / img.height, selectable: false, evented: false });
        staticCanvas.add(img);
        staticCanvas.sendToBack(img);
        resolve();
      });
    });
  }

  staticCanvas.renderAll();
  const dataUrl = off.toDataURL('image/jpeg', 0.92);
  staticCanvas.dispose();
  return { dataUrl, w, h };
}

async function exportSessionAsPdf(slides, title) {
  const { jsPDF } = window.jspdf;
  let doc = null;
  for (let i = 0; i < slides.length; i++) {
    const slide = slides[i];
    const { dataUrl, w, h } = await rasterizeSlideForExport(slide, 1400, 900);
    const orientation = w >= h ? 'landscape' : 'portrait';
    if (!doc) {
      doc = new jsPDF({ orientation, unit: 'pt', format: [w, h] });
    } else {
      doc.addPage([w, h], orientation);
    }
    doc.addImage(dataUrl, 'JPEG', 0, 0, w, h);
  }
  if (!doc) return;
  doc.save(`${(title || 'NovaBoard').replace(/[^\w\-]+/g, '_')}.pdf`);
}

const SHAPES_2D = [
  { id: 'line', label: 'Line', icon: ILine },
  { id: 'arrow2', label: 'Double arrow', icon: IArrowsH },
  { id: 'rect', label: 'Rectangle', icon: IRect },

  { id: 'ellipse', label: 'Circle / ellipse', icon: ICircleShape },

];

const SHAPES_3D = [
  { id: 'cube', label: 'Cube', icon: ICube },
  { id: 'cylinder', label: 'Cylinder', icon: ICylinder },
  { id: 'sphere', label: 'Sphere', icon: ISphere },
  { id: 'pyramid', label: 'Pyramid', icon: IPyramid },
];

const SHAPE_3D_IDS = new Set(SHAPES_3D.map(s => s.id));

/* ----- Isometric-style vector projection for 3D wireframes ----- */
// Simple rotation about Y (yaw) then X (tilt), then orthographic projection
// to 2D with a fixed isometric-ish foreshortening. Returns {x,y} in local
// unrotated-canvas units centered at origin.
function project3D(x, y, z, yaw, tilt) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const x1 = x * cy - z * sy;
  const z1 = x * sy + z * cy;
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const y2 = y * ct - z1 * st;
  const z2 = y * st + z1 * ct;
  // orthographic; z2 folded in lightly for a touch of depth-scale (subtle)
  const depthScale = 1 + z2 * 0.0006 * 0;
  return { x: x1 * depthScale, y: y2 * depthScale };
}

function edgesToPathData(vertices, edges) {
  return edges.map(([a, b]) => {
    const p1 = vertices[a], p2 = vertices[b];
    return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
  }).join(' ');
}

/* Build the raw (yaw, tilt) -> SVG path-data + bounds for each 3D primitive,
   in a local coordinate space centered at (0,0). Size ~ +/-60 units. */
function build3DGeometry(kind, yaw, tilt) {
  const R = 55;
  let vertices = [], edges = [], extraPaths = [];

  if (kind === 'cube') {
    const s = R * 0.8;
    const pts = [];
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
      pts.push([sx * s, sy * s, sz * s]);
    }
    // order: 0:---,1:--+,2:-+-,3:-++,4:+--,5:+-+,6:++-,7:+++
    vertices = pts.map(([x, y, z]) => project3D(x, y, z, yaw, tilt));
    edges = [
      [0,1],[1,3],[3,2],[2,0], // x=-1 face
      [4,5],[5,7],[7,6],[6,4], // x=+1 face
      [0,4],[1,5],[2,6],[3,7], // connectors
    ];
  } else if (kind === 'pyramid') {
    const s = R * 0.9, h = R * 1.05;
    const base = [[-s,h*0.4,-s],[s,h*0.4,-s],[s,h*0.4,s],[-s,h*0.4,s]];
    const apex = [0, -h*0.6, 0];
    const pts = [...base, apex];
    vertices = pts.map(([x, y, z]) => project3D(x, y, z, yaw, tilt));
    edges = [[0,1],[1,2],[2,3],[3,0],[0,4],[1,4],[2,4],[3,4]];
  } else if (kind === 'cylinder') {
    const rad = R * 0.62, h = R * 0.95, N = 20;
    const top = [], bot = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      top.push([Math.cos(a) * rad, -h, Math.sin(a) * rad]);
      bot.push([Math.cos(a) * rad, h, Math.sin(a) * rad]);
    }
    const pts = [...top, ...bot];
    vertices = pts.map(([x, y, z]) => project3D(x, y, z, yaw, tilt));
    edges = [];
    for (let i = 0; i < N; i++) edges.push([i, (i + 1) % N]);
    for (let i = 0; i < N; i++) edges.push([N + i, N + ((i + 1) % N)]);
    // a few verticals for depth cues
    for (let i = 0; i < N; i += Math.floor(N / 4)) edges.push([i, N + i]);
  } else if (kind === 'sphere') {
    const rad = R * 0.85, LAT = 5, LON = 12, SEG = 24;
    const rings = []; // latitude circles
    for (let li = 1; li < LAT; li++) {
      const phi = (li / LAT) * Math.PI - Math.PI / 2;
      const ring = [];
      for (let i = 0; i <= SEG; i++) {
        const th = (i / SEG) * Math.PI * 2;
        ring.push([
          rad * Math.cos(phi) * Math.cos(th),
          rad * Math.sin(phi),
          rad * Math.cos(phi) * Math.sin(th),
        ]);
      }
      rings.push(ring);
    }
    const merid = []; // longitude half-circles
    for (let mi = 0; mi < LON; mi++) {
      const th = (mi / LON) * Math.PI * 2;
      const line = [];
      for (let i = 0; i <= SEG; i++) {
        const phi = (i / SEG) * Math.PI - Math.PI / 2;
        line.push([
          rad * Math.cos(phi) * Math.cos(th),
          rad * Math.sin(phi),
          rad * Math.cos(phi) * Math.sin(th),
        ]);
      }
      merid.push(line);
    }
    const toPath = (loop) => {
      const proj = loop.map(([x, y, z]) => project3D(x, y, z, yaw, tilt));
      return 'M ' + proj.map(p => `${p.x} ${p.y}`).join(' L ');
    };
    extraPaths = [...rings.map(toPath), ...merid.slice(0, 6).map(toPath)];
    vertices = []; edges = [];
    // bounding vertices for sizing purposes
    vertices = [
      project3D(-rad,0,0,yaw,tilt), project3D(rad,0,0,yaw,tilt),
      project3D(0,-rad,0,yaw,tilt), project3D(0,rad,0,yaw,tilt),
      project3D(0,0,-rad,yaw,tilt), project3D(0,0,rad,yaw,tilt),
    ];
  }

  const mainPath = edges.length ? edgesToPathData(vertices, edges) : '';
  const fullPath = [mainPath, ...extraPaths].filter(Boolean).join(' ');

  const allX = vertices.map(v => v.x), allY = vertices.map(v => v.y);
  const minX = Math.min(...allX, -R * 0.3), maxX = Math.max(...allX, R * 0.3);
  const minY = Math.min(...allY, -R * 0.3), maxY = Math.max(...allY, R * 0.3);

  return { path: fullPath || 'M 0 0 L 0.01 0.01', bounds: { minX, minY, maxX, maxY } };
}

/* ---------- Toolbar ---------- */

function ToolButton({ active, onClick, title, children, disabled }) {
  return (
    <button
      onClick={onClick}
      title={title}
      aria-label={title}
      aria-pressed={!!active}
      disabled={disabled}
      className={`tool-btn focus-ring ${active ? 'active' : ''}`}
    >
      {children}
    </button>
  );
}

function ShapeFlyout({ activeShape, onPick, onClose }) {
  const ref = useRef(null);
  useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('mousedown', onDoc);
    window.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDoc); window.removeEventListener('keydown', onKey); };
  }, [onClose]);

  const Group = ({ title, items }) => (
    <div>
      <div className="mono text-[10px] tracking-wider text-slate-500 mb-1.5 px-0.5">{title}</div>
      <div className="grid grid-cols-3 gap-1.5">
        {items.map((s) => (
          <button
            key={s.id}
            onClick={() => onPick(s.id)}
            title={s.label}
            className={`tool-btn focus-ring !w-full !h-11 flex-col gap-0.5 ${activeShape === s.id ? 'active' : ''}`}
          >
            <s.icon size={17} />
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <div className="absolute bottom-full mb-3 left-1/2 -translate-x-1/2 z-40">
      <div ref={ref} className="glass-strong modal-in rounded-2xl p-3 w-64 shadow-2xl flex flex-col gap-3">
        <Group title="2D PRIMITIVES" items={SHAPES_2D} />
        <div className="h-px bg-slate-700/50" />
        <Group title="3D WIREFRAME" items={SHAPES_3D} />
      </div>
    </div>
  );
}

/* Contextual stroke popover: width slider + palette + native colour/hex picker.
   Rendered directly above the tool that opened it; dismisses on outside click / Esc.

   (the tool's own onClick toggles it). */
function StylePopover({ anchorRef, label, color, setColor, width, setWidth, onClose }) {
  const [hexDraft, setHexDraft] = useState(color);
  useEffect(() => { setHexDraft(color); }, [color]);

  useEffect(() => {
    const onDown = (e) => { if (anchorRef.current && !anchorRef.current.contains(e.target)) onClose(); };
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('pointerdown', onDown);
    window.addEventListener('keydown', onKey);
    return () => {
      document.removeEventListener('pointerdown', onDown);
      window.removeEventListener('keydown', onKey);

  const onHexInput = (v) => {
    setHexDraft(v);

    <div className="absolute bottom-full mb-3 left-1/2 -translate-x-1/2 z-40">
      <div className="glass-strong modal-in rounded-2xl p-3.5 w-60 shadow-2xl flex flex-col gap-3.5" role="dialog" aria-label={`${label} style`}>

          <div className="flex items-center justify-between mb-2">

          <input
            type="range" min="2" max="48" value={width}
            onChange={(e) => setWidth(parseInt(e.target.value, 10))}

        <div className="h-px bg-slate-700/50" />
        <div>

function DrawToolbar({
  tool, setTool, pen, setPen, color, setColor, width, setWidth,
  canUndo, canRedo, onUndo, onRedo, onClear, hasObjects,
  activeShape, onPickShape,
}) {
  const isDrawTool = tool === 'draw';
  const [shapeMenuOpen, setShapeMenuOpen] = useState(false);
  // Which tool's stroke popover is open: a pen id, 'shape', or null.
  const [styleFor, setStyleFor] = useState(null);
  const closeStyle = useCallback(() => setStyleFor(null), []);
  const anchorRefs = useRef({});
  const anchorRef = (id) => (el) => { anchorRefs.current[id] = el; };
  const refFor = (id) => ({ get current() { return anchorRefs.current[id] || null; } });

  const ActiveShapeIcon = useMemo(() => {
    const found = [...SHAPES_2D, ...SHAPES_3D].find(sh => sh.id === activeShape);
    return found ? found.icon : IShapes;
  }, [activeShape]);

  const PENS = [
    { id: 'ballpoint', title: 'Ballpoint (B)', icon: IPenBall },
    { id: 'highlighter', title: 'Highlighter (H)', icon: IHighlighter },
    { id: 'calligraphy', title: 'Calligraphy (C)', icon: ICalligraphy },
    { id: 'neon', title: 'Neon glow (N)', icon: INeon },
  ];

  // Clicking an inactive pen just selects it; clicking the ACTIVE pen opens its style popover.
  const onPenClick = (id) => {
    setShapeMenuOpen(false);
    if (isDrawTool && pen === id) { setStyleFor((v) => (v === id ? null : id)); return; }
    setStyleFor(null);
    setTool('draw'); setPen(id);
  };
  // Shape: inactive -> shape picker; active -> style popover.
  const onShapeClick = () => {
    if (tool === 'shape') { setShapeMenuOpen(false); setStyleFor((v) => (v === 'shape' ? null : 'shape')); return; }
    setStyleFor(null);
    setShapeMenuOpen((v) => !v);
  };

  const InkDot = () => (
    <span
      className="absolute bottom-1 right-1 w-2 h-2 rounded-full pointer-events-none"
      style={{ background: color, boxShadow: '0 0 0 1.5px rgba(15,20,32,0.95)' }}
    />
  );

  const popover = (id, label) => styleFor === id && (
    <StylePopover
      anchorRef={refFor(id)} label={label}
      color={color} setColor={setColor} width={width} setWidth={setWidth}
      onClose={closeStyle}
    />
  );

  return (
    <div className="glass-strong absolute left-1/2 -translate-x-1/2 bottom-20 z-30 rounded-2xl px-3 py-2.5 flex flex-wrap items-center justify-center gap-x-3 gap-y-2 max-w-[calc(100%-2.5rem)] shadow-2xl">
      {/* Mode tools */}
      <div className="flex items-center gap-1">
        <ToolButton active={tool === 'select'} onClick={() => { setStyleFor(null); setTool('select'); }} title="Select / Move (V)">
          <ICursor size={17} />
        </ToolButton>
        <ToolButton active={tool === 'eraser'} onClick={() => { setStyleFor(null); setTool('eraser'); }} title="Stroke eraser (E)">
          <IEraser size={17} />
        </ToolButton>
      </div>

      <div className="w-px h-7 bg-slate-700/60" />

      {/* Pens — click the active one for width + colour */}
      <div className="flex items-center gap-1">
        {PENS.map((pn) => {
          const active = isDrawTool && pen === pn.id;
          return (
            <div key={pn.id} ref={anchorRef(pn.id)} className="relative">
              <ToolButton active={active} onClick={() => onPenClick(pn.id)} title={active ? `${pn.title} — click for width & colour` : pn.title}>
                <pn.icon size={17} />
              </ToolButton>
              {active && <InkDot />}
              {popover(pn.id, pn.title.replace(/ \(.\)$/, ''))}
            </div>
          );
        })}
      </div>

      <div className="w-px h-7 bg-slate-700/60" />

      {/* Shapes */}
      <div ref={anchorRef('shape')} className="relative">
        <ToolButton active={tool === 'shape'} onClick={onShapeClick} title={tool === 'shape' ? 'Shapes (S) — click for width & colour' : 'Shapes (S)'}>
          <ActiveShapeIcon size={17} />
        </ToolButton>
        {tool === 'shape' && <InkDot />}
        {shapeMenuOpen && (
          <ShapeFlyout
            activeShape={activeShape}
            onPick={(id) => { onPickShape(id); setShapeMenuOpen(false); }}
            onClose={() => setShapeMenuOpen(false)}
          />
        )}
        {popover('shape', 'Shape')}
      </div>

      <div className="w-px h-7 bg-slate-700/60" />

      {/* History + clear */}
      <div className="flex items-center gap-1">
        <ToolButton onClick={onUndo} disabled={!canUndo} title="Undo (Ctrl/Cmd+Z)"><IUndo size={17} /></ToolButton>
        <ToolButton onClick={onRedo} disabled={!canRedo} title="Redo (Ctrl/Cmd+Y)"><IRedo size={17} /></ToolButton>
        <ToolButton onClick={onClear} disabled={!hasObjects} title="Clear board"><IEraseAll size={17} /></ToolButton>
      </div>
    </div>
  );
}

function useDraggable(initialPos, boundsRef) {
  const [pos, setPos] = useState(initialPos);
  const posRef = useRef(initialPos);
  const dragState = useRef(null);

  const onPointerDown = useCallback((e) => {
    if (e.button !== undefined && e.button !== 0) return;
    dragState.current = { startX: e.clientX, startY: e.clientY, origin: posRef.current };
    e.preventDefault();
    e.stopPropagation();
    const onMove = (ev) => {
      if (!dragState.current) return;
      const dx = ev.clientX - dragState.current.startX;
      const dy = ev.clientY - dragState.current.startY;
      let next = { x: dragState.current.origin.x + dx, y: dragState.current.origin.y + dy };
      // boundsRef points at the canvas-stage DOM element; read its live size
      // via getBoundingClientRect() rather than assuming a {width,height} shape.
      const boundsEl = boundsRef?.current;
      if (boundsEl) {
        const rect = boundsEl.getBoundingClientRect();
        next.x = Math.max(4, Math.min(next.x, rect.width - 60));
        next.y = Math.max(4, Math.min(next.y, rect.height - 44));
      }
      posRef.current = next;
      setPos(next);
    };
    const onUp = () => {
      dragState.current = null;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }, [boundsRef]);

  return [pos, onPointerDown];
}

/* ---------- Phase 5: Widget 1 — Stopwatch & Timer ---------- */

function formatStopwatch(ms) {
  const totalCs = Math.floor(ms / 10); // centiseconds
  const cs = totalCs % 100;
  const totalSec = Math.floor(totalCs / 100);
  const s = totalSec % 60;
  const m = Math.floor(totalSec / 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
}
function formatCountdown(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const s = total % 60;
  const m = Math.floor(total / 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function TimerWidget() {
  const [mode, setMode] = useState('stopwatch'); // 'stopwatch' | 'countdown'

  // Stopwatch state
  const [swElapsed, setSwElapsed] = useState(0);
  const [swRunning, setSwRunning] = useState(false);
  const [laps, setLaps] = useState([]);
  const swStartRef = useRef(0);
  const swBaseRef = useRef(0);

  // Countdown state
  const [cdDurationMs, setCdDurationMs] = useState(5 * 60 * 1000);
  const [cdRemaining, setCdRemaining] = useState(5 * 60 * 1000);
  const [cdRunning, setCdRunning] = useState(false);
  const [cdFinished, setCdFinished] = useState(false);
  const [customInput, setCustomInput] = useState('');
  const cdEndRef = useRef(0);

  const rafRef = useRef(null);

  useEffect(() => {
    const tick = () => {
      const now = performance.now();
      if (swRunning) setSwElapsed(swBaseRef.current + (now - swStartRef.current));
      if (cdRunning) {
        const remaining = cdEndRef.current - now;
        if (remaining <= 0) {
          setCdRemaining(0);
          setCdRunning(false);
          setCdFinished(true);
          playChime();
        } else {
          setCdRemaining(remaining);
        }
      }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [swRunning, cdRunning]);

  const startStopwatch = () => { swStartRef.current = performance.now(); setSwRunning(true); };
  const pauseStopwatch = () => { swBaseRef.current = swElapsed; setSwRunning(false); };
  const resetStopwatch = () => { setSwRunning(false); setSwElapsed(0); swBaseRef.current = 0; setLaps([]); };
  const addLap = () => setLaps((prev) => [swElapsed, ...prev]);

  const startCountdown = (ms) => {
    const dur = ms !== undefined ? ms : cdRemaining > 0 ? cdRemaining : cdDurationMs;
    cdEndRef.current = performance.now() + dur;
    setCdRemaining(dur);
    setCdRunning(true);
    setCdFinished(false);
  };
  const pauseCountdown = () => setCdRunning(false);
  const resetCountdown = () => { setCdRunning(false); setCdFinished(false); setCdRemaining(cdDurationMs); };
  const addPreset = (minutes) => {
    const addMs = minutes * 60 * 1000;
    const base = cdRunning ? cdEndRef.current - performance.now() : cdRemaining;
    const next = Math.max(0, base) + addMs;
    setCdDurationMs(next);
    setCdRemaining(next);
    if (cdRunning) cdEndRef.current = performance.now() + next;
    setCdFinished(false);
  };
  const applyCustom = () => {
    const m = parseFloat(customInput);
    if (!Number.isFinite(m) || m <= 0) return;
    const ms = m * 60 * 1000;
    setCdDurationMs(ms);
    setCdRemaining(ms);
    setCdFinished(false);
    setCustomInput('');
  };

  const progress = cdDurationMs > 0 ? Math.max(0, Math.min(1, cdRemaining / cdDurationMs)) : 0;
  const R = 42, CIRC = 2 * Math.PI * R;

  return (
    <div className="w-56">
      <div className="flex rounded-lg bg-slate-950/50 p-0.5 mb-3">
        {['stopwatch', 'countdown'].map((m) => (
          <button
            key={m}
            onClick={() => setMode(m)}
            className={`flex-1 text-[11px] py-1.5 rounded-md transition-colors ${mode === m ? 'bg-cyan-500/20 text-cyan-300' : 'text-slate-500 hover:text-slate-300'}`}
          >
            {m === 'stopwatch' ? 'Stopwatch' : 'Timer'}
          </button>
        ))}
      </div>

      {mode === 'stopwatch' ? (
        <div>
          <div className="mono text-3xl text-center text-slate-100 tabular-nums py-3">{formatStopwatch(swElapsed)}</div>
          <div className="flex gap-2 mb-2">
            {!swRunning ? (
              <button onClick={startStopwatch} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg bg-emerald-500/20 text-emerald-300 text-xs hover:bg-emerald-500/30 transition-colors focus-ring">
                <IPlay size={12} /> Start
              </button>
            ) : (
              <button onClick={pauseStopwatch} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg bg-amber-500/20 text-amber-300 text-xs hover:bg-amber-500/30 transition-colors focus-ring">
                <IPause size={12} /> Pause
              </button>
            )}
            <button onClick={addLap} disabled={!swRunning} className="px-3 py-2 rounded-lg bg-slate-800/60 text-slate-300 text-xs hover:bg-slate-700/60 disabled:opacity-30 transition-colors focus-ring">
              <IFlag size={12} />
            </button>
            <button onClick={resetStopwatch} className="px-3 py-2 rounded-lg bg-slate-800/60 text-slate-300 text-xs hover:bg-slate-700/60 transition-colors focus-ring">
              <IRotateCcw size={12} />
            </button>
          </div>
          {laps.length > 0 && (
            <div className="max-h-24 overflow-y-auto mono text-[11px] text-slate-400 space-y-0.5 border-t border-slate-800 pt-1.5">
              {laps.map((l, i) => (
                <div key={i} className="flex justify-between px-1">
                  <span className="text-slate-600">#{laps.length - i}</span>
                  <span>{formatStopwatch(l)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      ) : (
        <div>
          <div className="relative flex items-center justify-center py-2">
            <svg width="100" height="100" viewBox="0 0 100 100" className="-rotate-90">
              <circle cx="50" cy="50" r={R} fill="none" stroke="rgba(148,163,184,0.15)" strokeWidth="6" />
              <circle
                cx="50" cy="50" r={R} fill="none"
                stroke={cdFinished ? '#f43f5e' : '#38bdf8'}
                strokeWidth="6" strokeLinecap="round"
                strokeDasharray={CIRC}
                strokeDashoffset={CIRC * (1 - progress)}
                style={{ transition: 'stroke-dashoffset 0.2s linear' }}
              />
            </svg>
            <span className={`absolute mono text-lg tabular-nums ${cdFinished ? 'text-rose-400' : 'text-slate-100'}`}>
              {formatCountdown(cdRemaining)}
            </span>
          </div>
          <div className="flex gap-1.5 mb-2">
            {[1, 5, 15].map((m) => (
              <button key={m} onClick={() => addPreset(m)} className="flex-1 py-1.5 rounded-lg bg-slate-800/60 text-slate-300 text-[11px] hover:bg-slate-700/60 transition-colors focus-ring">
                +{m}m
              </button>
            ))}
          </div>
          <div className="flex gap-1.5 mb-2">
            <input
              value={customInput}
              onChange={(e) => setCustomInput(e.target.value.replace(/[^0-9.]/g, ''))}
              onKeyDown={(e) => e.key === 'Enter' && applyCustom()}
              placeholder="Custom minutes"
              className="flex-1 min-w-0 bg-slate-950/60 border border-slate-700/60 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-cyan-500/50"
            />
            <button onClick={applyCustom} className="px-2.5 py-1.5 rounded-lg bg-slate-800/60 text-slate-300 text-xs hover:bg-slate-700/60 transition-colors focus-ring">Set</button>
          </div>
          <div className="flex gap-2">
            {!cdRunning ? (
              <button onClick={() => startCountdown()} disabled={cdRemaining <= 0} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg bg-emerald-500/20 text-emerald-300 text-xs hover:bg-emerald-500/30 disabled:opacity-30 transition-colors focus-ring">
                <IPlay size={12} /> Start
              </button>
            ) : (
              <button onClick={pauseCountdown} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg bg-amber-500/20 text-amber-300 text-xs hover:bg-amber-500/30 transition-colors focus-ring">
                <IPause size={12} /> Pause
              </button>
            )}
            <button onClick={resetCountdown} className="px-3 py-2 rounded-lg bg-slate-800/60 text-slate-300 text-xs hover:bg-slate-700/60 transition-colors focus-ring">
              <IRotateCcw size={12} />
            </button>
          </div>
          {cdFinished && <div className="text-center text-rose-400 text-xs mt-2 animate-pulse">Time's up!</div>}
        </div>
      )}
    </div>
  );
}

/* ---------- Phase 5: Widget 2 — Scientific Calculator ---------- */

function CalculatorWidget() {
  const [expr, setExpr] = useState('');
  const [result, setResult] = useState(null);
  const [error, setError] = useState(false);

  const lastCharIsOp = () => /[+\-*/%^]$/.test(expr);
  const lastCharIsOpenParen = () => /\($/.test(expr);

  const append = (token) => {
    setError(false);
    setExpr((prev) => {
      if (/[+\-*/%^]/.test(token) && lastCharIsOp()) return prev.slice(0, -1) + token;
      return prev + token;
    });
  };

  const applyFn = (fn) => {
    setError(false);
    try {
      const base = expr.length ? safeEvalExpr(expr) : 0;
      let val;
      switch (fn) {
        case 'sin': val = Math.sin(base * Math.PI / 180); break;
        case 'cos': val = Math.cos(base * Math.PI / 180); break;
        case 'tan': val = Math.tan(base * Math.PI / 180); break;
        case 'sqrt': if (base < 0) throw new Error('neg sqrt'); val = Math.sqrt(base); break;
        case 'sq': val = base * base; break;
        case 'ln': if (base <= 0) throw new Error('bad ln'); val = Math.log(base); break;
        case 'log': if (base <= 0) throw new Error('bad log'); val = Math.log10(base); break;
        default: return;
      }
      val = Math.round(val * 1e10) / 1e10;
      setExpr(String(val));
      setResult(null);
    } catch (e) {
      setError(true);
    }
  };

  const backspace = () => setExpr((prev) => prev.slice(0, -1));
  const clearAll = () => { setExpr(''); setResult(null); setError(false); };
  const evaluate = () => {
    try {
      if (!expr.length) return;
      const val = safeEvalExpr(expr);
      const rounded = Math.round(val * 1e10) / 1e10;
      setResult(rounded);
      setError(false);
    } catch (e) {
      setError(true);
      setResult(null);
    }
  };

  const onKeyDown = (e) => {
    if (/[0-9.+\-*/%^()]/.test(e.key)) { append(e.key); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === '=') { evaluate(); e.preventDefault(); }
    else if (e.key === 'Backspace') { backspace(); e.preventDefault(); }
    else if (e.key === 'Escape') { clearAll(); e.preventDefault(); }
  };

  const Key = ({ label, onClick, className = '', span = 1 }) => (
    <button
      onClick={onClick}
      className={`calc-key py-2.5 focus-ring ${className}`}
      style={{ gridColumn: span > 1 ? `span ${span}` : undefined }}
    >
      {label}
    </button>
  );

  return (
    <div className="w-64" tabIndex={0} onKeyDown={onKeyDown}>
      <div className="bg-slate-950/60 rounded-lg px-3 py-3 mb-3 text-right border border-slate-800/60">
        <div className="mono text-xs text-slate-500 h-4 truncate">{expr || '0'}</div>
        <div className={`mono text-2xl truncate ${error ? 'text-rose-400' : 'text-slate-100'}`}>
          {error ? 'Error' : result !== null ? result : '\u00A0'}
        </div>
      </div>

      <div className="grid grid-cols-4 gap-1.5 mb-1.5">
        <Key label="sin" className="fn" onClick={() => applyFn('sin')} />
        <Key label="cos" className="fn" onClick={() => applyFn('cos')} />
        <Key label="tan" className="fn" onClick={() => applyFn('tan')} />
        <Key label="AC" className="op" onClick={clearAll} />

        <Key label="ln" className="fn" onClick={() => applyFn('ln')} />
        <Key label="log" className="fn" onClick={() => applyFn('log')} />
        <Key label="√" className="fn" onClick={() => applyFn('sqrt')} />
        <Key label="⌫" className="op" onClick={backspace} />

        <Key label="x²" className="fn" onClick={() => applyFn('sq')} />
        <Key label="(" onClick={() => append('(')} />
        <Key label=")" onClick={() => append(')')} />
        <Key label="÷" className="op" onClick={() => append('/')} />

        <Key label="7" onClick={() => append('7')} />
        <Key label="8" onClick={() => append('8')} />
        <Key label="9" onClick={() => append('9')} />
        <Key label="×" className="op" onClick={() => append('*')} />

        <Key label="4" onClick={() => append('4')} />
        <Key label="5" onClick={() => append('5')} />
        <Key label="6" onClick={() => append('6')} />
        <Key label="−" className="op" onClick={() => append('-')} />

        <Key label="1" onClick={() => append('1')} />
        <Key label="2" onClick={() => append('2')} />
        <Key label="3" onClick={() => append('3')} />
        <Key label="+" className="op" onClick={() => append('+')} />

        <Key label="π" className="fn" onClick={() => append(String(Math.PI))} />
        <Key label="0" onClick={() => append('0')} />
        <Key label="." onClick={() => append('.')} />
        <Key label="=" className="accent" onClick={evaluate} />
      </div>
      <div className="grid grid-cols-2 gap-1.5">
        <Key label="%" className="fn" onClick={() => append('%')} />
        <Key label="±" className="fn" onClick={() => setExpr((p) => (p.startsWith('-') ? p.slice(1) : '-' + p))} />
      </div>
    </div>
  );
}

/* ---------- Phase 5: Widget 3 — Laser Pointer trail overlay ---------- */

function LaserPointerOverlay({ containerRef, color = '#38bdf8' }) {
  const canvasRef = useRef(null);
  const pointsRef = useRef([]); // {x, y, t}
  const rafRef = useRef(null);
  const activeRef = useRef(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    const container = containerRef.current;
    if (!canvas || !container) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    const resize = () => {
      canvas.width = container.clientWidth * dpr;
      canvas.height = container.clientHeight * dpr;
      canvas.style.width = container.clientWidth + 'px';
      canvas.style.height = container.clientHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(container);

    const LIFETIME = 800;
    const draw = () => {
      const now = performance.now();
      pointsRef.current = pointsRef.current.filter((p) => now - p.t < LIFETIME);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const pts = pointsRef.current;
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i - 1], p1 = pts[i];
        const age = now - p1.t;
        const alpha = Math.max(0, 1 - age / LIFETIME);
        if (alpha <= 0) continue;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.strokeStyle = color;
        ctx.globalAlpha = alpha * 0.8;
        ctx.lineWidth = 3 + alpha * 4;
        ctx.lineCap = 'round';
        ctx.shadowColor = color;
        ctx.shadowBlur = 12 * alpha;
        ctx.stroke();
      }
      // head dot
      if (pts.length) {
        const head = pts[pts.length - 1];
        const age = now - head.t;
        const alpha = Math.max(0, 1 - age / LIFETIME);
        ctx.beginPath();
        ctx.arc(head.x, head.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = Math.min(1, alpha + 0.3);
        ctx.shadowBlur = 16;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);

    const rect = () => container.getBoundingClientRect();
    const addPoint = (clientX, clientY) => {
      const r = rect();
      pointsRef.current.push({ x: clientX - r.left, y: clientY - r.top, t: performance.now() });
      if (pointsRef.current.length > 200) pointsRef.current.shift();
    };
    // Listens on its own canvas (it sits above Fabric's canvas while active),
    // so drawing a laser trail never reaches Fabric and can't create objects
    // or touch the undo/redo stack.
    const onDown = (e) => { activeRef.current = true; addPoint(e.clientX, e.clientY); };
    const onMove = (e) => { if (activeRef.current) addPoint(e.clientX, e.clientY); };
    const onUp = () => { activeRef.current = false; };

    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);

    return () => {
      cancelAnimationFrame(rafRef.current);
      ro.disconnect();
      canvas.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
  }, [containerRef, color]);

  return <canvas ref={canvasRef} className="laser-trail-canvas" />;
}

/* ---------- Phase 5: Widget dock ---------- */

function WidgetDock({ open, onToggle, active, onLaunch, dropUp, dropSide }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) onToggle(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open, onToggle]);

  const items = [
    { id: 'timer', label: 'Timer / Stopwatch', icon: ITimerIcon },
    { id: 'calculator', label: 'Calculator', icon: ICalcIcon },
    { id: 'laser', label: 'Laser Pointer', icon: ILaserIcon },
  ];

  return (
    <div className="relative">
      <button
        onClick={() => onToggle((v) => !v)}
        title="Tools / Widgets"
        className={`flex items-center gap-1.5 text-xs mono px-2.5 py-1.5 rounded-md border transition-colors focus-ring ${
          open ? 'text-cyan-300 border-cyan-500/40 bg-cyan-500/10' : 'text-slate-400 border-slate-700/60 hover:border-cyan-500/40 hover:text-cyan-300'
        }`}
      >
        <IWidgets size={13} /> Tools
      </button>
      {open && (
        <div
          ref={ref}
          className={`glass-strong modal-in absolute rounded-xl p-1.5 w-56 shadow-2xl z-40 ${
            dropUp ? 'bottom-full mb-2' : 'top-full mt-2'
          } ${dropSide === 'right' ? 'right-0' : 'left-0'}`}
        >
          {items.map((it) => (
            <button
              key={it.id}
              onClick={() => onLaunch(it.id)}
              className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm text-slate-200 hover:bg-slate-800/60 transition-colors focus-ring"
            >
              <it.icon size={15} className={active[it.id] ? 'text-cyan-300' : 'text-slate-500'} />
              {it.label}
              {active[it.id] && <span className="ml-auto w-1.5 h-1.5 rounded-full bg-cyan-400" />}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}
