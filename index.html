        const next = computePageFrame(page.w, page.h, W, H);
        canvas.discardActiveObject();
        reframeObjects(canvas.getObjects().filter((o) => o.nbKind !== 'bgImage'), frameRef.current, next);
        frameRef.current = next;
        placeBgImage(bgImageObjRef.current, page, next);
      }
      canvas.requestRenderAll();
    });
    ro.observe(wrap);

    return () => {
      stopGlowPulse();
      wrap.removeEventListener('touchstart', onTS, true);
      wrap.removeEventListener('touchmove', onTM, true);
      wrap.removeEventListener('touchend', onTE, true);
      wrap.removeEventListener('touchcancel', onTE, true);
      wrap.removeEventListener('wheel', onWheel, true);
      ro.disconnect();
      canvas.dispose();
      fabricRef.current = null;
    };
    // Mount-only: one Fabric canvas lives for the whole CanvasScreen session;
    // switching slides swaps its contents via the imperative handle instead
    // of tearing down and recreating the canvas (cheaper, no flash).
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* ---- React to tool mode changes ---- */
  useEffect(() => {
    const c = fabricRef.current;
    if (!c) return;
    const isSelect = tool === 'select';
    c.selection = isSelect;
    c.skipTargetFind = !isSelect;
    c.forEachObject((o) => {
      if (o.nbKind === 'bgImage' || o.nbKind === 'laser') return; // locked background / temporary laser never selectable
      o.selectable = isSelect;
      o.evented = isSelect;
    });
    if (!isSelect) { c.discardActiveObject(); }
    c.defaultCursor = (tool === 'draw' || tool === 'shape') ? 'crosshair' : tool === 'eraser' ? 'cell' : tool === 'text' ? 'text' : 'default';
    c.hoverCursor = isSelect ? 'move' : c.defaultCursor;
    c.requestRenderAll();
  }, [tool]);

  /* ---- Rotation handle for the selected 3D wireframe object ---- */
  const updateRotateHandle = useCallback(() => {
    const c = fabricRef.current;
    if (!c) { setRotateHandle(null); return; }
    const active = c.getActiveObject();
    if (!active || !active.nb3D || c.getActiveObjects().length !== 1) { setRotateHandle(null); return; }
    const br = nbScreenRect(c, active);
    setRotateHandle({
      objId: active,
      x: br.left + br.width / 2,
      y: br.top + br.height + 22,
      yaw: active.nbYaw, tilt: active.nbTilt,
    });
  }, []);

  useEffect(() => {
    const c = fabricRef.current;
    if (!c) return;
    const handler = () => updateRotateHandle();
    c.on('selection:created', handler);
    c.on('selection:updated', handler);
    c.on('selection:cleared', handler);
    c.on('object:moving', handler);
    c.on('object:scaling', handler);
    c.on('object:rotating', handler);
    c.on('after:render', handler);
    return () => {
      c.off('selection:created', handler);
      c.off('selection:updated', handler);
      c.off('selection:cleared', handler);
      c.off('object:moving', handler);
      c.off('object:scaling', handler);
      c.off('object:rotating', handler);
      c.off('after:render', handler);
    };
  }, [updateRotateHandle]);

  /* Floating 'Erase' chip over the current selection: select, then one click removes it. */
  const eraseSelection = useCallback(() => {
    const c = fabricRef.current;
    if (!c) return;
    const act = c.getActiveObjects().filter((o) => o.nbKind !== 'bgImage');
    if (!act.length) return;
    c.discardActiveObject();
    act.forEach((o) => c.remove(o));
    c.requestRenderAll();
    setSelChip(null);
    pushHistory();
  }, [pushHistory]);

  useEffect(() => {
    const c = fabricRef.current;
    if (!c) return;
    const update = () => {
      const a = c.getActiveObject();
      if (!a || a.isEditing || a.nbKind === 'bgImage' || toolRef.current !== 'select') {
        setSelChip((prev) => (prev ? null : prev));
        return;
      }
      const br = nbScreenRect(c, a);
      const n = c.getActiveObjects().length;
      const x = Math.round(br.left + br.width / 2);
      const y = Math.round(Math.max(8, br.top - 40));
      setSelChip((prev) => (prev && prev.x === x && prev.y === y && prev.n === n ? prev : { x, y, n }));
    };
    const evs = ['selection:created', 'selection:updated', 'selection:cleared', 'object:moving', 'object:scaling',
      'object:rotating', 'object:modified', 'text:editing:entered', 'text:editing:exited', 'after:render'];
    evs.forEach((e) => c.on(e, update));
    update();
    return () => evs.forEach((e) => c.off(e, update));
  }, [tool]);

  const rebuild3DPathRef = useRef(null);

  const setObjectYawTilt = useCallback((obj, yaw, tilt) => {
    const c = fabricRef.current;
    if (!c || !rebuild3DPathRef.current) return;
    rebuild3DPathRef.current(obj, yaw, tilt);
    c.requestRenderAll();
    pushHistoryDebounced();
    updateRotateHandle();
  }, [updateRotateHandle]);

  /* Newly finished strokes/objects should respect current mode; also re-apply after history restore */
  useEffect(() => {
    const c = fabricRef.current;
    if (!c) return;
    const apply = () => {
      const isSelect = toolRef.current === 'select';
      c.forEachObject((o) => { if (o.nbKind === 'bgImage' || o.nbKind === 'laser') return; o.selectable = isSelect; o.evented = isSelect; });
    };
    c.on('after:render', apply);
    return () => c.off('after:render', apply);
  }, []);

  /* ---- Track whether anything is selected (drives the Copy button) ---- */
  useEffect(() => {
    const c = fabricRef.current;
    if (!c) return;
    const sync = () => {
      const a = c.getActiveObject();
      setHasSelection(!!a && a.nbKind !== 'bgImage');
    };
    c.on('selection:created', sync);
    c.on('selection:updated', sync);
    c.on('selection:cleared', sync);
    return () => {
      c.off('selection:created', sync);
      c.off('selection:updated', sync);
      c.off('selection:cleared', sync);
    };
  }, []);

  /* ---- Object clipboard: copy on one page, paste on any other ---- */
  const copySelection = useCallback(() => {
    const c = fabricRef.current;
    if (!c) return false;
    const active = c.getActiveObject();
    if (!active || active.nbKind === 'bgImage' || active.isEditing) return false;
    // clone() works for single objects and for multi-selections (ActiveSelection).
    active.clone((cloned) => {
      NB_CLIPBOARD.obj = cloned;
      setHasClipboard(true);
    }, NB_PROPS);
    return true;
  }, []);

  const pasteClipboard = useCallback(() => {
    const c = fabricRef.current;
    const clip = NB_CLIPBOARD.obj;
    if (!c || !clip) return false;
    clip.clone((clone) => {
      c.discardActiveObject();
      clone.set({ left: clone.left + 16, top: clone.top + 16, evented: true });
      // Switch to Select so the pasted objects can be moved immediately.
      toolRef.current = 'select';
      c.skipTargetFind = false;
      c.selection = true;
      if (clone.type === 'activeSelection') {
        clone.canvas = c;
        clone.forEachObject((o) => { o.selectable = true; o.evented = true; c.add(o); });
        clone.setCoords();
      } else {
        clone.selectable = true;
        c.add(clone);
      }
      // Stagger repeated pastes so copies don't stack exactly on top of each other.
      clip.set({ left: clip.left + 16, top: clip.top + 16 });
      c.setActiveObject(clone);
      c.requestRenderAll();
      setTool('select');
      pushHistory();
    }, NB_PROPS);
    return true;
  }, [pushHistory]);

  /* ---- Keyboard shortcuts ---- */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      // Also covers fabric's hidden editing <textarea>, so typing/Backspace/Ctrl+C inside a text box is untouched.
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      const mod = e.ctrlKey || e.metaKey;
      const lk = String(e.key || '').toLowerCase();
      if (mod && lk === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
      if (mod && (lk === 'y' || (lk === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
      if (mod && lk === 'a') {
        const c = fabricRef.current;
        if (c) {
          e.preventDefault();
          setTool('select');
          const objs = c.getObjects().filter((o) => o.nbKind !== 'bgImage' && !NB_EPHEMERAL(o));
          c.discardActiveObject();
          objs.forEach((o) => { o.selectable = true; o.evented = true; });
          if (objs.length === 1) c.setActiveObject(objs[0]);
          else if (objs.length > 1) c.setActiveObject(new fabric.ActiveSelection(objs, { canvas: c }));
          c.requestRenderAll();
        }
        return;
      }
      if (mod && lk === 'c') { if (copySelection()) e.preventDefault(); return; }
      if (mod && lk === 'v') { if (NB_CLIPBOARD.obj) { e.preventDefault(); pasteClipboard(); } return; }
      if (mod) return;
      const k = lk;
      if (k === 'v') setTool('select');
      else if (k === 'e') setTool('eraser');
      else if (k === 't') setTool('text');
      else if (k === 's') setTool('shape');
      else if (k === 'b') { setTool('draw'); setPen('ballpoint'); }
      else if (k === 'h') { setTool('draw'); setPen('highlighter'); }
      else if (k === 'c') { setTool('draw'); setPen('calligraphy'); }
      else if (k === 'n') { setTool('draw'); setPen('neon'); }
      else if (k === 'd') { setTool('draw'); setPen('dashed'); }
      else if (k === 'm') { setTool('draw'); setPen('emoji'); }
      else if (k === 'l') { setTool('draw'); setPen('laser'); }
      else if (k === 'escape') { const c = fabricRef.current; if (c) { c.discardActiveObject(); c.requestRenderAll(); } }
      else if (k.startsWith('arrow')) {
        const c = fabricRef.current;
        const act = c ? c.getActiveObject() : null;
        if (act && act.nbKind !== 'bgImage') {
          e.preventDefault();
          const d = e.shiftKey ? 10 : 2;
          act.set({ left: act.left + (k === 'arrowright' ? d : k === 'arrowleft' ? -d : 0), top: act.top + (k === 'arrowdown' ? d : k === 'arrowup' ? -d : 0) });
          act.setCoords(); c.requestRenderAll(); pushHistoryDebounced();
        }
      }
      else if (k === 'delete' || k === 'backspace') {
        const c = fabricRef.current;
        if (!c) return;
        const active = c.getActiveObjects();
        if (active.length) {
          e.preventDefault();
          active.forEach((o) => c.remove(o));
          c.discardActiveObject();
          c.requestRenderAll();
          pushHistory();
        }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undo, redo, pushHistory, copySelection, pasteClipboard]);

  /* ---- Clear board (with confirm; undo also restores it) ---- */
  const doClear = useCallback(() => {
    const c = fabricRef.current;
    if (!c) return;
    c.discardActiveObject();
    c.getObjects().slice().forEach((o) => c.remove(o));
    c.requestRenderAll();
    pushHistory();
    setConfirmClear(false);
  }, [pushHistory]);

  const [bgColor, setBgColorState] = useState(initialBg || '#0d3824');

  /* ---- Imperative API used by CanvasScreen to drive multi-slide switching ---- */
  useImperativeHandle(ref, () => ({
    /* Serialize the current canvas (objects + bg color + bg image ref) into a slide-shaped patch. */
    saveIntoSlide(slide) {
      const c = fabricRef.current;
      if (!c) return slide;
      const bgImg = bgImageObjRef.current;
      // Temporarily pull the locked background image out so it never ends up
      // in the per-slide vector JSON (it's tracked separately as slide.bgImage).
      if (bgImg) c.remove(bgImg);
      const hasObjects = c.getObjects().length > 0;
      let json = hasObjects ? c.toJSON(NB_PROPS) : null;
      if (json) { json.objects = (json.objects || []).filter((o) => o.nbKind !== 'laser'); if (!json.objects.length) json = null; }
      // PDF slides persist vectors in page space (frame-independent).
      if (json && pageRef.current) reframeObjects(json.objects || [], frameRef.current, PAGE_SPACE);
      if (bgImg) { c.add(bgImg); c.sendToBack(bgImg); }
      return { ...slide, bg: bgColor, json, history: historyRef.current };
    },
    /* Load a slide's saved state into the live canvas (used on slide switch). */
    loadSlide(slide) {
      const c = fabricRef.current;
      if (!c) return;
      const token = ++loadTokenRef.current;
      historyRef.current.locked = true;
      c.discardActiveObject();
      c.getObjects().slice().forEach((o) => c.remove(o));
      bgImageObjRef.current = null;
      pageRef.current = null;
      frameRef.current = { ...PAGE_SPACE };
      c.setViewportTransform([1, 0, 0, 1, 0, 0]);
      setViewZoom(1); setIsPdfView(false);
      c.backgroundColor = slide.bg;
      setBgColorState(slide.bg);

      // Keep default ink visible: swap white<->near-black when moving between
      // dark and light blank pages (custom colours are never touched).
      if (!slide.bgImage) {
        const light = isLightColor(slide.bg);
        const cur = String(colorRef.current).toLowerCase();
        if (light && cur === '#ffffff') setColor('#0a0a0a');
        else if (!light && cur === '#0a0a0a') setColor('#ffffff');
      }

      const finishLoad = () => {
        historyRef.current = slide.history && slide.history.stack
          ? { stack: slide.history.stack, index: slide.history.index, locked: false }
          : { stack: [], index: -1, locked: false };
        if (historyRef.current.stack.length === 0) {
          historyRef.current.locked = false;
          suppressNotifyRef.current = true;
          pushHistory();
          suppressNotifyRef.current = false;
        }
        historyRef.current.locked = false;
        syncHistoryUI();
        c.requestRenderAll();
      };

      const addVectors = (img) => {
        fabric.util.enlivenObjects(slide.json.objects || [], (objs) => {
          if (token !== loadTokenRef.current) return;
          // Saved in page space -> project into the current stage frame.
          if (img) reframeObjects(objs, PAGE_SPACE, frameRef.current);
          objs.forEach((o) => c.add(o));
          const isSelect = toolRef.current === 'select';
          c.forEachObject((o) => { if (o !== img) { o.selectable = isSelect; o.evented = isSelect; } });
          finishLoad();
        });
      };

      if (slide.bgImage) {
        fabric.Image.fromURL(slide.bgImage, (img) => {
          if (token !== loadTokenRef.current) return;
          // Contain / letterbox: the page keeps its true aspect ratio, centred
          // in the stage, with the slide background showing in the bars.
          const page = { w: slide.bgImageW || img.width, h: slide.bgImageH || img.height };
          pageRef.current = page;
          frameRef.current = computePageFrame(page.w, page.h, c.getWidth(), c.getHeight());
          img.set({ selectable: false, evented: false, nbKind: 'bgImage' });
          placeBgImage(img, page, frameRef.current);
          c.add(img);
          c.sendToBack(img);
          bgImageObjRef.current = img;
          setIsPdfView(true);
          if (slide.json) addVectors(img);
          else finishLoad();
        });
      } else if (slide.json) {
        addVectors(null);
      } else {
        finishLoad();
      }
    },
    setBackgroundColor(hex) {
      const c = fabricRef.current;
      if (!c) return;
      c.backgroundColor = hex;
      c.requestRenderAll();
      setBgColorState(hex);
      pushHistory();
    },
    getThumbnail() {
      const c = fabricRef.current;
      if (!c) return null;
      const vpt = c.viewportTransform.slice();
      c.setViewportTransform([1, 0, 0, 1, 0, 0]);
      const url = c.toDataURL({ format: 'jpeg', quality: 0.55, multiplier: 0.22 });
      c.setViewportTransform(vpt);
      return url;
    },
    getBackgroundColor() { return bgColor; },
    /* Current page as a PNG data URL (temporary laser strokes are hidden). */
    getPagePng() {
      const c = fabricRef.current;
      if (!c) return null;
      c.discardActiveObject();
      const lasers = c.getObjects().filter(NB_EPHEMERAL);
      lasers.forEach((o) => { o.visible = false; });
      const vpt = c.viewportTransform.slice();
      c.setViewportTransform([1, 0, 0, 1, 0, 0]);
      const url = c.toDataURL({ format: 'png', multiplier: 2 });
      c.setViewportTransform(vpt);
      lasers.forEach((o) => { o.visible = true; });
      c.requestRenderAll();
      return url;
    },
    /* True while a shape / erase gesture is mid-flight (auto-save waits so it never captures a half-drawn shape). */
    isBusy() { const f = gestureBusyRef.current; return !!(f && f()); },

    /* Tools menu -> Image Upload. Resolves once the picture is on the board. */
    addImageFromFile(file) {
      return new Promise((resolve, reject) => {
        const c = fabricRef.current;
        if (!c) { reject(new Error('The canvas is not ready yet.')); return; }
        if (!file || !/^image\//.test(file.type || '')) {
          reject(new Error('Please choose an image file (PNG, JPG, GIF, WebP or SVG).'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read that image file.'));
        reader.onload = () => {
          const raw = reader.result;
          const probe = new Image();
          probe.onerror = () => reject(new Error('That image could not be decoded.'));
          probe.onload = () => {
            const nw = probe.naturalWidth || probe.width;
            const nh = probe.naturalHeight || probe.height;
            if (!nw || !nh) { reject(new Error('That image has no readable size.')); return; }
            // Downscale big photos so undo history and PDF export stay light.
            const MAX = 1400;
            let src = raw;
            if (file.type !== 'image/svg+xml' && Math.max(nw, nh) > MAX) {
              const k = MAX / Math.max(nw, nh);
              const off = document.createElement('canvas');
              off.width = Math.round(nw * k);
              off.height = Math.round(nh * k);
              off.getContext('2d').drawImage(probe, 0, 0, off.width, off.height);
              src = off.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85);
            }
            fabric.Image.fromURL(src, (img, isError) => {
              if (isError || !img || !img.width || !img.height) { reject(new Error('That image could not be placed.')); return; }
              const k = Math.min(1, (c.getWidth() * 0.6) / img.width, (c.getHeight() * 0.6) / img.height);
              img.set({
                left: c.getWidth() / 2, top: c.getHeight() / 2,
                originX: 'center', originY: 'center',
                scaleX: k, scaleY: k,
                nbKind: 'image', selectable: true, evented: true,
              });
              toolRef.current = 'select';
              c.skipTargetFind = false;
              c.selection = true;
              c.add(img);
              c.setActiveObject(img);
              setTool('select');
              c.requestRenderAll();
              pushHistory();
              resolve();
            });
          };
          probe.src = raw;
        };
        reader.readAsDataURL(file);
      });
    },

    /* Tools menu -> Table: a 4 x 3 grid of ruled lines, moved and scaled as one object. */
    addTable() {
      const c = fabricRef.current;
      if (!c) return;
      const W = c.getWidth(), H = c.getHeight();
      const cols = 4, rows = 3;
      const tw = Math.max(160, Math.min(W * 0.7, 560));
      const th = Math.max(110, Math.min(H * 0.5, tw * 0.55));
      const ln = { stroke: colorRef.current, strokeWidth: 2, strokeUniform: true };
      const parts = [new fabric.Rect({ left: 0, top: 0, width: tw, height: th, fill: 'transparent', ...ln })];
      for (let i = 1; i < cols; i++) parts.push(new fabric.Line([tw * i / cols, 0, tw * i / cols, th], ln));
      for (let j = 1; j < rows; j++) parts.push(new fabric.Line([0, th * j / rows, tw, th * j / rows], ln));
      const table = new fabric.Group(parts, {
        left: W / 2, top: H / 2, originX: 'center', originY: 'center',
        nbKind: 'table', selectable: true, evented: true,
      });
      toolRef.current = 'select';
      c.skipTargetFind = false;
      c.selection = true;
      c.add(table);
      c.setActiveObject(table);
      setTool('select');
      pushHistory();
      c.requestRenderAll();
    },

    /* Tools menu -> Sticky Note: a coloured, wrapping, editable text box. */
    addStickyNote() {
      const c = fabricRef.current;
      if (!c) return;
      const n = stickyCounterRef.current++;
      const color = STICKY_COLORS[n % STICKY_COLORS.length];
      const W = c.getWidth(), H = c.getHeight();
      const body = 'Type your note…';
      // Blank first/last lines act as top/bottom padding inside the coloured box.
      const note = new fabric.Textbox('\n' + body + '\n', {
        left: W / 2 + (n % 4) * 18 - 27,
        top: H / 2 + (n % 4) * 18 - 27,
        originX: 'center', originY: 'center',
        width: Math.max(150, Math.min(230, W * 0.45)),
        fontSize: 22, lineHeight: 1.3, textAlign: 'center',
        fontFamily: TEXT_FONT, fill: '#1f2937', backgroundColor: color,
        shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.35)', blur: 14, offsetX: 3, offsetY: 6 }),
        nbKind: 'sticky', selectable: true, evented: true,
      });
      toolRef.current = 'select';
      c.skipTargetFind = false;
      c.selection = true;
      c.add(note);
      c.setActiveObject(note);
      setTool('select');
      pushHistory();
      note.enterEditing();
      // Pre-select just the placeholder words so typing replaces them but keeps the padding lines.
      note.setSelectionStart(1);
      note.setSelectionEnd(1 + body.length);
      c.requestRenderAll();
    },
    /* Live Share: true when the canvas has re-rendered since the last call. */
    liveDirty() {
      const c = fabricRef.current;
      if (!c) return false;
      if (!c.__nbLive) { c.__nbLive = { d: true }; c.on('after:render', () => { c.__nbLive.d = true; }); }
      const d = c.__nbLive.d; c.__nbLive.d = false; return d;
    },
    /* Live Share: what the host sees right now, as a JPEG ArrayBuffer no wider than maxW. */
    getLiveFrame(maxW) {
      const c = fabricRef.current;
      if (!c) return Promise.resolve(null);
      const src = c.lowerCanvasEl;
      const k = Math.min(1, maxW / Math.max(1, src.width));
      const off = document.createElement('canvas');
      off.width = Math.max(1, Math.round(src.width * k)); off.height = Math.max(1, Math.round(src.height * k));
      const g = off.getContext('2d');
      g.fillStyle = c.backgroundColor && typeof c.backgroundColor === 'string' ? c.backgroundColor : '#ffffff';
      g.fillRect(0, 0, off.width, off.height);
      g.drawImage(src, 0, 0, off.width, off.height);
      return new Promise((resolve) => off.toBlob((b) => (b ? b.arrayBuffer().then(resolve, () => resolve(null)) : resolve(null)), 'image/jpeg', 0.72));
    },

    /* AI assistant: drop several generated notes on the board in a tidy grid. */
    addAiNotes(texts) {
      const c = fabricRef.current;
      if (!c || !texts || !texts.length) return;
      const W = c.getWidth(), H = c.getHeight();
      const cols = Math.min(3, texts.length), cw = Math.max(150, Math.min(230, W * 0.28));
      const objs = texts.map((t, i) => {
        const n = stickyCounterRef.current++;
        const col = i % cols, row = Math.floor(i / cols);
        return new fabric.Textbox('\n' + String(t).slice(0, 400) + '\n', {
          left: W / 2 + (col - (cols - 1) / 2) * (cw + 16), top: 70 + row * 190,
          originX: 'center', originY: 'top', width: cw,
          fontSize: 17, lineHeight: 1.3, textAlign: 'center',
          fontFamily: TEXT_FONT, fill: '#1f2937', backgroundColor: STICKY_COLORS[n % STICKY_COLORS.length],
          shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.35)', blur: 14, offsetX: 3, offsetY: 6 }),
          nbKind: 'sticky', selectable: true, evented: true,
        });
      });
      objs.forEach((o) => c.add(o));
      pushHistory();
      c.requestRenderAll();
    },
  }), [bgColor, pushHistory, syncHistoryUI]);

  return (
    <div
      className="canvas-stage flex-1 min-h-0 relative overflow-hidden"
      style={{ background: bgColor }}
    >
      {/* Sizing box is absolutely positioned so the canvas can never
          influence its parent's height (prevents a resize feedback loop). */}
      <div ref={wrapRef} className="absolute inset-0">
        <canvas ref={canvasElRef} />
      </div>
      {gridMode !== 'off' && (() => {
        const ink = isLightColor(bgColor) ? '0,0,0' : '255,255,255';
        return <><div className="pointer-events-none absolute inset-0" style={nbGridStyle(gridMode, gridSize, ink)} />{gridMode === 'graph' && <GridAxes ink={ink} />}</>;
      })()}
      {isPdfView && !viewLocked && (
        <div className="glass-strong absolute z-30 right-3 top-1/2 -translate-y-1/2 flex flex-col-reverse items-center gap-0.5 rounded-xl px-1 py-1 text-xs text-slate-200 select-none shadow-xl" style={{ touchAction: 'none', animation: 'nb-pop .28s var(--ease-out)' }}>
          <button disabled={!!viewLocked} title="Zoom out" aria-label="Zoom out" className="w-8 h-8 disabled:opacity-30 disabled:pointer-events-none rounded-lg hover:bg-white/10 focus-ring text-base leading-none"
            onClick={() => { const c = fabricRef.current; if (!c) return; const v = c.viewportTransform, cx = c.getWidth() / 2, cy = c.getHeight() / 2, z = v[0] / 1.25; c.nbSetView(z, cx - (cx - v[4]) / v[0] * z, cy - (cy - v[5]) / v[3] * z); }}>−</button>
          <button disabled={!!viewLocked} title="Fit page" aria-label="Reset zoom" className="w-11 h-8 disabled:opacity-30 disabled:pointer-events-none rounded-lg hover:bg-white/10 focus-ring mono"
            onClick={() => { const c = fabricRef.current; if (c) c.nbSetView(1, 0, 0); }}>{Math.round(viewZoom * 100)}%</button>
          <button disabled={!!viewLocked} title="Zoom in" aria-label="Zoom in" className="w-8 h-8 disabled:opacity-30 disabled:pointer-events-none rounded-lg hover:bg-white/10 focus-ring text-base leading-none"
            onClick={() => { const c = fabricRef.current; if (!c) return; const v = c.viewportTransform, cx = c.getWidth() / 2, cy = c.getHeight() / 2, z = v[0] * 1.25; c.nbSetView(z, cx - (cx - v[4]) / v[0] * z, cy - (cy - v[5]) / v[3] * z); }}>+</button>
        </div>
      )}
      {selChip && (
        <button
          onClick={eraseSelection}
          title="Erase selected (Delete)"
          className="glass-strong absolute z-30 -translate-x-1/2 flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs text-rose-300 hover:text-rose-200 hover:bg-rose-500/20 focus-ring shadow-xl"
          style={{ left: selChip.x, top: selChip.y }}
        >
          <ITrash size={13} /> Erase{selChip.n > 1 ? ` ${selChip.n}` : ''}
        </button>
      )}
      {!hasObjects && (
        <div className="pointer-events-none absolute inset-0 flex items-center justify-center">
          <div className="text-center px-6">
            <div className="mono text-[11px] tracking-[0.25em] text-white/30 mb-2">CANVAS READY</div>
            <div className="text-white/40 text-sm">Pick a pen below and start drawing.</div>
          </div>
        </div>
      )}
      <DrawToolbar
        tool={tool} setTool={setTool}
        pen={pen} setPen={setPen}
        color={color} setColor={setColor}
        width={width} setWidth={setWidth}
        canUndo={historyState.canUndo} canRedo={historyState.canRedo}
        onUndo={undo} onRedo={redo}
        onClear={() => setConfirmClear(true)}
        hasObjects={hasObjects}
        activeShape={activeShape} onPickShape={pickShape}
        onCopy={copySelection} onPaste={pasteClipboard}
        canCopy={hasSelection} canPaste={hasClipboard}
        emoji={emoji} setEmoji={setEmoji}
        gridSize={gridSize} onGridMode={setGridMode} onGridSize={setGridSize} gridMode={gridMode} onCycleGrid={() => setGridMode((g) => ({ off: 'grid', grid: 'dots', dots: 'lines', lines: 'off' }[g]))}
      />
      {rotateHandle && (
        <RotateHandle
          x={rotateHandle.x} y={rotateHandle.y}
          yaw={rotateHandle.yaw} tilt={rotateHandle.tilt}
          onChange={(yaw, tilt) => setObjectYawTilt(rotateHandle.objId, yaw, tilt)}
        />
      )}
      {confirmClear && (
        <ConfirmDialog
          title="Clear the whole board?"
          body="Every stroke on this page will be removed. You can still bring it back with Undo (Ctrl/Cmd+Z)."
          confirmLabel="Clear board"
          danger
          onConfirm={doClear}
          onCancel={() => setConfirmClear(false)}
        />
      )}
    </div>
  );
});

function CanvasScreen({ session, onBackHome, onNewBoard, onOpenFile }) {
  const viewportRef = useRef(null);
  const [slides, setSlides] = useState(() => [makeSlide(session?.bg || '#0d3824')]);
  const [activeIndex, setActiveIndex] = useState(0);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [panelsHidden, setPanelsHidden] = useState(false); // hides thumbnails + page dock
  const handleExportPng = useCallback(() => {
    const vp = viewportRef.current;
    const url = vp && vp.getPagePng && vp.getPagePng();
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    a.download = `novaboard-page-${activeIndexRef.current + 1}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  }, []);
  const [importing, setImporting] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [importError, setImportError] = useState(null);
  const [confirmDeletePage, setConfirmDeletePage] = useState(false);
  const [newPageOpen, setNewPageOpen] = useState(false);
  const [selectMode, setSelectMode] = useState(false);
  const [selectedIds, setSelectedIds] = useState([]);
  const [confirmDeleteSelected, setConfirmDeleteSelected] = useState(false);
  const imageInputRef = useRef(null);
  const boardInputRef = useRef(null);
  const [notice, setNotice] = useState(null);
  const [pdfOverlay, setPdfOverlay] = useState(null);
  const [restoring, setRestoring] = useState(true);
  const [confirmLeave, setConfirmLeave] = useState(null);
  const ovTimerRef = useRef(null);

  const [widgetDockOpen, setWidgetDockOpen] = useState(false);
  const [widgets, setWidgets] = useState({}); // { timer: {minimized}, calculator: {minimized}, laser: {} }
  const canvasStageRef = useRef(null);

  const [topBarHidden, setTopBarHidden] = useState(false);
  const [pdfLocked, setPdfLocked] = useState(true);  // PDF lock: blocks pan / pinch / zoom of the PDF page
  const [dockSide, setDockSide] = useState('default'); // 'default' | 'swapped'
  const [isFullscreen, setIsFullscreen] = useState(false);
  const rootRef = useRef(null);

  useEffect(() => {
    const onFsChange = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', onFsChange);
    return () => document.removeEventListener('fullscreenchange', onFsChange);
  }, []);

  const toggleFullscreen = useCallback(() => {
    if (!document.fullscreenElement) {
      rootRef.current?.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.().catch(() => {});
    }
  }, []);

  const launchWidget = useCallback((id) => {
    setWidgets((prev) => {
      if (prev[id]) {
        // toggling an already-open widget from the dock closes it again
        const next = { ...prev };
        delete next[id];
        return next;
      }
      return { ...prev, [id]: { minimized: false } };
    });
    setWidgetDockOpen(false);
  }, []);
  const closeWidget = useCallback((id) => {
    setWidgets((prev) => { const next = { ...prev }; delete next[id]; return next; });
  }, []);
  const toggleMinimize = useCallback((id, val) => {
    setWidgets((prev) => ({ ...prev, [id]: { ...prev[id], minimized: val } }));
  }, []);
  const activeWidgetFlags = { timer: !!widgets.timer, calculator: !!widgets.calculator, laser: !!widgets.laser, dice: !!widgets.dice, ruler: !!widgets.ruler, spotlight: !!widgets.spotlight, ...Object.fromEntries(NB_NEW_TOOLS.map((x) => [x.id, !!widgets[x.id]])) };

  const slidesRef = useRef(slides);
  const activeIndexRef = useRef(activeIndex);
  useEffect(() => { slidesRef.current = slides; }, [slides]);
  useEffect(() => { activeIndexRef.current = activeIndex; }, [activeIndex]);

  /* ================= Auto-save (IndexedDB) + restore ================= */
  const boardIdRef = useRef((session && session.id) || uid());
  const boardRef = useRef({
    id: boardIdRef.current,
    title: (session && session.title) || 'Untitled Board',
    bg: (session && session.bg) || '#0d3824',
    source: (session && session.source) || 'blank',
  });
  const readyRef = useRef(false);               // false until the stored board (if any) has been loaded
  const persistedRef = useRef(new Map());       // page id -> page object as last written to disk
  const inflightRef = useRef(new Set());        // page objects currently being written
  const assetsRef = useRef(new Set());          // PDF page images already stored
  const lastSigRef = useRef('');                // page order + active page as last written
  const canvasDirtyRef = useRef(false);         // live canvas changed since the last capture
  const saveTimerRef = useRef(null);
  const saveChainRef = useRef(Promise.resolve());
  const retrySaveRef = useRef(null);
  const saveOkRef = useRef(true);
  const [saveState, setSaveState] = useState({ status: 'saved', at: Date.now() });

  const doSave = useCallback(async () => {
    if (!readyRef.current) return;
    const vp = viewportRef.current;
    const idx = activeIndexRef.current;
    let list = slidesRef.current;
    // 1) Capture the live canvas into the active page (only if it changed).
    if (canvasDirtyRef.current && vp && list[idx]) {
      if (vp.isBusy()) { if (retrySaveRef.current) retrySaveRef.current(700); return; }
      canvasDirtyRef.current = false;
      const saved = vp.saveIntoSlide(list[idx]);
      saved.thumb = vp.getThumbnail();
      list = list.map((sl) => (sl.id === saved.id ? saved : sl));
      slidesRef.current = list;
      setSlides((prev) => {
        const at = prev.findIndex((sl) => sl.id === saved.id);
        if (at < 0) return prev;
        const next = prev.slice(); next[at] = saved; slidesRef.current = next; return next;
      });
    }
    // 2) Write only the pages that changed, in one atomic transaction.
    const sig = list.map((sl) => sl.id).join(',') + '|' + idx;
    const batch = nbMakeBatch(boardRef.current, list, idx, (sl) => persistedRef.current.get(sl.id) !== sl, (k) => assetsRef.current.has(k));
    if (batch.slideRecords.length === 0 && sig === lastSigRef.current) {
      setSaveState((st) => (st.status === 'off' ? st : { status: 'saved', at: st.at || Date.now() }));
      return;
    }
    const wrote = new Set(batch.slideRecords.map((r) => r.id));
    const written = list.filter((sl) => wrote.has(sl.id));
    written.forEach((sl) => inflightRef.current.add(sl));
    try {
      await NBStore.saveBoard(batch);
      written.forEach((sl) => persistedRef.current.set(sl.id, sl));
      const have = new Set(list.map((sl) => sl.id));
      persistedRef.current.forEach((_, k) => { if (!have.has(k)) persistedRef.current.delete(k); });
      batch.assetRecords.forEach((a) => assetsRef.current.add(a.key));
      lastSigRef.current = sig;
      saveOkRef.current = true;
      nbWriteSessionFlag({ id: boardIdRef.current, clean: false });
      setSaveState({ status: 'saved', at: Date.now() });
    } catch (err) {
      console.error('Auto-save failed', err);
      const unavailable = /not available|blocked/i.test(String((err && err.message) || ''));
      saveOkRef.current = false;
      setSaveState({ status: unavailable ? 'off' : 'error', at: Date.now(), message: nbDescribeError(err) });
      if (!unavailable && retrySaveRef.current) retrySaveRef.current(8000);
    } finally {
      written.forEach((sl) => inflightRef.current.delete(sl));
    }
  }, []);

  /* Serialised: saves never overlap, and callers can await the one that is running. */
  const flushNow = useCallback(() => {
    if (saveTimerRef.current) { clearTimeout(saveTimerRef.current); saveTimerRef.current = null; }
    saveChainRef.current = saveChainRef.current.then(doSave).catch(() => {});
    return saveChainRef.current;
  }, [doSave]);

  const scheduleSave = useCallback((delay) => {
    if (!readyRef.current) return;
    setSaveState((st) => (st.status === 'off' || st.status === 'saving' ? st : { status: 'saving', at: st.at }));
    if (saveTimerRef.current) return;
    saveTimerRef.current = setTimeout(() => { saveTimerRef.current = null; flushNow(); }, typeof delay === 'number' ? delay : 1200);
  }, [flushNow]);
  useEffect(() => { retrySaveRef.current = scheduleSave; }, [scheduleSave]);

  const handleContentChange = useCallback(() => {
    if (!readyRef.current) return;
    canvasDirtyRef.current = true;
    scheduleSave();
  }, [scheduleSave]);

  /* Structural changes (add / delete / duplicate / reorder / import) land in `slides`: save those too. */
  useEffect(() => {
    if (!readyRef.current) return;
    const sig = slides.map((sl) => sl.id).join(',') + '|' + activeIndex;
    const dirty = sig !== lastSigRef.current
      || slides.some((sl) => persistedRef.current.get(sl.id) !== sl && !inflightRef.current.has(sl));
    if (dirty) scheduleSave();
  }, [slides, activeIndex, scheduleSave]);

  /* Flush the moment the tab is hidden / closed (smartboard powering down, window closing). */
  useEffect(() => {
    const markClean = () => nbWriteSessionFlag({ id: boardIdRef.current, clean: true });
    const onVis = () => { if (document.visibilityState === 'hidden') flushNow(); };
    const onPageHide = () => { flushNow(); markClean(); };
    const onPageShow = (e) => { if (e.persisted) nbWriteSessionFlag({ id: boardIdRef.current, clean: false }); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('pagehide', onPageHide);
    window.addEventListener('pageshow', onPageShow);
    // Desktop app: the main process asks for a last save (and waits for it) before closing the window.
    let offFlush = null;
    if (window.novaDesktop && window.novaDesktop.onFlushRequest) {
      offFlush = window.novaDesktop.onFlushRequest(() => flushNow().then(markClean));
    }
    return () => {
      if (offFlush) offFlush();
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('pagehide', onPageHide);
      window.removeEventListener('pageshow', onPageShow);
      flushNow(); // leaving the board: write anything still pending
    };
  }, [flushNow]);

  /* Load the stored board (or start a new one / import the PDF picked on the dashboard). */
  useEffect(() => {
    let cancelled = false;
    (async () => {
      let rec = null;
      let storageDown = false;
      try { rec = await NBStore.loadBoard(boardIdRef.current); }
      catch (err) {
        console.warn('Could not read the saved board', err);
        storageDown = /not available|blocked/i.test(String((err && err.message) || ''));
      }
      if (cancelled) return;
      if (rec && rec.slides.length) {
        const idx = Math.max(0, Math.min(rec.meta.activeIndex || 0, rec.slides.length - 1));
        const bid = boardIdRef.current;
        rec.slides.forEach((sl) => {
          persistedRef.current.set(sl.id, sl);
          if (sl.bgImage) assetsRef.current.add(nbSlideKey(bid, sl.id));
        });
        lastSigRef.current = rec.slides.map((sl) => sl.id).join(',') + '|' + idx;
        boardRef.current = {
          ...boardRef.current,
          title: rec.meta.title || boardRef.current.title,
          bg: rec.meta.bg || boardRef.current.bg,
          source: rec.meta.source || boardRef.current.source,
        };
        slidesRef.current = rec.slides;
        activeIndexRef.current = idx;
        setSlides(rec.slides);
        setActiveIndex(idx);
        setTimeout(() => { if (viewportRef.current) viewportRef.current.loadSlide(rec.slides[idx]); }, 0);
      }
      readyRef.current = true;
      setRestoring(false);
      nbWriteSessionFlag({ id: boardIdRef.current, clean: false });
      if (storageDown) {
        saveOkRef.current = false;
        setSaveState({ status: 'off', at: Date.now(), message: 'Auto-save is unavailable in this browser. Use Save to keep a copy.' });
      }
      if (!rec) {
        if (session && session.pdfFile) importPdfFile(session.pdfFile);
        else if (!storageDown) scheduleSave();   // record the new board right away so it shows up in Recent sessions
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => () => { if (ovTimerRef.current) clearTimeout(ovTimerRef.current); }, []);
  useEffect(() => {
    if (!notice) return undefined;
    const t = setTimeout(() => setNotice(null), 3200);
    return () => clearTimeout(t);
  }, [notice]);

  /* Leave the board: wait for the last save; warn if it could not be saved. */
  const leaveBoard = useCallback(async (after) => {
    await flushNow();
    if (!saveOkRef.current) { setConfirmLeave({ after }); return; }
    nbWriteSessionFlag({ id: boardIdRef.current, clean: true });
    after();
  }, [flushNow]);

  /* Top bar: Save as .novaboard. The picker is opened synchronously from the click. */
  const handleSaveFile = useCallback(() => {
    const fname = nbSafeFileName(boardRef.current.title) + '.novaboard';
    nbSaveFile(async () => {
      const vp = viewportRef.current;
      const i = activeIndexRef.current;
      const cur = slidesRef.current.slice();
      if (vp && cur[i]) {
        const saved = vp.saveIntoSlide(cur[i]);
        saved.thumb = vp.getThumbnail();
        cur[i] = saved;
      }
      return nbBuildBoardBlob(boardRef.current, cur, i);
    }, fname).then((how) => {
      if (how === 'cancelled') return;
      setNotice({ text: how === 'picker' ? `Saved ${fname}` : `Downloaded ${fname}` });
    }).catch((err) => {
      console.error(err);
      setImportError('Could not save the file: ' + ((err && err.message) || 'unknown error'));
    });
  }, []);

  /* Top bar: Open a .novaboard file (the current board is flushed first and stays in Recent sessions). */
  const handleOpenBoardFile = useCallback(async (file) => {
    if (!file) return;
    try {
      await flushNow();
      await onOpenFile(file);
    } catch (err) {
      setImportError((err && err.message) || 'Could not open that file.');
    }
  }, [flushNow, onOpenFile]);

  /* Snapshot the live canvas into slidesRef[activeIndex] (thumbnail + json + history). */
  const captureActiveSlide = useCallback(() => {
    const vp = viewportRef.current;
    if (!vp) return;
    const i = activeIndexRef.current;
    setSlides((prev) => {
      const next = prev.slice();
      const saved = vp.saveIntoSlide(next[i]);
      saved.thumb = vp.getThumbnail();
      next[i] = saved;
      slidesRef.current = next;
      return next;
    });
  }, []);

  const goToSlide = useCallback((targetIndex) => {
    const vp = viewportRef.current;
    if (!vp) return;
    const i = activeIndexRef.current;
    if (targetIndex === i) return;
    setSlides((prev) => {
      const next = prev.slice();
      const saved = vp.saveIntoSlide(next[i]);
      saved.thumb = vp.getThumbnail();
      next[i] = saved;
      slidesRef.current = next;
      const clamped = Math.max(0, Math.min(targetIndex, next.length - 1));
      activeIndexRef.current = clamped;
      setActiveIndex(clamped);
      // Defer load until after this render commits the new slides array.
      setTimeout(() => vp.loadSlide(next[clamped]), 0);
      return next;
    });
  }, []);

  const handleAddPage = useCallback((bg) => {
    const vp = viewportRef.current;
    if (!vp) return;
    captureActiveSlide();
    setSlides((prev) => {
      const fresh = makeSlide(bg);
      const insertAt = activeIndexRef.current + 1;
      const next = [...prev.slice(0, insertAt), fresh, ...prev.slice(insertAt)];
      slidesRef.current = next;
      activeIndexRef.current = insertAt;
      setActiveIndex(insertAt);
      setTimeout(() => vp.loadSlide(fresh), 0);
      return next;
    });
  }, [captureActiveSlide]);

  const doDeletePage = useCallback(() => {
    const vp = viewportRef.current;
    setConfirmDeletePage(false);
    setSlides((prev) => {
      if (prev.length <= 1) return prev;
      const i = activeIndexRef.current;
      const next = prev.slice(0, i).concat(prev.slice(i + 1));
      const newIndex = Math.min(i, next.length - 1);
      slidesRef.current = next;
      activeIndexRef.current = newIndex;
      setActiveIndex(newIndex);
      if (vp) setTimeout(() => vp.loadSlide(next[newIndex]), 0);
      return next;
    });
  }, []);

  const handleReorder = useCallback((fromIdx, toIdx) => {
    setSlides((prev) => {
      const next = prev.slice();
      const [moved] = next.splice(fromIdx, 1);
      next.splice(toIdx, 0, moved);
      slidesRef.current = next;
      // Keep pointing at the same slide object even though its index moved.
      const activeSlideId = prev[activeIndexRef.current]?.id;
      const newActive = next.findIndex((s) => s.id === activeSlideId);
      if (newActive !== -1) { activeIndexRef.current = newActive; setActiveIndex(newActive); }
      return next;
    });
  }, []);

  /* Selected page ids, minus any that no longer exist (after deletes / PDF import). */
  const validSelectedIds = useMemo(() => {
    const have = new Set(slides.map((sl) => sl.id));
    return selectedIds.filter((id) => have.has(id));
  }, [selectedIds, slides]);
  const selectedIdsRef = useRef([]);
  useEffect(() => { selectedIdsRef.current = validSelectedIds; }, [validSelectedIds]);

  /* Esc leaves page-selection mode. */
  useEffect(() => {
    if (!selectMode) return;
    const onKey = (e) => {
      if (e.key === 'Escape') { setSelectMode(false); setSelectedIds([]); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [selectMode]);

  /* Duplicate any page (drawing, background, PDF image) right after itself and jump to the copy. */
  const handleDuplicateAt = useCallback((idx) => {
    const vp = viewportRef.current;
    if (!vp || typeof idx !== 'number') return;
    const cur = activeIndexRef.current;
    const list = slidesRef.current.slice();
    if (!list[idx] || !list[cur]) return;
    // Flush the live canvas into the current page first, so the copy always includes the latest strokes.
    const live = vp.saveIntoSlide(list[cur]);
    live.thumb = vp.getThumbnail();
    list[cur] = live;
    const src = list[idx];
    const copy = {
      ...src,
      id: uid(),
      json: src.json ? JSON.parse(JSON.stringify(src.json)) : null, // deep copy: never share objects between pages
      history: { stack: [], index: -1 },                             // the copy starts with its own undo history
    };
    const next = [...list.slice(0, idx + 1), copy, ...list.slice(idx + 1)];
    slidesRef.current = next;
    activeIndexRef.current = idx + 1;
    setSlides(next);
    setActiveIndex(idx + 1);
    setTimeout(() => vp.loadSlide(copy), 0);
  }, []);
  const handleDuplicatePage = useCallback(() => handleDuplicateAt(activeIndexRef.current), [handleDuplicateAt]);

  /* Feature: delete every page ticked in the sidebar (always keeps at least one). */
  const doDeleteSelected = useCallback(() => {
    const vp = viewportRef.current;
    setConfirmDeleteSelected(false);
    const prev = slidesRef.current;
    const ids = new Set(selectedIdsRef.current);
    const survivors = prev.filter((sl) => !ids.has(sl.id));
    if (survivors.length === 0 || survivors.length === prev.length) return;
    const oldIdx = activeIndexRef.current;
    const activeId = prev[oldIdx] && prev[oldIdx].id;
    const activeSurvives = survivors.some((sl) => sl.id === activeId);
    let newIndex;
    if (activeSurvives) {
      newIndex = survivors.findIndex((sl) => sl.id === activeId);
    } else {
      const before = prev.slice(0, oldIdx).filter((sl) => !ids.has(sl.id)).length;
      newIndex = Math.min(before, survivors.length - 1);
    }
    slidesRef.current = survivors;
    activeIndexRef.current = newIndex;
    setSlides(survivors);
    setActiveIndex(newIndex);
    setSelectedIds([]);
    // If the page being edited survives, the live canvas is already correct: no reload.
    if (!activeSurvives && vp) setTimeout(() => vp.loadSlide(survivors[newIndex]), 0);
  }, []);

  /* Tools menu: Image Upload / Sticky Note act on the canvas; the rest open widgets. */
  const handleLaunchTool = useCallback((id) => {
    if (id === 'image') { setWidgetDockOpen(false); if (imageInputRef.current) imageInputRef.current.click(); return; }
    if (id === 'sticky') { setWidgetDockOpen(false); if (viewportRef.current) viewportRef.current.addStickyNote(); return; }
    if (id === 'table') { setWidgetDockOpen(false); if (viewportRef.current) viewportRef.current.addTable(); return; }
    launchWidget(id);
  }, [launchWidget]);

  /* ---- PDF import: rasterize every page into its own slide (with a progress overlay) ---- */
  const importPdfFile = useCallback(async (file) => {
    if (!file) return;
    setImportError(null);
    setImporting(true);
    if (ovTimerRef.current) { clearTimeout(ovTimerRef.current); ovTimerRef.current = null; }
    setPdfOverlay({ phase: 'working', done: 0, total: 0, name: file.name || 'document.pdf' });
    try {
      const pages = await rasterizePdfPages(file, (done, total) => {
        setPdfOverlay((o) => (o ? { ...o, done, total } : o));
      });
      if (pages.length === 0) throw new Error('This PDF has no pages to import.');
      // Use the already-rasterized page image as an instant thumbnail too, so
      // the sidebar shows real content immediately instead of "EMPTY" until
      // the slide is visited once.
      const newSlides = pages.map((p) => {
        const slide = makeSlide(PDF_LETTERBOX_BG, { bgImage: p.dataUrl, bgImageW: p.width, bgImageH: p.height });
        slide.thumb = p.dataUrl;
        return slide;
      });
      const vp = viewportRef.current;
      const cur = slidesRef.current;
      const pristine = cur.length === 1 && !cur[0].json && !cur[0].bgImage && !canvasDirtyRef.current;
      let all; let startIndex;
      if (pristine || !vp) {
        all = newSlides; startIndex = 0;
      } else {
        // The board already has content (and is auto-saved): keep it and append the PDF pages after it.
        const i = activeIndexRef.current;
        const saved = vp.saveIntoSlide(cur[i]);
        saved.thumb = vp.getThumbnail();
        const base = cur.map((sl) => (sl.id === saved.id ? saved : sl));
        all = [...base, ...newSlides];
        startIndex = base.length;
      }
      canvasDirtyRef.current = false;
      slidesRef.current = all;
      activeIndexRef.current = startIndex;
      setSlides(all);
      setActiveIndex(startIndex);
      setTimeout(() => { if (viewportRef.current) viewportRef.current.loadSlide(all[startIndex]); }, 0);
      setSelectedIds([]);
      setSelectMode(false);
      // Pages are on the board: show "done", then fade the overlay out.
      setPdfOverlay((o) => (o ? { ...o, phase: 'done', done: pages.length, total: pages.length } : o));
      ovTimerRef.current = setTimeout(() => {
        setPdfOverlay((o) => (o ? { ...o, phase: 'out' } : o));
        ovTimerRef.current = setTimeout(() => { setPdfOverlay(null); ovTimerRef.current = null; }, 520);
      }, 700);
    } catch (err) {
      console.error(err);
      setPdfOverlay(null);
      setImportError(err.message || 'Could not read that PDF.');
    } finally {
      setImporting(false);
    }
  }, []);

  /* ---- PDF export: flatten every slide (bg + vectors) into a downloadable multi-page PDF ---- */
  const handleExportPdf = useCallback(async () => {
    const vp = viewportRef.current;
    if (!vp) return;
    setExporting(true);
    try {
      captureActiveSlide();
      // captureActiveSlide's setSlides is async; grab a synchronously-correct
      // copy by re-saving directly into a local array for export.
      const i = activeIndexRef.current;
      const current = slidesRef.current.slice();
      const saved = vp.saveIntoSlide(current[i]);
      current[i] = saved;
      await exportSessionAsPdf(current, session?.title || 'NovaBoard');
    } catch (err) {
      console.error(err);
      setImportError('Export failed: ' + (err.message || 'unknown error'));
    } finally {
      setExporting(false);
    }
  }, [captureActiveSlide, session?.title]);

  const activeSlide = slides[activeIndex];

  const navSide = dockSide === 'swapped' ? 'right' : 'left';
  const actionSide = dockSide === 'swapped' ? 'left' : 'right';

  /* Smooth dock swap (FLIP): record where each dock is, flip the side, then
     animate each from its old x-position to its new one. */
  const navWrapRef = useRef(null);
  const actWrapRef = useRef(null);
  const swapFromRef = useRef(null);
  const swapDocks = useCallback(() => {
    if (!navWrapRef.current || !actWrapRef.current) return;
    swapFromRef.current = {
      nav: navWrapRef.current.getBoundingClientRect().left,
      act: actWrapRef.current.getBoundingClientRect().left,
    };
    setWidgetDockOpen(false);
    setDockSide((v) => (v === 'swapped' ? 'default' : 'swapped'));
  }, []);
  useLayoutEffect(() => {
    const from = swapFromRef.current;
    if (!from) return;
    swapFromRef.current = null;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    [[navWrapRef.current, from.nav], [actWrapRef.current, from.act]].forEach(([el, x0]) => {
      if (!el || reduce) return;
      const dx = x0 - el.getBoundingClientRect().left;
      if (!dx) return;
      el.style.transition = 'none';
      el.style.transform = `translateX(${dx}px)`;
      void el.offsetWidth; // commit the starting position before animating
      el.style.transition = 'transform 420ms cubic-bezier(0.22, 1, 0.36, 1)';
      el.style.transform = 'translateX(0)';
      setTimeout(() => { el.style.transition = ''; el.style.transform = ''; }, 460);
    });
  }, [dockSide]);

  return (
    <div ref={rootRef} className="track-in h-full flex flex-col relative">
      {!topBarHidden && (
        <CanvasTopBar
          session={{ ...session, title: boardRef.current.title, bg: activeSlide?.bg }}
          onBackHome={() => leaveBoard(onBackHome)}
          onNewBoard={() => leaveBoard(onNewBoard)}
          isFullscreen={isFullscreen}
          onToggleFullscreen={toggleFullscreen}
          saveState={saveState}
          onSaveFile={handleSaveFile}
          onOpenFile={() => { if (boardInputRef.current) boardInputRef.current.click(); }}
          showPdfLock={!!activeSlide?.bgImage}
          pdfLocked={pdfLocked}
          onTogglePdfLock={() => setPdfLocked((v) => !v)}
        />
      )}
      {topBarHidden && <TopBarCollapseTab hidden onToggle={() => setTopBarHidden(false)} />}
      <input
        ref={imageInputRef}
        type="file"
        accept="image/*"
        className="hidden"
        onChange={(e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = '';
          if (!file || !viewportRef.current) return;
          viewportRef.current.addImageFromFile(file).catch((err) => setImportError((err && err.message) || 'Could not add that image.'));
        }}
      />
      <input
        ref={boardInputRef}
        type="file"
        accept=".novaboard,.json,application/json"
        className="hidden"
        onChange={(e) => {

        }}

      {topBarHidden && (
        <>
          <PersistentClock />
          <div className="fixed top-3 right-[9.5rem] z-40 pointer-events-none"><SaveStatus state={saveState} /></div>
        </>

      <Toast notice={notice} />
      <PdfImportOverlay state={pdfOverlay} />
      {restoring && (
        <div className="nb-ov fixed inset-0 z-[55] flex items-center justify-center" style={{ animationDelay: '0.3s' }}>
          <div className="glass-strong rounded-xl px-4 py-3 flex items-center gap-2.5 mono text-xs text-slate-300">
            <ILoader size={14} className="text-cyan-300" /> Restoring your board…
          </div>

      )}

      <div className="flex-1 min-h-0 flex relative">
        {!topBarHidden && <TopBarCollapseTab hidden={false} onToggle={() => setTopBarHidden(true)} />}
        <ThumbnailSidebar

          activeIndex={activeIndex}
          onSelect={goToSlide}
          onReorder={handleReorder}
          onAddPage={() => setNewPageOpen(true)}
          onDuplicateAt={handleDuplicateAt}
          collapsed={sidebarCollapsed || panelsHidden}
          selectMode={selectMode}
          setSelectMode={setSelectMode}

        <div ref={canvasStageRef} className="flex-1 min-w-0 relative flex flex-col overflow-hidden">
          <div ref={navWrapRef} style={panelsHidden ? { display: 'none' } : undefined} className={`absolute bottom-4 z-30 ${navSide === 'right' ? 'right-4' : 'left-4'}`}>
            <NavDock

              onExportPng={handleExportPng}

              onExportPdf={handleExportPdf}
              exporting={exporting}

const VIEWS = { SPLASH: 'VIEW_SPLASH', HOME: 'VIEW_HOME', CANVAS: 'VIEW_CANVAS' };
function App() {
  const [settings, setSettingsState] = useState(nbLoadSettings);
  const [panel, setPanel] = useState(null); // null | tab id
  const setSettings = useCallback((patch) => setSettingsState((p) => ({ ...p, ...patch })), []);
  useEffect(() => { nbApplyTheme(settings); nbSaveSettings(settings); }, [settings]);
  useEffect(() => {
    if (settings.mode !== 'auto' || !window.matchMedia) return;
    const mq = matchMedia('(prefers-color-scheme: light)'); const h = () => nbApplyTheme(settings);
    mq.addEventListener('change', h); return () => mq.removeEventListener('change', h);
  }, [settings]);
  const ctxVal = useMemo(() => ({ s: settings, set: setSettings, open: (tab) => setPanel(tab || 'appearance') }), [settings, setSettings]);
  const [view, setView] = useState(() => (nbLoadSettings().splash === false ? VIEWS.HOME : VIEWS.SPLASH));
  const [activeSession, setActiveSession] = useState(null);
  const [sessions, setSessions] = useState(() => loadSessions());
  // Set when the PREVIOUS page session did not close cleanly (power loss, crash, killed tab).
  const [recovery, setRecovery] = useState(() => (NB_BOOT_SESSION && NB_BOOT_SESSION.clean === false ? NB_BOOT_SESSION : null));
  const enterCanvas = useCallback((session) => {
    setRecovery(null);
    setActiveSession(session);
    setView(VIEWS.CANVAS);
  }, []);
  const goHome = useCallback(() => {
    setActiveSession(null);
    setView(VIEWS.HOME);
  }, []);
  const handleSplashDone = useCallback(() => setView(VIEWS.HOME), []);

  /* Open a .novaboard file: validate, store it as a brand-new board, then open it. */
  const openNovaboardFile = useCallback(async (file) => {
    const parsed = await nbParseBoardFile(file);
    const id = uid();
    const board = { id, title: parsed.title, bg: parsed.bg, source: 'file' };
    await NBStore.saveBoard(nbMakeBatch(board, parsed.slides, parsed.activeIndex, () => true, () => false));
    const session = {
      id, title: parsed.title, bg: parsed.slides[0].bg, pageCount: parsed.slides.length,
      updatedAt: Date.now(), source: 'file',
    };
    setSessions((prev) => {
      const next = nbCapSessions([session, ...prev.filter((x) => x.id !== id)]);
      saveSessions(next.map(nbSlimSession));
      return next;
    });
    enterCanvas(session);
  }, [enterCanvas]);

  return (
    <SettingsCtx.Provider value={ctxVal}>
    <div className="h-full w-full relative">
      {settings.aurora && view === VIEWS.HOME && <div className="nb-aurora" aria-hidden="true"><i /><i /><i /></div>}
      {panel && <SettingsPanel tab={panel} onClose={() => setPanel(null)} />}
      {view === VIEWS.SPLASH && (
        <SplashScreen onDone={handleSplashDone} />
      )}
      {view === VIEWS.HOME && (
        <HomeScreen
          onEnterCanvas={enterCanvas}
          sessions={sessions}
          setSessions={setSessions}
          onOpenFile={openNovaboardFile}
          recovery={recovery}
          onDismissRecovery={() => setRecovery(null)}
        />
      )}
      {view === VIEWS.CANVAS && activeSession && (
        <CanvasScreen
          key={activeSession.id}
          session={activeSession}
          onBackHome={goHome}
          onNewBoard={goHome}
          onOpenFile={openNovaboardFile}
        />
      )}
    </div>
    </SettingsCtx.Provider>
  );
}

const nbHex2rgb = (h) => { const n = parseInt(h.replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const nbMix = (rgb, t, k) => rgb.map((v, i) => Math.round(v + (t[i] - v) * k));
function nbShades(hex, prefix, root) {
  const c = nbHex2rgb(hex), W = [255, 255, 255], K = [0, 0, 0];
  const set = (n, v) => root.style.setProperty(`--${prefix}-${n}`, v.join(' '));
  set(50, nbMix(c, W, .9)); set(100, nbMix(c, W, .8)); set(200, nbMix(c, W, .6)); set(300, nbMix(c, W, .4)); set(400, nbMix(c, W, .15));
  set(500, c); set(600, nbMix(c, K, .15)); set(700, nbMix(c, K, .3)); set(800, nbMix(c, K, .5)); set(900, nbMix(c, K, .65));
}
const NB_SLATE_DARK = { 50: '248 250 252', 100: '241 245 249', 200: '226 232 240', 300: '203 213 225', 400: '148 163 184', 500: '100 116 139', 600: '71 85 105', 700: '51 65 85', 800: '30 41 59', 900: '15 23 42', 950: '2 6 23' };
const NB_SLATE_LIGHT = { 50: '2 6 23', 100: '15 23 42', 200: '30 41 59', 300: '51 65 85', 400: '71 85 105', 500: '100 116 139', 600: '148 163 184', 700: '203 213 225', 800: '226 232 240', 900: '241 245 249', 950: '248 250 252' };

/* Single source of truth for "is the UI dark?", derived from settings (never from the DOM, which updates a frame later). */
function nbIsDark(s) {
  return s.mode === 'auto' ? !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) : s.mode !== 'light';
}
function nbApplyTheme(s) {
  const root = document.documentElement;
  const dark = nbIsDark(s);
  root.dataset.mode = dark ? 'dark' : 'light';
  root.dataset.motion = s.motion ? 'on' : 'off';
  root.dataset.font = s.font || 'default'; root.dataset.glow = s.glow === false ? 'off' : 'on';
  const th = NB_THEMES.find((t) => t.id === s.theme) || NB_THEMES[0];
  const a = s.accent || th.a;
  const b = s.accent ? '#' + nbMix(nbHex2rgb(a), nbHex2rgb('#818cf8'), .45).map((v) => v.toString(16).padStart(2, '0')).join('') : th.b;
  nbShades(a, 'a', root); nbShades(b, 'b', root);
  const sl = dark ? NB_SLATE_DARK : NB_SLATE_LIGHT;
  Object.keys(sl).forEach((k) => root.style.setProperty(`--s-${k}`, sl[k]));
  root.style.setProperty('--blur', s.blur + 'px');
  root.style.setProperty('--rk', s.radius);
  root.style.setProperty('--fs', s.fontScale);
  root.style.setProperty('--on-accent', '#04101c');
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = dark ? '#090d16' : '#eef2f9';
}

function nbResizeAvatar(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
      const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Not an image')); };
    img.src = url;
  });
}

const nbLS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
};
function useStored(key, init) {
  const [v, setV] = useState(() => nbLS.get(key, init));

}

/* ---- Name picker (shares the class list with Group maker) ---- */
function NamesBox() {
  const [txt, setTxt] = useStored('nb3_names', '');
  return [txt, setTxt, (
    <textarea className="nb-in" rows={4} value={txt} onChange={(e) => setTxt(e.target.value)} placeholder="One name per line (or comma separated)" aria-label="Class list" />
  )];
}
function PickerTool() {
  const [txt, setTxt, box] = NamesBox();
  const [shown, setShown] = useState('—');
  const [done, setDone] = useState([]);
  const [skip, setSkip] = useState(true);
  const [busy, setBusy] = useState(false);
  const pick = () => {
    const all = nbParseNames(txt); const pool = skip ? all.filter((n) => !done.includes(n)) : all;
    if (!pool.length) { setShown(all.length ? 'All picked!' : 'Add names'); return; }
    const win = pool[Math.floor(Math.random() * pool.length)];
    setBusy(true); let i = 0;
    const iv = setInterval(() => {
      setShown(pool[Math.floor(Math.random() * pool.length)]);
      if (++i > 14) { clearInterval(iv); setShown(win); setDone((d) => [...d, win]); setBusy(false); }
    }, 70);
  };
  return (<>
    {box}
    <div className="rounded-xl py-4 text-center text-2xl font-semibold truncate px-2" style={{ background: 'linear-gradient(135deg, rgb(var(--a-400) / .18), rgb(var(--b-400) / .18))' }}>{shown}</div>
    <div className="flex items-center gap-2">
      <button className="nb-btn pri flex-1" disabled={busy} onClick={pick}>Pick random</button>
      <button className="nb-btn sec" onClick={() => { setDone([]); setShown('—'); }}>Reset</button>
    </div>
    <label className="flex items-center gap-2 text-[11px] text-slate-400"><input type="checkbox" checked={skip} onChange={(e) => setSkip(e.target.checked)} /> Don't repeat names ({done.length} picked)</label>
  </>);
}

/* ---- Group maker ---- */
function GroupTool() {
  const [txt, setTxt, box] = NamesBox();
  const [n, setN] = useState(3);
  const [groups, setGroups] = useState([]);
  const make = () => {
    const names = nbShuffle(nbParseNames(txt)); const k = Math.max(1, Math.min(n, names.length || 1));
    const g = Array.from({ length: k }, () => []); names.forEach((x, i) => g[i % k].push(x)); setGroups(g);
  };
  return (<>
    {box}
    <div className="flex items-center gap-2">
      <span className="text-xs text-slate-400">Groups</span>

/* ---- Noise meter (microphone level, nothing recorded or stored) ---- */
function NoiseTool() {
  const [lvl, setLvl] = useState(0);
  const [limit, setLimit] = useState(60);
  const [state, setState] = useState('idle'); // idle | on | denied
  const stopRef = useRef(null);
  const start = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
      const an = ctx.createAnalyser(); an.fftSize = 512; ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize); let raf = 0, sm = 0;
      const loop = () => {
        an.getByteTimeDomainData(buf); let sum = 0;
        for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
        const rms = Math.sqrt(sum / buf.length); const target = Math.min(100, Math.round(Math.pow(rms * 6, 0.8) * 100));
        sm = sm * 0.8 + target * 0.2; setLvl(Math.round(sm)); raf = requestAnimationFrame(loop);
      };
      loop(); setState('on');
      stopRef.current = () => { cancelAnimationFrame(raf); stream.getTracks().forEach((t) => t.stop()); ctx.close(); };
    } catch (e) { setState('denied'); }
  };
  const stop = () => { stopRef.current && stopRef.current(); stopRef.current = null; setState('idle'); setLvl(0); };
  useEffect(() => () => { stopRef.current && stopRef.current(); }, []);
  const over = lvl > limit; const col = over ? '#f43f5e' : lvl > limit * 0.7 ? '#fbbf24' : '#34d399';
  return (<>
    <div className="rounded-xl py-3 text-center" style={{ background: `${col}22` }}>
      <div className="text-3xl font-semibold mono tabular-nums" style={{ color: col }}>{lvl}</div>
      <div className="text-xs" style={{ color: col }}>{state !== 'on' ? 'Microphone off' : over ? 'Too loud — quiet please!' : lvl > limit * 0.7 ? 'Getting noisy' : 'Nice and quiet'}</div>
    </div>
    <div className="h-2 rounded-full bg-slate-700/40 overflow-hidden relative"><div className="h-full rounded-full" style={{ width: `${lvl}%`, background: col, transition: 'width .1s linear' }} /><div className="absolute top-0 bottom-0 w-0.5 bg-slate-200/70" style={{ left: `${limit}%` }} /></div>
    <div className="flex items-center gap-2 text-xs text-slate-400">Limit <input type="range" min="20" max="95" value={limit} onChange={(e) => setLimit(+e.target.value)} className="nb-range" /></div>
    <button className={`nb-btn w-full ${state === 'on' ? 'sec' : 'pri'}`} onClick={state === 'on' ? stop : start}>{state === 'on' ? 'Stop' : 'Start listening'}</button>
    {state === 'denied' && <div className="text-[11px] text-rose-400">Microphone blocked. Allow access in your browser. Audio is never recorded.</div>}
  </>);
}

/* ---- Unit converter ---- */
const NB_UNITS = {
  Length: { mm: .001, cm: .01, m: 1, km: 1000, in: .0254, ft: .3048, yd: .9144, mi: 1609.344 },
  Mass: { g: .001, kg: 1, t: 1000, oz: .0283495, lb: .453592 },
  Volume: { ml: .001, l: 1, 'fl oz': .0295735, gal: 3.78541 },
  Speed: { 'm/s': 1, 'km/h': .277778, mph: .44704, kn: .514444 },
  Time: { s: 1, min: 60, h: 3600, day: 86400, week: 604800 },
  Temp: { '°C': 1, '°F': 1, K: 1 },
};
function nbConvert(cat, v, from, to) {
  if (cat === 'Temp') {
    const c = from === '°C' ? v : from === '°F' ? (v - 32) * 5 / 9 : v - 273.15;
    return to === '°C' ? c : to === '°F' ? c * 9 / 5 + 32 : c + 273.15;
  }
  return v * NB_UNITS[cat][from] / NB_UNITS[cat][to];
}
function ConvertTool() {
  const [cat, setCat] = useState('Length');
  const keys = Object.keys(NB_UNITS[cat]);
  const [from, setFrom] = useState('m'); const [to, setTo] = useState('ft'); const [val, setVal] = useState('1');
  const setCategory = (c) => { setCat(c); const k = Object.keys(NB_UNITS[c]); setFrom(k[0]); setTo(k[1] || k[0]); };
  const r = nbConvert(cat, parseFloat(val) || 0, from, to);
  return (<>
    <div className="flex flex-wrap gap-1">{Object.keys(NB_UNITS).map((c) => <button key={c} className={`nb-chip ${cat === c ? 'on' : 'text-slate-400'}`} onClick={() => setCategory(c)}>{c}</button>)}</div>
    <div className="flex gap-1.5"><input className="nb-in" type="number" value={val} onChange={(e) => setVal(e.target.value)} /><select className="nb-in !w-24" value={from} onChange={(e) => setFrom(e.target.value)}>{keys.map((k) => <option key={k}>{k}</option>)}</select></div>
    <div className="flex gap-1.5 items-center"><div className="nb-in mono truncate flex-1">{+r.toPrecision(7)}</div><select className="nb-in !w-24" value={to} onChange={(e) => setTo(e.target.value)}>{keys.map((k) => <option key={k}>{k}</option>)}</select></div>
  </>);
}

/* ---- Protractor overlay (drag to move, buttons to rotate) ---- */
function ProtractorOverlay({ boundsRef, onClose }) {
  const R = 150, W = R * 2 + 24, H = R + 56;
  const [st, setSt] = useState({ x: 140, y: 120, angle: 0 });
  const ref = useRef(st); ref.current = st;
  const down = (e) => {
    if (e.button !== undefined && e.button !== 0) return; e.preventDefault();
    const o = { px: e.clientX, py: e.clientY, x: ref.current.x, y: ref.current.y };
    const mv = (ev) => {
      let x = o.x + ev.clientX - o.px, y = o.y + ev.clientY - o.py; const el = boundsRef && boundsRef.current;
      if (el) { const r = el.getBoundingClientRect(); x = Math.max(-W + 80, Math.min(x, r.width - 80)); y = Math.max(-H + 60, Math.min(y, r.height - 40)); }
      setSt((p) => ({ ...p, x, y }));
    };
    const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  };
  const rot = (d) => setSt((p) => ({ ...p, angle: (((p.angle + d) % 360) + 360) % 360 }));
  const cx = W / 2, cy = R + 12, stop = (e) => e.stopPropagation();
  const ticks = [];
  for (let d = 0; d <= 180; d += 2) {
    const a = d * Math.PI / 180, big = d % 10 === 0, mid = d % 5 === 0, l = big ? 16 : mid ? 11 : 6;
    ticks.push(<line key={d} x1={cx + (R - l) * Math.cos(a)} y1={cy - (R - l) * Math.sin(a)} x2={cx + R * Math.cos(a)} y2={cy - R * Math.sin(a)} stroke="#0c4a6e" strokeWidth={big ? 1.4 : 0.8} />);
    if (big && d > 0 && d < 180) {
      ticks.push(<text key={'o' + d} x={cx + (R - 28) * Math.cos(a)} y={cy - (R - 28) * Math.sin(a) + 3} fontSize="9" textAnchor="middle" fill="#0c4a6e" fontFamily="JetBrains Mono, monospace">{d}</text>);
      ticks.push(<text key={'i' + d} x={cx + (R - 44) * Math.cos(a)} y={cy - (R - 44) * Math.sin(a) + 3} fontSize="8" textAnchor="middle" fill="#0369a1" opacity=".7" fontFamily="JetBrains Mono, monospace">{180 - d}</text>);
    }
  }
  const rb = 'w-7 h-6 rounded-md bg-sky-900/15 hover:bg-sky-900/30 text-sky-950 flex items-center justify-center focus-ring';
  return (
    <div className="absolute z-[26] select-none" style={{ left: st.x, top: st.y, width: W, height: H, transform: `rotate(${st.angle}deg)`, transformOrigin: '50% 80%', touchAction: 'none', cursor: 'grab' }} onPointerDown={down}>
      <svg width={W} height={H} className="absolute inset-0 pointer-events-none">
        <path d={`M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy} Z`} fill="rgba(125,211,252,0.38)" stroke="#0369a1" strokeWidth="1.5" />
        <path d={`M ${cx - 38} ${cy} A 38 38 0 0 1 ${cx + 38} ${cy} Z`} fill="rgba(255,255,255,0.35)" stroke="#0369a1" strokeWidth=".8" />
        {ticks}<line x1={cx - R} y1={cy} x2={cx + R} y2={cy} stroke="#0c4a6e" strokeWidth="1.2" /><circle cx={cx} cy={cy} r="3" fill="#0c4a6e" />
      </svg>
      <div className="absolute left-0 right-0 flex items-center justify-center gap-1.5" style={{ top: cy + 8 }} onPointerDown={stop}>
        <button className={rb} onClick={() => rot(-5)} title="Rotate left 5°"><IRotateCcw size={13} /></button>
        <span className="mono text-[10px] text-sky-950 w-9 text-center">{st.angle}°</span>
        <button className={rb} onClick={() => rot(5)} title="Rotate right 5°"><IRotate size={13} /></button>
        <button className={rb} onClick={() => rot(90)} title="Rotate 90°">90°</button>
        <button className={rb} onClick={onClose} title="Close protractor"><IX size={13} /></button>
      </div>
    </div>
  );
}

const ISparkle = (p) => <Svg {...p}><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" /><path d="M19 3v4M17 5h4M5 17v4M3 19h4" /></Svg>;

const NB_AI_MODELS = {
  gemini: { text: 'gemini-2.5-flash', vision: 'gemini-2.5-flash' },
  groq: { text: 'llama-3.3-70b-versatile', vision: 'meta-llama/llama-4-scout-17b-16e-instruct' },
  openrouter: { text: 'openrouter/free', vision: 'openrouter/free' }, // router that picks a free model that fits the request
};
/* Shrink a page snapshot so it stays under provider image-size limits. */
function nbShrinkImage(dataUrl, max = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('Could not read the page image.'));
    img.src = dataUrl;
  });
}
async function nbAiCall({ provider = 'gemini', key, model, system, messages, maxTokens = 1200 }) {
  if (!key) throw new Error('Add your free API key in Settings > AI first.');
  const hasImage = messages.some((x) => Array.isArray(x.content) && x.content.some((b) => b.type === 'image'));
  const defs = NB_AI_MODELS[provider] || NB_AI_MODELS.gemini;
  const m = model || (hasImage ? defs.vision : defs.text);
  let url, headers, body;
  if (provider === 'groq' || provider === 'openrouter') {
    /* Groq and OpenRouter both speak the OpenAI-compatible chat completions format. */
    url = provider === 'groq' ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://openrouter.ai/api/v1/chat/completions';
    headers = { 'content-type': 'application/json', authorization: `Bearer ${key}` };
    if (provider === 'openrouter') headers['X-Title'] = 'NovaBoard';
    const content = (c) => (typeof c === 'string' ? c : c.map((b) => (b.type === 'image' ? { type: 'image_url', image_url: { url: `data:${b.source.media_type};base64,${b.source.data}` } } : { type: 'text', text: b.text })));
    body = { model: m, max_tokens: maxTokens, messages: [{ role: 'system', content: system }, ...messages.map((x) => ({ role: x.role, content: content(x.content) }))] };
  } else {
    /* Google Gemini (free tier via AI Studio). */
    url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`;
    headers = { 'content-type': 'application/json', 'x-goog-api-key': key };
    const parts = (c) => (typeof c === 'string' ? [{ text: c }] : c.map((b) => (b.type === 'image' ? { inlineData: { mimeType: b.source.media_type, data: b.source.data } } : { text: b.text })));
    body = {
      systemInstruction: { parts: [{ text: system }] },
      contents: messages.map((x) => ({ role: x.role === 'assistant' ? 'model' : 'user', parts: parts(x.content) })),
      generationConfig: { maxOutputTokens: maxTokens * 4 }, // headroom: thinking tokens count against this
    };
  }
  let res;
  try { res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) }); }
  catch (e) { throw new Error('Could not reach the AI service. Check your internet connection.'); }
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON error body */ }
  if (!res.ok) {
    if (res.status === 429) throw new Error('Free limit reached for now. Wait a minute and try again.');
    if (res.status === 401 || res.status === 403) throw new Error('The API key was rejected. Check it in Settings > AI.');
    throw new Error((data && data.error && data.error.message) || `AI request failed (${res.status}).`);
  }
  let text = '';
  if (provider !== 'gemini') text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
  else { const cand = data.candidates && data.candidates[0]; text = cand && cand.content && cand.content.parts ? cand.content.parts.map((x) => x.text || '').join('') : ''; }
  text = text.trim();
  if (!text) throw new Error('The AI returned no answer (it may have been blocked). Try rephrasing.');
  return text;
}
