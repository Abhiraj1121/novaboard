<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NovaBoard OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #090d16;
    --bg-panel: #0f1420;
    --cyan: #38bdf8;
    --indigo: #818cf8;
    --line: rgba(148, 163, 184, 0.14);
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background: var(--bg-deep);
    color: #e5e9f0;
    font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ---- Splash ---- */
  .splash-bg {
    background:
      radial-gradient(60% 60% at 50% 42%, rgba(56,189,248,0.10) 0%, rgba(56,189,248,0) 70%),
      radial-gradient(80% 80% at 50% 50%, #0b101c 0%, #090d16 100%);
  }
  .orbit-ring {
    position: absolute;
    top: 50%; left: 50%;
    border-radius: 50%;
    border: 1px solid rgba(56,189,248,0.28);
    transform: translate(-50%, -50%);
  }
  .orbit-ring.r2 { border-color: rgba(129,140,248,0.22); }
  @keyframes spin-slow { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes spin-rev { from { transform: translate(-50%, -50%) rotate(360deg); } to { transform: translate(-50%, -50%) rotate(0deg); } }
  .spin-a { animation: spin-slow 6s linear infinite; }
  .spin-b { animation: spin-rev 9s linear infinite; }

  @keyframes core-pulse {
    0%, 100% { opacity: 0.65; filter: drop-shadow(0 0 10px rgba(56,189,248,0.6)); transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; filter: drop-shadow(0 0 26px rgba(56,189,248,0.95)); transform: translate(-50%, -50%) scale(1.08); }
  }
  .core-dot { animation: core-pulse 1.8s ease-in-out infinite; }

  @keyframes fade-up-in {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fade-up-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  @keyframes splash-exit {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
  .splash-exit { animation: splash-exit 0.35s ease forwards; }

  @keyframes track-in {
    0% { opacity: 0; transform: scale(0.98); }
    100% { opacity: 1; transform: scale(1); }
  }
  .track-in { animation: track-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  /* ---- Shared ---- */
  .glass {
    background: rgba(24, 29, 43, 0.68);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
  }
  .glass-strong {
    background: rgba(15, 20, 32, 0.86);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(148, 163, 184, 0.18);
  }
  .scanline-hairline {
    background: linear-gradient(90deg, transparent, rgba(56,189,248,0.5), transparent);
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 8px; }

  @keyframes breathe {
    0%, 100% { opacity: 0.5; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
    50% { opacity: 1; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0); }
  }
  .breathe-dot { animation: breathe 2.2s ease-in-out infinite; }

  .card-hover { transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), border-color 0.25s ease, background 0.25s ease; }
  .card-hover:hover { transform: translateY(-3px); }

  @keyframes modal-in {
    0% { opacity: 0; transform: translateY(8px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-in { animation: modal-in 0.28s cubic-bezier(0.16,1,0.3,1) forwards; }

  .focus-ring:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  /* ---- Classic boot (BIOS POST -> logo + block loader) ---- */
  .post-bg { background: #000; overflow: hidden; }
  .post-text { font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace; color: #d1d5db; text-shadow: 0 0 6px rgba(209,213,219,0.35); }
  .crt-lines {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background:
      repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px),
      radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }
  @keyframes crt-on { 0% { opacity: 0; transform: scaleY(0.004) scaleX(0.6); filter: brightness(3); } 55% { opacity: 1; transform: scaleY(0.02) scaleX(1); filter: brightness(2); } 100% { opacity: 1; transform: scaleY(1) scaleX(1); filter: brightness(1); } }
  .crt-on { animation: crt-on 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes post-flick { 0% { opacity: 0; } 20% { opacity: 1; } 35% { opacity: 0.55; } 55% { opacity: 1; } 70% { opacity: 0.85; } 100% { opacity: 1; } }
  .post-flick { animation: post-flick 0.3s linear both; }
  @keyframes post-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .post-cursor { display: inline-block; width: 0.6em; height: 1.05em; margin-left: 2px; vertical-align: text-bottom; background: #d1d5db; animation: post-blink 1s steps(1) infinite; }
  .boot-blocks { display: flex; gap: 3px; padding: 4px; border: 1px solid rgba(148,163,184,0.55); border-radius: 3px; }
  .boot-blocks i { display: block; width: 100%; height: 14px; background: rgba(148,163,184,0.12); }
  .boot-blocks i.on { background: linear-gradient(#67e8f9, #0ea5e9); box-shadow: 0 0 8px rgba(56,189,248,0.7); }

  /* ---- Import overlay, save HUD, toast ---- */
  .nb-ov {
    background: radial-gradient(60% 60% at 50% 50%, rgba(56,189,248,0.10), rgba(4,6,11,0.72));
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    animation: nb-ov-in 0.3s ease both;
  }
  .nb-ov.out { animation: nb-ov-out 0.5s ease forwards; pointer-events: none; }
  @keyframes nb-ov-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes nb-ov-out { from { opacity: 1; } to { opacity: 0; } }
  .nb-ov-card.out { animation: nb-card-out 0.5s cubic-bezier(0.4, 0, 1, 1) forwards; }
  @keyframes nb-card-out { to { opacity: 0; transform: translateY(-8px) scale(0.97); } }
  .nb-prog { height: 6px; border-radius: 6px; background: rgba(148,163,184,0.16); overflow: hidden; position: relative; }
  .nb-prog > i {
    display: block; height: 100%; border-radius: 6px; position: relative; overflow: hidden;
    background: linear-gradient(90deg, #22d3ee, #818cf8); box-shadow: 0 0 16px rgba(56,189,248,0.85);
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .nb-prog > i::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: translateX(-100%); animation: nb-shimmer 1.2s linear infinite;
  }
  .nb-prog.indet > i { width: 35% !important; animation: nb-indet 1.1s ease-in-out infinite; }
  @keyframes nb-shimmer { to { transform: translateX(100%); } }
  @keyframes nb-indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  @keyframes save-pulse {
    0%, 100% { opacity: 0.55; box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); }
    50% { opacity: 1; box-shadow: 0 0 0 5px rgba(52, 211, 153, 0); }
  }
  .save-pulse { animation: save-pulse 0.8s ease-in-out infinite; }
  @keyframes nb-toast-in { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .nb-toast { animation: nb-toast-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }

  @media (prefers-reduced-motion: reduce) {
    .spin-a, .spin-b, .core-dot, .breathe-dot,
    .post-cursor, .crt-on, .post-flick, .save-pulse,
    .nb-prog > i::after, .nb-prog.indet > i { animation: none !important; }
  }

  /* ---- Phase 2: drawing engine ---- */
  .canvas-stage { position: relative; }
  .canvas-stage .canvas-container { position: absolute !important; inset: 0; width: 100% !important; height: 100% !important; }
  .canvas-stage canvas { touch-action: none; }
  .tool-btn {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: #94a3b8; border: 1px solid transparent;
    transition: all 0.15s ease;
  }
  .tool-btn:hover { background: rgba(148,163,184,0.08); color: #cbd5e1; }
  .tool-btn.active {
    background: rgba(56,189,248,0.14);
    border-color: rgba(56,189,248,0.4);
    color: #38bdf8;
  }
  .tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .tool-btn:disabled:hover { background: transparent; color: #94a3b8; }

  input[type="range"].nb-slider {
    -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 999px;
    background: rgba(148,163,184,0.25);
    outline: none;
  }
  input[type="range"].nb-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px rgba(56,189,248,0.7);
    cursor: pointer;
    border: 2px solid #0f1420;
  }
  input[type="range"].nb-slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #38bdf8; border: 2px solid #0f1420;
    box-shadow: 0 0 8px rgba(56,189,248,0.7);
    cursor: pointer;
  }

  input[type="color"].nb-swatch {
    -webkit-appearance: none; appearance: none;
    width: 30px; height: 30px; border-radius: 8px;
    border: 2px solid rgba(148,163,184,0.3);
    padding: 0; background: none; cursor: pointer;
  }
  input[type="color"].nb-swatch::-webkit-color-swatch-wrapper { padding: 0; border-radius: 6px; }
  input[type="color"].nb-swatch::-webkit-color-swatch { border: none; border-radius: 6px; }

  .preset-swatch {
    width: 20px; height: 20px; border-radius: 6px;
    border: 1.5px solid rgba(255,255,255,0.15);
    transition: transform 0.12s ease;
    flex-shrink: 0;
  }
  .preset-swatch:hover { transform: scale(1.15); }
  .preset-swatch.active { outline: 2px solid #38bdf8; outline-offset: 2px; }

  /* ---- Phase 4: slides + PDF ---- */
  @keyframes spin { to { transform: rotate(360deg); } }
  .animate-spin { animation: spin 1s linear infinite; }

  .thumb-strip { transition: width 0.25s cubic-bezier(0.16,1,0.3,1), opacity 0.2s ease; }
  .thumb-card {
    border: 2px solid transparent;
    transition: border-color 0.15s ease, transform 0.15s ease;
    cursor: pointer;
  }
  .thumb-card:hover { transform: translateY(-1px); }
  .thumb-card.active {
    border-color: #38bdf8;
    box-shadow: 0 0 0 1px rgba(56,189,248,0.3), 0 0 16px rgba(56,189,248,0.35);
  }
  .thumb-card.selected {
    border-color: #818cf8;
    box-shadow: 0 0 0 1px rgba(129,140,248,0.35), 0 0 14px rgba(129,140,248,0.35);
  }
  .navdock-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 8px;
    color: #94a3b8; transition: all 0.15s ease;
  }
  .navdock-btn:hover:not(:disabled) { background: rgba(148,163,184,0.1); color: #e2e8f0; }
  .navdock-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ---- Phase 5: floating widgets ---- */
  .widget-window {
    background: rgba(24, 24, 27, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(63, 63, 70, 0.7);
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
  }
  .widget-header { cursor: grab; user-select: none; touch-action: none; }
  .widget-header:active { cursor: grabbing; }
  .widget-pill {
    background: rgba(24, 24, 27, 0.92);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(63, 63, 70, 0.7);
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .calc-key {
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; font-size: 15px; font-weight: 500;
    background: rgba(148,163,184,0.08); color: #e2e8f0;
    transition: background 0.1s ease, transform 0.1s ease;
    user-select: none;
  }
  .calc-key:hover { background: rgba(148,163,184,0.16); }
  .calc-key:active { transform: scale(0.94); }
  .calc-key.op { background: rgba(56,189,248,0.16); color: #7dd3fc; }
  .calc-key.op:hover { background: rgba(56,189,248,0.26); }
  .calc-key.fn { background: rgba(148,163,184,0.05); color: #94a3b8; font-size: 12px; }
  .calc-key.accent { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0b1220; }

  .laser-trail-canvas { position: absolute; inset: 0; pointer-events: auto; z-index: 25; cursor: crosshair; }

  @keyframes ring-dash { to { stroke-dashoffset: var(--ring-target, 0); } }
</style>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useLayoutEffect, useRef, useCallback, useMemo, useImperativeHandle } = React;

/* ============================== UTIL ============================== */

function useClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  return now;
}

function formatClock(d) {
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const s = String(d.getSeconds()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  return { time: `${String(h).padStart(2, '0')}:${m}:${s}`, ampm };
}

function formatDateLong(d) {
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

function greetingFor(d) {
  const h = d.getHours();
  if (h < 5) return 'Still up';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  if (h < 21) return 'Good evening';
  return 'Good evening';
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  return `${day}d ago`;
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

const SESSIONS_KEY = 'novaboard.sessions.v1';

function loadSessions() {
  try {
    const raw = window.localStorage.getItem(SESSIONS_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveSessions(sessions) {
  try {
    window.localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
  } catch (e) {
    /* storage unavailable — fail silently, session list just won't persist */
  }
}

/* Tiny synchronous flag in localStorage: "was the last page session closed cleanly?"
   (localStorage is only used for this flag and the recents list, never for drawings.) */
function nbReadSessionFlag() {
  try { const r = window.localStorage.getItem(NB_FLAG_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function nbWriteSessionFlag(v) {
  try { window.localStorage.setItem(NB_FLAG_KEY, JSON.stringify({ ...v, t: Date.now() })); } catch (e) { /* ignore */ }
}
/* Evaluated once at load: describes the PREVIOUS page session. */
const NB_BOOT_SESSION = nbReadSessionFlag();

function nbSlimSession(sess) {
  const { thumb, pdfFile, ...rest } = sess; // never put big data or live File objects in localStorage
  return rest;
}

const NB_DB_NAME = 'novaboard-os';
const NB_DB_VERSION = 1;
let nbDbPromise = null;

function nbOpenDb() {
  if (nbDbPromise) return nbDbPromise;
  nbDbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB is not available in this browser.')); return; }
    let req;
    try { req = window.indexedDB.open(NB_DB_NAME, NB_DB_VERSION); } catch (e) { reject(e); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('boards')) db.createObjectStore('boards', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('slides')) db.createObjectStore('slides', { keyPath: 'key' });
      if (!db.objectStoreNames.contains('assets')) db.createObjectStore('assets', { keyPath: 'key' });
    };
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => { db.close(); nbDbPromise = null; };
      db.onclose = () => { nbDbPromise = null; };
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('Could not open the local database.'));
    req.onblocked = () => reject(new Error('The local database is blocked by another NovaBoard tab.'));
  });
  nbDbPromise.catch(() => { nbDbPromise = null; }); // allow a retry after a failure
  return nbDbPromise;
}

async function nbTx(storeNames, mode, work) {
  const db = await nbOpenDb();
  return new Promise((resolve, reject) => {
    let result;
    let tx;
    try { tx = db.transaction(storeNames, mode); } catch (e) { nbDbPromise = null; reject(e); return; }
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error || new Error('Database error'));
    tx.onabort = () => reject(tx.error || new Error('Database transaction aborted'));
    try { result = work(tx); } catch (e) { try { tx.abort(); } catch (_) { /* already finished */ } reject(e); }
  });
}

const nbSlideKey = (boardId, slideId) => boardId + '|' + slideId;
const nbBoardRange = (boardId) => IDBKeyRange.bound(boardId + '|', boardId + '|\uffff');

/* Layout: 'boards' = one small record per board (title, page order, thumbnail);
           'slides' = one record per page (vector JSON + thumbnail);
           'assets' = the big PDF page images, written ONCE per page. */
const NBStore = {
  /* One atomic transaction: write changed pages, upsert the board record, prune deleted pages. */
  async saveBoard({ meta, slideRecords, assetRecords, keepSlideKeys, keepAssetKeys }) {
    await nbTx(['boards', 'slides', 'assets'], 'readwrite', (tx) => {
      const bs = tx.objectStore('boards');
      const ss = tx.objectStore('slides');
      const as = tx.objectStore('assets');
      slideRecords.forEach((r) => ss.put(r));
      assetRecords.forEach((r) => as.put(r));
      bs.put(meta);
      const range = nbBoardRange(meta.id);
      const prune = (store, keep) => {
        const kr = store.getAllKeys(range);
        kr.onsuccess = () => { (kr.result || []).forEach((k) => { if (!keep.has(k)) store.delete(k); }); };
      };
      prune(ss, keepSlideKeys);
      prune(as, keepAssetKeys);
    });
  },
  async loadBoard(boardId) {
    let meta = null; let slideRows = []; let assetRows = [];
    await nbTx(['boards', 'slides', 'assets'], 'readonly', (tx) => {
      const range = nbBoardRange(boardId);
      const r1 = tx.objectStore('boards').get(boardId);
      const r2 = tx.objectStore('slides').getAll(range);
      const r3 = tx.objectStore('assets').getAll(range);
      r1.onsuccess = () => { meta = r1.result || null; };
      r2.onsuccess = () => { slideRows = r2.result || []; };
      r3.onsuccess = () => { assetRows = r3.result || []; };
    });
    if (!meta) return null;
    const byId = new Map(slideRows.map((r) => [r.id, r]));
    const assets = new Map(assetRows.map((r) => [r.key, r.dataUrl]));
    const slides = [];
    (meta.slideIds || []).forEach((id) => {
      const r = byId.get(id);
      if (!r) return; // a missing page is skipped instead of failing the whole board
      slides.push({
        id: r.id, bg: r.bg,
        bgImage: r.hasBgImage ? (assets.get(r.key) || null) : null,
        bgImageW: r.bgImageW || null, bgImageH: r.bgImageH || null,
        json: r.json || null, thumb: r.thumb || null,
        history: { stack: [], index: -1 },
      });
    });
    return { meta, slides };
  },
  async listBoards() {
    let rows = [];
    await nbTx(['boards'], 'readonly', (tx) => {
      const r = tx.objectStore('boards').getAll();
      r.onsuccess = () => { rows = r.result || []; };
    });
    return rows.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  },
  async deleteBoard(boardId) {
    await nbTx(['boards', 'slides', 'assets'], 'readwrite', (tx) => {
      const range = nbBoardRange(boardId);
      tx.objectStore('boards').delete(boardId);
      tx.objectStore('slides').delete(range);
      tx.objectStore('assets').delete(range);
    });
  },
};

/* Keep the recents list at NB_MAX_BOARDS, deleting the stored data of boards that fall off the end. */
function nbCapSessions(list) {
  list.slice(NB_MAX_BOARDS).forEach((sess) => { NBStore.deleteBoard(sess.id).catch(() => {}); });
  return list.slice(0, NB_MAX_BOARDS);
}

/* Build one save batch. `shouldWrite(slide)` picks the pages that changed; the big PDF page
   image of a page is only included if `assetKnown(key)` says it was never stored. */
function nbMakeBatch(board, slides, activeIndex, shouldWrite, assetKnown) {
  const slideRecords = []; const assetRecords = [];
  const keepSlideKeys = new Set(); const keepAssetKeys = new Set();
  slides.forEach((sl) => {
    const key = nbSlideKey(board.id, sl.id);
    keepSlideKeys.add(key);
    if (sl.bgImage) keepAssetKeys.add(key);
    if (shouldWrite(sl)) {
      slideRecords.push({
        key, boardId: board.id, id: sl.id, bg: sl.bg,
        bgImageW: sl.bgImageW || null, bgImageH: sl.bgImageH || null,
        hasBgImage: !!sl.bgImage, json: sl.json || null, thumb: sl.thumb || null,
      });
      if (sl.bgImage && !assetKnown(key)) assetRecords.push({ key, boardId: board.id, dataUrl: sl.bgImage });
    }
  });
  const meta = {
    id: board.id, title: board.title, bg: board.bg, source: board.source || 'blank',
    pageCount: slides.length, activeIndex, slideIds: slides.map((sl) => sl.id),
    thumb: (slides[0] && slides[0].thumb) || null, updatedAt: Date.now(), v: 1,
  };
  return { meta, slideRecords, assetRecords, keepSlideKeys, keepAssetKeys };
}

function nbDescribeError(err) {
  const name = err && err.name; const msg = (err && err.message) || '';
  if (name === 'QuotaExceededError' || /quota/i.test(msg)) return 'Device storage is full. Free some space or save a .novaboard file.';
  return msg || 'Unknown storage error';
}

function nbFmtBytes(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(1) + ' GB';
  return Math.max(1, Math.round(n / 1048576)) + ' MB';
}

async function nbProbeStorage() {
  try { await nbOpenDb(); } catch (e) { return { ok: false, text: 'IndexedDB unavailable' }; }
  let extra = '';
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      if (est && est.quota) extra = ' · ' + nbFmtBytes(Math.max(0, est.quota - (est.usage || 0))) + ' free';
    }
  } catch (e) { /* optional */ }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  return { ok: true, text: 'IndexedDB' + extra };
}

/* ---------- .novaboard files: gzip-compressed JSON (plain JSON is also accepted on open) ---------- */

function nbSafeFileName(title) {
  const t = String(title || 'NovaBoard').replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '').replace(/\s+/g, ' ').trim().slice(0, 80);
  return t || 'NovaBoard';
}

async function nbBuildBoardBlob(board, slides, activeIndex) {
  const payload = {
    format: 'novaboard', version: 1, generator: 'NovaBoard OS ' + NB_VERSION,
    savedAt: new Date().toISOString(),
    title: board.title, bg: board.bg, source: board.source || 'blank', activeIndex,
    slides: slides.map((sl) => ({
      id: sl.id, bg: sl.bg, bgImage: sl.bgImage || null,
      bgImageW: sl.bgImageW || null, bgImageH: sl.bgImageH || null,
      json: sl.json || null, thumb: sl.thumb || null,
    })),
  };
  const text = JSON.stringify(payload);
  if (typeof CompressionStream !== 'undefined') {
    try {
      const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
      return await new Response(stream).blob();
    } catch (e) { /* fall back to plain JSON below */ }
  }
  return new Blob([text], { type: 'application/octet-stream' });
}

async function nbReadBoardText(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf.length > 2 && buf[0] === 0x1f && buf[1] === 0x8b) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('This browser cannot open compressed .novaboard files. Please use a current Chrome, Edge, Firefox or Safari.');
    }
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  return new TextDecoder().decode(buf);
}

/* Validate + sanitise an opened file. Page ids are regenerated so an opened file can never collide with stored boards. */
async function nbParseBoardFile(file) {
  if (!file) throw new Error('No file was selected.');
  if (file.size > 400 * 1024 * 1024) throw new Error('That file is too large to open (over 400 MB).');
  let text;
  try { text = await nbReadBoardText(file); }
  catch (e) { throw new Error((e && e.message) || 'Could not read that file.'); }
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error('This does not look like a valid .novaboard file.'); }
  if (!data || data.format !== 'novaboard' || !Array.isArray(data.slides) || data.slides.length === 0) {
    throw new Error('This file is not a NovaBoard workspace, or it has no pages.');
  }
  if (typeof data.version === 'number' && data.version > 1) {
    throw new Error('This file was saved by a newer version of NovaBoard OS. Please update and try again.');
  }
  const okColor = (c) => typeof c === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(c);
  const okImg = (v) => (typeof v === 'string' && /^data:image\//.test(v) ? v : null);
  const num = (v) => (typeof v === 'number' && isFinite(v) && v > 0 ? v : null);
  const slides = data.slides.slice(0, 500).map((raw) => {
    const sl = raw && typeof raw === 'object' ? raw : {};
    const json = sl.json && typeof sl.json === 'object' && Array.isArray(sl.json.objects) && sl.json.objects.length ? sl.json : null;
    return {
      id: uid(), bg: okColor(sl.bg) ? sl.bg : BLACK_BG,
      bgImage: okImg(sl.bgImage), bgImageW: num(sl.bgImageW), bgImageH: num(sl.bgImageH),
      json, thumb: okImg(sl.thumb), history: { stack: [], index: -1 },
    };
  });
  const ai = typeof data.activeIndex === 'number' ? Math.floor(data.activeIndex) : 0;
  return {
    title: String(data.title || 'Untitled Board').slice(0, 120),
    bg: okColor(data.bg) ? data.bg : slides[0].bg,
    source: 'file',
    activeIndex: Math.max(0, Math.min(ai, slides.length - 1)),
    slides,
  };
}

/* "Save as": native picker where available (chosen BEFORE the heavy work so the click's permission
   is still valid), otherwise a normal download. makeBlob is awaited after the user picks a spot. */
async function nbSaveFile(makeBlob, filename) {
  // Desktop app: native save dialog + atomic write in the main process.
  if (window.novaDesktop && window.novaDesktop.pickSavePath) {
    const picked = await window.novaDesktop.pickSavePath(filename);
    if (!picked) return 'cancelled';
    const blob = await makeBlob();
    await window.novaDesktop.writeSaveFile(picked.token, await blob.arrayBuffer());
    return 'picker';
  }
  let pickerPromise = null;
  if (window.showSaveFilePicker) {
    try {
      pickerPromise = window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description: 'NovaBoard workspace', accept: { 'application/octet-stream': ['.novaboard'] } }],
      });
      pickerPromise.catch(() => {});
    } catch (e) { pickerPromise = null; }
  }
  if (pickerPromise) {
    let handle = null;
    try { handle = await pickerPromise; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; handle = null; }
    if (handle) {
      const blob = await makeBlob();
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      return 'picker';
    }
  }
  const blob = await makeBlob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return 'download';
}

/* ---------- Boot telemetry + chime ---------- */

function nbBootTelemetry(storage) {
  const nav = window.navigator;
  const dpr = window.devicePixelRatio || 1;
  const cores = nav.hardwareConcurrency ? `${nav.hardwareConcurrency} cores` : 'n/a';
  const mem = nav.deviceMemory ? ` · ${nav.deviceMemory} GB` : '';
  return [
    { label: 'KERNEL', value: `novaboard-os ${NB_VERSION}`, ok: true },
    { label: 'DISPLAY', value: `${window.innerWidth}×${window.innerHeight} @${Math.round(dpr * 100) / 100}x`, ok: true },
    { label: 'COMPUTE', value: cores + mem, ok: true },
    { label: 'CANVAS ENGINE', value: window.fabric ? `fabric ${window.fabric.version}` : 'not loaded', ok: !!window.fabric },
    { label: 'DOC ENGINE', value: (window.pdfjsLib ? 'pdf.js' : 'pdf.js missing') + ' · ' + (window.jspdf ? 'jsPDF' : 'jsPDF missing'), ok: !!(window.pdfjsLib && window.jspdf) },
    { label: 'LOCAL STORAGE', value: storage.text, ok: storage.ok },
    { label: 'AUTO-SAVE', value: storage.ok ? 'armed · crash-safe' : 'unavailable', ok: storage.ok },
    { label: 'NETWORK', value: nav.onLine === false ? 'offline · fully local' : 'online', ok: true },
    { label: 'RECOVERY', value: (NB_BOOT_SESSION && NB_BOOT_SESSION.clean === false) ? 'previous session restored' : 'clean boot', ok: true },
  ];
}

/* Classic single "POST OK" beep: a short, quiet square-wave tone like an old PC speaker. */
function nbPlayPostBeep(ctx) {
  const t0 = ctx.currentTime + 0.02;
  const osc = ctx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1000, t0);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 3200;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.006);
  g.gain.setValueAtTime(0.07, t0 + 0.16);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
  osc.connect(lp); lp.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + 0.22);
}

/* Classic startup chime: an original warm rising major chord (C-E-G-C-E) over a soft bass,
   ringing out for about two seconds. Peak level is deliberately low. */
function nbPlayStartupChime(ctx) {
  const t0 = ctx.currentTime + 0.03;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.exponentialRampToValueAtTime(0.22, t0 + 0.05);
  master.gain.setValueAtTime(0.22, t0 + 0.9);
  master.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.8);
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 4200; lp.Q.value = 0.5;
  master.connect(lp); lp.connect(ctx.destination);
  // gentle echo for a bit of space
  const delay = ctx.createDelay(0.5); delay.delayTime.value = 0.18;
  const fb = ctx.createGain(); fb.gain.value = 0.25;
  const wet = ctx.createGain(); wet.gain.value = 0.3;
  lp.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ctx.destination);

  // soft bass under the chord (C3)
  const bass = ctx.createOscillator(); bass.type = 'sine'; bass.frequency.value = 130.81;
  const bg = ctx.createGain();
  bg.gain.setValueAtTime(0.0001, t0);
  bg.gain.exponentialRampToValueAtTime(0.7, t0 + 0.08);
  bg.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
  bass.connect(bg); bg.connect(master); bass.start(t0); bass.stop(t0 + 2.5);

  [261.63, 329.63, 392.0, 523.25, 659.25].forEach((f, i) => {
    const st = t0 + i * 0.11;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.55, st + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 2.0);
    o.connect(g); g.connect(master); o.start(st); o.stop(st + 2.1);
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, st);
    g2.gain.exponentialRampToValueAtTime(0.14, st + 0.02);
    g2.gain.exponentialRampToValueAtTime(0.0001, st + 1.1);
    o2.connect(g2); g2.connect(master); o2.start(st); o2.stop(st + 1.2);
  });
  setTimeout(() => { try { master.disconnect(); lp.disconnect(); delay.disconnect(); wet.disconnect(); } catch (e) { /* closed */ } }, 4200);
}

/* ============================== SPLASH ============================== */

function SplashScreen({ onDone }) {
  const [t, setT] = useState(0);            // milliseconds into the sequence
  const [exiting, setExiting] = useState(false);
  const [audioLocked, setAudioLocked] = useState(false);
  const [storage, setStorage] = useState({ ok: true, text: 'probing…' });
  const doneRef = useRef(onDone);
  doneRef.current = onDone;                 // latest callback without restarting the sequence on re-render
  const finishedRef = useRef(false);
  const audioRef = useRef({ ctx: null, beepDone: false, chimeDone: false, pendingChime: false });
  const reduced = useMemo(() => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches), []);

  // Timeline (ms): POST text -> beep -> logo screen + chime -> fade out.
  const K = useMemo(() => {
    const k = reduced ? 0.45 : 1;
    return { postEnd: 2050 * k, logo: 2400 * k, end: 5000 * k, k };
  }, [reduced]);

  const finish = useCallback(() => {
    if (finishedRef.current) return;
    finishedRef.current = true;
    setExiting(true);
    setTimeout(() => { if (doneRef.current) doneRef.current(); }, 450);
  }, []);

  /* Browsers only allow sound after a user gesture, so the first tap / key press re-tries it. */
  useEffect(() => {
    const a = audioRef.current;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) { a.ctx = new AudioCtx(); if (a.ctx.state !== 'running') a.ctx.resume().catch(() => {}); }
    } catch (e) { /* sound is optional */ }
    const unlock = () => {
      const c = a.ctx;
      if (!c) return;
      c.resume().then(() => {
        if (c.state === 'running' && a.pendingChime && !finishedRef.current) {
          a.pendingChime = false; setAudioLocked(false); nbPlayStartupChime(c);
        }
      }).catch(() => {});
    };
    const onKey = (e) => { unlock(); if (e.key === 'Escape' || e.key === 'Enter') finish(); };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', onKey);
    return () => {
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', onKey);
      const c = a.ctx;
      if (c) setTimeout(() => { try { c.close(); } catch (e) { /* ignore */ } }, 5000); // let the chime ring out
    };
  }, [finish]);

  useEffect(() => {
    let raf = 0;
    const t0 = performance.now();
    const tick = (now) => {
      if (finishedRef.current) return;
      const el = now - t0;
      setT(el);
      const a = audioRef.current;
      const running = !!(a.ctx && a.ctx.state === 'running');
      if (!a.beepDone && el >= K.postEnd) { a.beepDone = true; if (running) nbPlayPostBeep(a.ctx); }
      if (!a.chimeDone && el >= K.logo) {
        a.chimeDone = true;
        if (running) nbPlayStartupChime(a.ctx);
        else { a.pendingChime = true; setAudioLocked(true); }
      }
      if (el >= K.end) { finish(); return; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [K, finish]);

  useEffect(() => {
    let alive = true;
    nbProbeStorage().then((r) => { if (alive) setStorage(r); });
    return () => { alive = false; };
  }, []);

  const lines = useMemo(() => nbBootTelemetry(storage), [storage]);
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const inPost = t < K.logo;
  const memFrac = clamp01((t - 450 * K.k) / (800 * K.k));
  const memKB = Math.round(16384 * memFrac);
  const memDone = memFrac >= 1;
  const rowAt = (i) => (950 + i * 120) * K.k;       // when telemetry row i appears
  const totalBlocks = 24;
  const loadFrac = clamp01((t - K.logo) / (K.end - K.logo - 250 * K.k));
  const litBlocks = Math.round(loadFrac * totalBlocks);

  return (
    <div
      className={`post-bg post-text fixed inset-0 ${exiting ? 'splash-exit' : ''}`}
      role="status" aria-live="polite" aria-label="NovaBoard OS is starting"
    >
      <div className="crt-on absolute inset-0">
        {inPost ? (
          <div key="post" className="absolute inset-0 p-5 sm:p-8 text-[12px] sm:text-[13px] leading-[1.55] overflow-hidden">
            <div className="text-white font-semibold">NovaBoard BIOS v{NB_VERSION}</div>
            <div className="text-slate-500">Copyright (C) NovaBoard Systems. All rights reserved.</div>
            <div className="h-3" />
            {t > 250 * K.k && (
              <div>CPU : {navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency}-core processor` : 'generic processor'}</div>
            )}
            {t > 450 * K.k && (
              <div>
                Memory Test : <span className="tabular-nums">{String(memKB).padStart(5, ' ')}K</span>
                {memDone && <span className="text-emerald-400"> OK</span>}
              </div>
            )}
            <div className="h-3" />
            <div className="max-w-xl">
              {lines.map((l, i) => (t >= rowAt(i) ? (
                <div key={l.label} className="flex gap-2">
                  <span className="w-32 sm:w-36 text-slate-400 flex-shrink-0">{l.label}</span>
                  <span className="flex-1 truncate">{l.value}</span>
                  <span className={l.ok ? 'text-emerald-400' : 'text-amber-400'}>{l.ok ? '[ OK ]' : '[WARN]'}</span>
                </div>
              ) : null))}
            </div>
            {t >= K.postEnd - 120 * K.k && <div className="mt-3 text-white">All systems nominal. Starting NovaBoard OS…</div>}
            <div className="mt-1"><span className="post-cursor" /></div>
          </div>
        ) : (
          <div key="logo" className="post-flick absolute inset-0 flex flex-col items-center justify-center px-4">
            <img
              src={NB_LOGO_SRC} alt="NovaBoard" width="96" height="96" draggable={false}
              className="w-24 h-24 rounded-[22px] mb-5"
              style={{ boxShadow: '0 0 36px rgba(56,189,248,0.35)' }}
            />
            <div className="text-3xl sm:text-4xl font-semibold text-white tracking-[0.28em] pl-[0.28em]">NOVABOARD</div>
            <div className="text-[11px] text-slate-500 tracking-[0.5em] mt-2 pl-[0.5em]">OPERATING SYSTEM {NB_VERSION}</div>
            <div className="mt-8 w-[min(86vw,360px)]">
              <div className="boot-blocks" aria-hidden="true">
                {Array.from({ length: totalBlocks }, (_, i) => <i key={i} className={i < litBlocks ? 'on' : ''} />)}
              </div>
              <div className="text-[11px] text-slate-500 mt-2.5 text-center tracking-wider">
                {loadFrac >= 1 ? 'Ready' : 'Starting NovaBoard OS…'}
              </div>
            </div>
          </div>
        )}
      </div>

      <div className="crt-lines" />
      <button
        onClick={finish}
        className="absolute bottom-4 right-5 z-10 text-[11px] text-slate-500 hover:text-cyan-300 tracking-widest transition-colors focus-ring rounded px-2 py-1"
      >
        SKIP ›
      </button>
      {audioLocked && (
        <div className="absolute bottom-4 left-5 z-10 text-[10px] text-slate-600 tracking-widest">TAP ANYWHERE FOR STARTUP SOUND</div>
      )}
    </div>
  );
}

function HomeScreen({ onEnterCanvas, sessions, setSessions, onOpenFile, recovery, onDismissRecovery }) {
  const [modal, setModal] = useState(null); // null | 'new' | 'upload'
  const [confirm, setConfirm] = useState(null); // {type:'delete', session} | {type:'clear'}
  const [fileError, setFileError] = useState(null);
  const [openingFile, setOpeningFile] = useState(false);
  const fileInputRef = useRef(null);
  const boardInputRef = useRef(null);

  const createSession = useCallback((meta) => {
    const session = {
      id: uid(),
      title: meta.title,
      bg: meta.bg,
      pageCount: 1,
      updatedAt: Date.now(),
      source: meta.source || 'blank',
    };
    setSessions(prev => {
      const next = nbCapSessions([session, ...prev]);
      saveSessions(next.map(nbSlimSession));
      return next;
    });
    // pdfFile (a live File object) can't be persisted, so it's attached only to the
    // in-memory session handed to onEnterCanvas, never to the saved recents entry.
    onEnterCanvas(meta.pdfFile ? { ...session, pdfFile: meta.pdfFile } : session);
  }, [onEnterCanvas, setSessions]);

  const handleFilePicked = useCallback((file) => {
    if (!file) return;
    createSession({
      title: file.name.replace(/\.pdf$/i, ''),
      bg: '#ffffff',
      source: 'pdf',
      pdfFile: file,
    });
  }, [createSession]);

  const handleBoardFilePicked = useCallback(async (file) => {
    if (!file) return;
    setOpeningFile(true);
    try {
      await onOpenFile(file);   // navigates to the canvas on success
    } catch (err) {
      setFileError((err && err.message) || 'Could not open that file.');
      setOpeningFile(false);
    }
  }, [onOpenFile]);

  /* Boards stored in IndexedDB are the source of truth for titles, page counts and thumbnails. */
  useEffect(() => {
    let alive = true;
    NBStore.listBoards().then((metas) => {
      if (!alive || metas.length === 0) return;
      setSessions((prev) => {
        const byId = new Map(prev.map((x) => [x.id, x]));
        metas.forEach((m) => {
          const base = byId.get(m.id) || {};
          byId.set(m.id, { ...base, id: m.id, title: m.title, bg: m.bg, source: m.source, pageCount: m.pageCount, updatedAt: m.updatedAt, thumb: m.thumb || null });
        });
        const merged = Array.from(byId.values()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        const next = nbCapSessions(merged);
        saveSessions(next.map(nbSlimSession));
        return next;
      });
    }).catch(() => { /* storage unavailable: the localStorage list is still shown */ });
    return () => { alive = false; };
  }, [setSessions]);

  const runConfirm = () => {
    const c = confirm;
    setConfirm(null);
    if (!c) return;
    if (c.type === 'clear') {
      sessions.forEach((x) => { NBStore.deleteBoard(x.id).catch(() => {}); });
      setSessions([]);
      saveSessions([]);
    } else {
      NBStore.deleteBoard(c.session.id).catch(() => {});
      setSessions((prev) => {
        const next = prev.filter((x) => x.id !== c.session.id);
        saveSessions(next.map(nbSlimSession));
        return next;
      });
    }
  };

  const recoverySession = recovery ? sessions.find((x) => x.id === recovery.id) : null;

  return (
    <div className="track-in relative h-full overflow-y-auto">
      <div className="max-w-5xl mx-auto px-6 sm:px-10 pt-16 pb-20">
        <HeroGreeting />

        {recoverySession && (
          <div
            className="mt-8 glass rounded-2xl border border-emerald-500/30 p-4 flex items-center gap-3"
            role="status"
            style={{ boxShadow: '0 0 0 1px rgba(52,211,153,0.10), 0 10px 40px -12px rgba(52,211,153,0.25)' }}
          >
            <span className="relative flex h-2.5 w-2.5 flex-shrink-0">
              <span className="breathe-dot absolute inline-flex h-full w-full rounded-full bg-emerald-400" />
              <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400" />
            </span>
            <div className="flex-1 min-w-0">
              <div className="text-sm text-slate-100 font-medium">Your last board was recovered</div>
              <div className="text-xs text-slate-400 truncate">“{recoverySession.title}” was auto-saved {timeAgo(recoverySession.updatedAt)} — pick up right where you left off.</div>
            </div>
            <button
              onClick={() => onEnterCanvas(recoverySession)}
              className="px-3.5 py-2 text-sm rounded-lg font-medium bg-gradient-to-r from-cyan-500 to-indigo-500 text-slate-950 hover:brightness-110 transition-all focus-ring"
            >
              Resume
            </button>
            <button onClick={onDismissRecovery} aria-label="Dismiss" title="Dismiss" className="navdock-btn focus-ring"><IX size={14} /></button>
          </div>
        )}

        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-10">
          <ActionCard
            icon={IPlus}
            title="New blank board"
            desc="Start fresh with a canvas tone of your choice."
            onClick={() => setModal('new')}
            accent="cyan"
          />
          <ActionCard
            icon={IUpload}
            title="Open document / PDF"
            desc="Import a PDF and mark it up page by page."
            onClick={() => fileInputRef.current?.click()}
            accent="indigo"
          />
          <ActionCard
            icon={IFolderOpen}
            title={openingFile ? 'Opening…' : 'Open .novaboard file'}
            desc="Load a workspace you saved from NovaBoard."
            onClick={() => { if (!openingFile) boardInputRef.current?.click(); }}
            accent="cyan"
          />
          <ActionCard
            icon={IClock}
            title="Recent sessions"
            desc="Boards are auto-saved — jump back into any of them."
            onClick={() => {
              const list = document.getElementById('recent-sessions-anchor');
              list?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }}
            accent="indigo"
          />
        </div>

        <input
          ref={fileInputRef}
          type="file"
          accept="application/pdf"
          className="hidden"
          onChange={(e) => { const f = e.target.files?.[0]; e.target.value = ''; handleFilePicked(f); }}
        />
        <input
          ref={boardInputRef}
          type="file"
          accept=".novaboard,.json,application/json"
          className="hidden"
          onChange={(e) => { const f = e.target.files?.[0]; e.target.value = ''; handleBoardFilePicked(f); }}
        />

        <div id="recent-sessions-anchor" className="mt-10">
          <RecentSessions
            sessions={sessions}
            onOpen={(x) => onEnterCanvas(x)}
            onClear={() => setConfirm({ type: 'clear' })}
            onDelete={(x) => setConfirm({ type: 'delete', session: x })}
          />
        </div>
      </div>

      {modal === 'new' && (
        <NewBoardModal
          onClose={() => setModal(null)}
          onCreate={(meta) => { setModal(null); createSession(meta); }}
        />
      )}
      {confirm && (
        <ConfirmDialog
          title={confirm.type === 'clear' ? 'Delete all recent boards?' : 'Delete this board?'}
          body={confirm.type === 'clear'
            ? 'Every board saved on this device will be permanently removed. Files you saved as .novaboard are not affected.'
            : `“${confirm.session.title}” will be permanently removed from this device. A .novaboard file you saved is not affected.`}
          confirmLabel="Delete"
          danger
          onConfirm={runConfirm}
          onCancel={() => setConfirm(null)}
        />
      )}
      {fileError && (
        <ConfirmDialog
          title="Couldn't open that file"
          body={fileError}
          confirmLabel="OK"
          onConfirm={() => setFileError(null)}
          onCancel={() => setFileError(null)}
        />
      )}
    </div>
  );
}

/* Live auto-save indicator for the top bar. */
function SaveStatus({ state }) {
  const now = useClock();
  const status = state.status;
  const secs = Math.max(0, Math.round((now.getTime() - (state.at || now.getTime())) / 1000));
  const ago = secs < 5 ? 'just now' : secs < 60 ? `${secs}s ago` : `${Math.floor(secs / 60)}m ago`;
  let dot = 'bg-emerald-400';
  let pulse = 'breathe-dot';
  let label = 'Saved';
  let tone = 'text-slate-200';
  let title = 'All changes are saved on this device.';
  if (status === 'saving') { pulse = 'save-pulse'; label = 'Saving…'; title = 'Saving your board to this device…'; }
  else if (status === 'error') { dot = 'bg-red-400'; pulse = ''; label = 'Not saved'; tone = 'text-red-300'; title = state.message || 'Auto-save failed. Use Save to keep a copy as a .novaboard file.'; }
  else if (status === 'off') { dot = 'bg-amber-400'; pulse = ''; label = 'Unsaved'; tone = 'text-amber-300'; title = state.message || 'Auto-save is unavailable in this browser. Use Save to keep a copy.'; }
  return (
    <div
      className="flex items-center gap-2 glass rounded-lg px-3 py-1.5 border-slate-700/50"
      role="status" aria-live="polite" title={title}
    >
      <span className="relative flex h-2 w-2">
        <span className={`absolute inline-flex h-full w-full rounded-full ${dot} ${pulse}`} />
        <span className={`relative inline-flex rounded-full h-2 w-2 ${dot}`} />
      </span>
      <span className={`mono text-xs ${tone}`}>{label}</span>
      {status === 'saved' && <span className="mono text-[10px] text-slate-500 hidden lg:inline">{ago}</span>}
    </div>
  );
}

function Toast({ notice }) {

/* Glassmorphic PDF import progress: glowing bar + percentage, fades out once pages are on the board. */
function PdfImportOverlay({ state }) {
  if (!state) return null;
  const { phase, done, total, name } = state;
  const known = total > 0;
  const pct = phase === 'done' || phase === 'out' ? 100 : known ? Math.min(99, Math.round((done / total) * 100)) : 0;
  const out = phase === 'out';
  const finished = phase === 'done' || phase === 'out';
  return (
    <div
      className={`nb-ov fixed inset-0 z-[65] flex items-center justify-center p-4 ${out ? 'out' : ''}`}
      role="status" aria-live="polite" aria-label="Importing PDF"
    >
      <div
        className={`nb-ov-card glass-strong modal-in relative w-full max-w-sm rounded-2xl p-6 ${out ? 'out' : ''}`}
        style={{ boxShadow: '0 0 0 1px rgba(56,189,248,0.18), 0 20px 60px -10px rgba(56,189,248,0.25)' }}
      >
        <div className="flex items-center gap-3 mb-5">
          <span className="w-10 h-10 rounded-xl bg-cyan-500/10 text-cyan-300 flex items-center justify-center flex-shrink-0" style={{ boxShadow: '0 0 20px rgba(56,189,248,0.25)' }}>
            {finished ? <ICheck size={19} /> : <IFileText size={19} />}
          </span>
          <div className="min-w-0">
            <div className="text-sm font-medium text-slate-100">{finished ? 'Document ready' : 'Importing PDF'}</div>
            <div className="text-xs text-slate-500 truncate">{name}</div>
          </div>
        </div>
        <div className="flex items-end justify-between mb-2.5">
          <span
            className="mono text-4xl font-semibold tabular-nums text-slate-100"
            style={{ textShadow: '0 0 24px rgba(56,189,248,0.55)' }}
          >
            {known || finished ? pct : '··'}<span className="text-lg text-cyan-300/80">{known || finished ? '%' : ''}</span>
          </span>
          <span className="mono text-[11px] text-slate-500 pb-1.5">
            {finished ? `${total} page${total === 1 ? '' : 's'}` : known ? `page ${Math.min(done + 1, total)} / ${total}` : 'reading…'}
          </span>
        </div>
        <div className={`nb-prog ${known || finished ? '' : 'indet'}`}><i style={{ width: `${pct}%` }} /></div>
        <div className="mono text-[11px] text-slate-500 mt-3">
          {finished ? 'Pages are on your board.' : known ? 'Rendering pages in high quality…' : 'Opening document…'}
        </div>
      </div>
    </div>
  );
}

/* ---------- Helpers ---------- */

function hexToRgba(hex, alpha) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

/* Contain / letterbox frame. Fits a page of (pageW x pageH) inside the stage
   (stageW x stageH) with no extra margin and centres it:
     scale   = min(stageW / pageW, stageH / pageH)
     offsetX = (stageW - pageW * scale) / 2
     offsetY = (stageH - pageH * scale) / 2 */
function computePageFrame(pageW, pageH, stageW, stageH) {
  const scale = Math.min(stageW / pageW, stageH / pageH);
  return {
    scale,
    offsetX: (stageW - pageW * scale) / 2,
    offsetY: (stageH - pageH * scale) / 2,
  };
}

/* "Page space" = the page's own pixel grid (scale 1, no offset). PDF slides store
   their vector JSON in page space so annotations stay glued to the page no matter
   how the stage is resized. */
const PAGE_SPACE = { scale: 1, offsetX: 0, offsetY: 0 };

/* Re-map objects (live fabric objects OR plain toJSON objects) from one frame to
   another. The mapping is a uniform similarity, so strokes, shapes and their
   line widths all stay aligned with the page. */
function reframeObjects(objs, from, to) {
  if (!from || !to || !from.scale || !to.scale) return;
  const k = to.scale / from.scale;
  objs.forEach((o) => {
    const vals = {
      left: ((o.left || 0) - from.offsetX) * k + to.offsetX,
      top: ((o.top || 0) - from.offsetY) * k + to.offsetY,
      scaleX: (o.scaleX == null ? 1 : o.scaleX) * k,
      scaleY: (o.scaleY == null ? 1 : o.scaleY) * k,
    };
    if (typeof o.setCoords === 'function') { o.set(vals); o.setCoords(); }
    else Object.assign(o, vals);
  });
}

/* Position the locked PDF page image inside the current frame. */
function placeBgImage(img, page, frame) {
  if (!img || !page || !frame) return;
  img.set({
    left: frame.offsetX, top: frame.offsetY,
    scaleX: (page.w * frame.scale) / img.width,
    scaleY: (page.h * frame.scale) / img.height,
  });
  img.setCoords();
}

/* Perceived-luminance test on a #rrggbb / #rgb colour. */
function isLightColor(hex) {
  let h = String(hex).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return false;
  const n = parseInt(h, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150;
}

/* Build a smooth SVG path string from raw points using quadratic midpoints. */
function pointsToSmoothPath(points) {
  if (points.length === 0) return '';
  if (points.length === 1) {
    const p = points[0];
    return `M ${p.x} ${p.y} L ${p.x + 0.01} ${p.y + 0.01}`;
  }
  if (points.length === 2) {
    return `M ${points[0].x} ${points[0].y} L ${points[1].x} ${points[1].y}`;
  }
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length - 1; i++) {
    const mx = (points[i].x + points[i + 1].x) / 2;
    const my = (points[i].y + points[i + 1].y) / 2;
    d += ` Q ${points[i].x} ${points[i].y} ${mx} ${my}`;
  }
  const last = points[points.length - 1];
  d += ` L ${last.x} ${last.y}`;
  return d;
}

/* Build a variable-width filled polygon from points + per-point widths (calligraphy). */
function buildVariableWidthPath(points, widths) {
  if (points.length < 2) {
    const p = points[0];
    const r = (widths[0] || 2) / 2;
    return `M ${p.x - r} ${p.y} a ${r} ${r} 0 1 0 ${r * 2} 0 a ${r} ${r} 0 1 0 ${-r * 2} 0 Z`;
  }
  const left = [], right = [];
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const prev = points[Math.max(0, i - 1)];
    const next = points[Math.min(points.length - 1, i + 1)];
    let dx = next.x - prev.x, dy = next.y - prev.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const nx = -dy, ny = dx;
    const w = (widths[i] || 2) / 2;
    left.push({ x: p.x + nx * w, y: p.y + ny * w });
    right.push({ x: p.x - nx * w, y: p.y - ny * w });
  }
  let d = `M ${left[0].x} ${left[0].y}`;
  for (let i = 1; i < left.length; i++) {
    const mx = (left[i - 1].x + left[i].x) / 2;
    const my = (left[i - 1].y + left[i].y) / 2;
    d += ` Q ${left[i - 1].x} ${left[i - 1].y} ${mx} ${my}`;
  }
  d += ` L ${left[left.length - 1].x} ${left[left.length - 1].y}`;
  d += ` L ${right[right.length - 1].x} ${right[right.length - 1].y}`;
  for (let i = right.length - 2; i >= 0; i--) {
    const mx = (right[i + 1].x + right[i].x) / 2;
    const my = (right[i + 1].y + right[i].y) / 2;
    d += ` Q ${right[i + 1].x} ${right[i + 1].y} ${mx} ${my}`;
  }
  d += ' Z';
  return d;
}

/* ---------- Phase 5: safe calculator expression evaluator (no eval) ---------- */

function safeEvalExpr(expr) {
  let i = 0;
  const s = String(expr).replace(/\s+/g, '');

  const peek = () => s[i];
  const eat = (ch) => { if (s[i] !== ch) throw new Error('Malformed expression'); i++; };

  function parseNumber() {
    const start = i;
    while (i < s.length && /[0-9.]/.test(s[i])) i++;
    if (start === i) throw new Error('Expected number');
    const n = parseFloat(s.slice(start, i));
    if (Number.isNaN(n)) throw new Error('Invalid number');
    return n;
  }
  function parseAtom() {
    if (peek() === '(') { eat('('); const v = parseExpr(); eat(')'); return v; }
    return parseNumber();
  }
  function parseUnary() {
    if (peek() === '-') { i++; return -parseUnary(); }
    if (peek() === '+') { i++; return parseUnary(); }
    return parsePow();
  }
  function parsePow() {
    const left = parseAtom();
    if (peek() === '^') { i++; return Math.pow(left, parseUnary()); }
    return left;
  }
  function parseTerm() {
    let left = parseUnary();
    while (peek() === '*' || peek() === '/' || peek() === '%') {
      const op = s[i]; i++;
      const right = parseUnary();
      if (op === '*') left *= right;
      else if (op === '/') { if (right === 0) throw new Error('Division by zero'); left /= right; }
      else left %= right;
    }
    return left;
  }
  function parseExpr() {
    let left = parseTerm();
    while (peek() === '+' || peek() === '-') {
      const op = s[i]; i++;
      left = op === '+' ? left + parseTerm() : left - parseTerm();
    }
    return left;
  }

  if (s.length === 0) return 0;
  const result = parseExpr();
  if (i !== s.length) throw new Error('Unexpected trailing characters');
  return result;
}

/* ---------- Phase 5: Web Audio bell chime (no external audio files) ---------- */

let sharedAudioCtx = null;
function getAudioCtx() {
  if (!sharedAudioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    sharedAudioCtx = new Ctx();
  }
  if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
  return sharedAudioCtx;
}

/* A soft two-tone bell: two partials with a fast attack and slow exponential decay. */
function playChime() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const master = ctx.createGain();
  master.gain.setValueAtTime(0, now);
  master.connect(ctx.destination);

  const partials = [
    { freq: 880, gain: 0.22, decay: 1.4 },
    { freq: 1320, gain: 0.12, decay: 1.0 },
    { freq: 1760, gain: 0.06, decay: 0.7 },
  ];
  partials.forEach(({ freq, gain, decay }) => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(gain, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    osc.connect(g);
    g.connect(master);
    osc.start(now);
    osc.stop(now + decay + 0.05);
  });
  master.gain.setValueAtTime(1, now);
}

/* ---------- PDF.js loader/config (lazy — only touched when a PDF is actually opened) ---------- */

let pdfjsReadyPromise = null;
function ensurePdfJs() {
  if (pdfjsReadyPromise) return pdfjsReadyPromise;
  pdfjsReadyPromise = new Promise((resolve, reject) => {
    const lib = window.pdfjsLib;
    if (!lib) { reject(new Error('PDF.js failed to load.')); return; }
    lib.GlobalWorkerOptions.workerSrc = window.NB_PDF_WORKER || 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    resolve(lib);
  });
  return pdfjsReadyPromise;
}

/* Rasterize every page of a PDF File to dataURLs at a target CSS pixel width,
   rendered at devicePixelRatio for crispness. Returns [{dataUrl, width, height}]. */
async function rasterizePdfPages(file, onProgress) {
  const lib = await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: buf, ...(window.NB_PDF_OPTS || {}) }).promise;
  if (onProgress) onProgress(0, pdf.numPages);
  const pages = [];
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const baseViewport = page.getViewport({ scale: 1 });
    // Target ~1400px wide canvas for a good quality/size tradeoff, scaled by DPR.
    const targetCssWidth = 1400;
    const scale = (targetCssWidth / baseViewport.width) * dpr;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    pages.push({
      dataUrl: canvas.toDataURL('image/jpeg', 0.9),
      width: viewport.width / dpr,
      height: viewport.height / dpr,
    });
    if (onProgress) onProgress(i, pdf.numPages);
  }
  return pages;
}

/* ---------- jsPDF export ---------- */

/* Build a flattened raster of one slide (background + vector objects) as a dataURL,
   by rendering into an offscreen Fabric StaticCanvas at the slide's native size. */
async function rasterizeSlideForExport(slide, fallbackW, fallbackH) {
  const w = slide.bgImageW || fallbackW;
  const h = slide.bgImageH || fallbackH;
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const staticCanvas = new fabric.StaticCanvas(off, { width: w, height: h });
  staticCanvas.backgroundColor = slide.bg;

  // Load vector objects first (loadFromJSON replaces the canvas's object list
  // and its own backgroundColor), then layer the background image behind
  // everything, then reassert the slide's real bg color. Order matters here.
  if (slide.json) {
    await new Promise((resolve) => {
      staticCanvas.loadFromJSON(slide.json, () => resolve());
    });
  }
  staticCanvas.backgroundColor = slide.bg;

  if (slide.bgImage) {
    await new Promise((resolve) => {
      fabric.Image.fromURL(slide.bgImage, (img) => {
        img.set({ left: 0, top: 0, scaleX: w / img.width, scaleY: h / img.height, selectable: false, evented: false });
        staticCanvas.add(img);
        staticCanvas.sendToBack(img);
        resolve();
      });
    });
  }

  staticCanvas.renderAll();
  const dataUrl = off.toDataURL('image/jpeg', 0.92);
  staticCanvas.dispose();
  return { dataUrl, w, h };
}

async function exportSessionAsPdf(slides, title) {
  const { jsPDF } = window.jspdf;
  let doc = null;
  for (let i = 0; i < slides.length; i++) {
    const slide = slides[i];
    const { dataUrl, w, h } = await rasterizeSlideForExport(slide, 1400, 900);
    const orientation = w >= h ? 'landscape' : 'portrait';
    if (!doc) {
      doc = new jsPDF({ orientation, unit: 'pt', format: [w, h] });
    } else {
      doc.addPage([w, h], orientation);
    }
    doc.addImage(dataUrl, 'JPEG', 0, 0, w, h);
  }
  if (!doc) return;
  doc.save(`${(title || 'NovaBoard').replace(/[^\w\-]+/g, '_')}.pdf`);
}

/* ----- Isometric-style vector projection for 3D wireframes ----- */
// Simple rotation about Y (yaw) then X (tilt), then orthographic projection
// to 2D with a fixed isometric-ish foreshortening. Returns {x,y} in local
// unrotated-canvas units centered at origin.
function project3D(x, y, z, yaw, tilt) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const x1 = x * cy - z * sy;
  const z1 = x * sy + z * cy;
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const y2 = y * ct - z1 * st;
  const z2 = y * st + z1 * ct;
  // orthographic; z2 folded in lightly for a touch of depth-scale (subtle)
  const depthScale = 1 + z2 * 0.0006 * 0;
  return { x: x1 * depthScale, y: y2 * depthScale };
}

function edgesToPathData(vertices, edges) {
  return edges.map(([a, b]) => {
    const p1 = vertices[a], p2 = vertices[b];
    return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`;
  }).join(' ');
}

/* Build the raw (yaw, tilt) -> SVG path-data + bounds for each 3D primitive,
   in a local coordinate space centered at (0,0). Size ~ +/-60 units. */
function build3DGeometry(kind, yaw, tilt) {
  const R = 55;
  let vertices = [], edges = [], extraPaths = [];

  if (kind === 'cube') {
    const s = R * 0.8;
    const pts = [];
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {
      pts.push([sx * s, sy * s, sz * s]);
    }
    // order: 0:---,1:--+,2:-+-,3:-++,4:+--,5:+-+,6:++-,7:+++
    vertices = pts.map(([x, y, z]) => project3D(x, y, z, yaw, tilt));
    edges = [
      [0,1],[1,3],[3,2],[2,0], // x=-1 face
      [4,5],[5,7],[7,6],[6,4], // x=+1 face
      [0,4],[1,5],[2,6],[3,7], // connectors
    ];
  } else if (kind === 'pyramid') {
    const s = R * 0.9, h = R * 1.05;
    const base = [[-s,h*0.4,-s],[s,h*0.4,-s],[s,h*0.4,s],[-s,h*0.4,s]];
    const apex = [0, -h*0.6, 0];
    const pts = [...base, apex];
    vertices = pts.map(([x, y, z]) => project3D(x, y, z, yaw, tilt));
    edges = [[0,1],[1,2],[2,3],[3,0],[0,4],[1,4],[2,4],[3,4]];
  } else if (kind === 'cylinder') {
    const rad = R * 0.62, h = R * 0.95, N = 20;
    const top = [], bot = [];
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2;
      top.push([Math.cos(a) * rad, -h, Math.sin(a) * rad]);
      bot.push([Math.cos(a) * rad, h, Math.sin(a) * rad]);
    }
    const pts = [...top, ...bot];
    vertices = pts.map(([x, y, z]) => project3D(x, y, z, yaw, tilt));
    edges = [];
    for (let i = 0; i < N; i++) edges.push([i, (i + 1) % N]);
    for (let i = 0; i < N; i++) edges.push([N + i, N + ((i + 1) % N)]);
    // a few verticals for depth cues
    for (let i = 0; i < N; i += Math.floor(N / 4)) edges.push([i, N + i]);
  } else if (kind === 'sphere') {
    const rad = R * 0.85, LAT = 5, LON = 12, SEG = 24;
    const rings = []; // latitude circles
    for (let li = 1; li < LAT; li++) {
      const phi = (li / LAT) * Math.PI - Math.PI / 2;
      const ring = [];
      for (let i = 0; i <= SEG; i++) {
        const th = (i / SEG) * Math.PI * 2;
        ring.push([
          rad * Math.cos(phi) * Math.cos(th),
          rad * Math.sin(phi),
          rad * Math.cos(phi) * Math.sin(th),
        ]);
      }
      rings.push(ring);
    }
    const merid = []; // longitude half-circles
    for (let mi = 0; mi < LON; mi++) {
      const th = (mi / LON) * Math.PI * 2;
      const line = [];
      for (let i = 0; i <= SEG; i++) {
        const phi = (i / SEG) * Math.PI - Math.PI / 2;
        line.push([
          rad * Math.cos(phi) * Math.cos(th),
          rad * Math.sin(phi),
          rad * Math.cos(phi) * Math.sin(th),
        ]);
      }
      merid.push(line);
    }
    const toPath = (loop) => {
      const proj = loop.map(([x, y, z]) => project3D(x, y, z, yaw, tilt));
      return 'M ' + proj.map(p => `${p.x} ${p.y}`).join(' L ');
    };
    extraPaths = [...rings.map(toPath), ...merid.slice(0, 6).map(toPath)];
    vertices = []; edges = [];
    // bounding vertices for sizing purposes
    vertices = [
      project3D(-rad,0,0,yaw,tilt), project3D(rad,0,0,yaw,tilt),
      project3D(0,-rad,0,yaw,tilt), project3D(0,rad,0,yaw,tilt),
      project3D(0,0,-rad,yaw,tilt), project3D(0,0,rad,yaw,tilt),
    ];
  }

  const mainPath = edges.length ? edgesToPathData(vertices, edges) : '';
  const fullPath = [mainPath, ...extraPaths].filter(Boolean).join(' ');

  const allX = vertices.map(v => v.x), allY = vertices.map(v => v.y);
  const minX = Math.min(...allX, -R * 0.3), maxX = Math.max(...allX, R * 0.3);
  const minY = Math.min(...allY, -R * 0.3), maxY = Math.max(...allY, R * 0.3);

  return { path: fullPath || 'M 0 0 L 0.01 0.01', bounds: { minX, minY, maxX, maxY } };
}

/* Nudge an absolutely-positioned popover sideways so it never clips outside the canvas stage. */
function useKeepInView(ref) {
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const stage = el.closest('.canvas-stage');
    if (!stage) return;
    el.style.marginLeft = '0px';
    const sr = stage.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    let shift = 0;
    if (r.left < sr.left + 6) shift = sr.left + 6 - r.left;
    else if (r.right > sr.right - 6) shift = sr.right - 6 - r.right;
    if (shift) el.style.marginLeft = `${Math.round(shift)}px`;
  }, []);
}
