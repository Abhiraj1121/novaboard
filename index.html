const CanvasViewport = React.forwardRef(function CanvasViewport({ initialBg }, ref) {
  const wrapRef = useRef(null);
  const canvasElRef = useRef(null);
  const fabricRef = useRef(null);
  const bgImageObjRef = useRef(null); // the fabric.Image used as a locked PDF-page background, if any
  const pageRef = useRef(null);       // {w,h} of the PDF page in page-space px, or null on blank slides
  const frameRef = useRef({ ...PAGE_SPACE }); // current page->stage frame {scale, offsetX, offsetY}
  const loadTokenRef = useRef(0);     // guards against out-of-order async slide loads

  const [tool, setTool] = useState('draw');
  const [pen, setPen] = useState('ballpoint');
  const [color, setColor] = useState('#ffffff');
  const [width, setWidth] = useState(6);
  const [activeShape, setActiveShape] = useState('rect');

  const [historyState, setHistoryState] = useState({ canUndo: false, canRedo: false });
  const [hasObjects, setHasObjects] = useState(false);
  const [confirmClear, setConfirmClear] = useState(false);
  const [rotateHandle, setRotateHandle] = useState(null); // {x,y,yaw,tilt} screen-space, for selected 3D object

  /* Mutable refs so Fabric event handlers (bound once) always read fresh values */
  const toolRef = useRef(tool);
  const penRef = useRef(pen);
  const colorRef = useRef(color);
  const widthRef = useRef(width);
  const activeShapeRef = useRef(activeShape);
  useEffect(() => { toolRef.current = tool; }, [tool]);
  useEffect(() => { penRef.current = pen; }, [pen]);
  useEffect(() => { colorRef.current = color; }, [color]);
  useEffect(() => { widthRef.current = width; }, [width]);
  useEffect(() => { activeShapeRef.current = activeShape; }, [activeShape]);

  const pickShape = useCallback((id) => {
    setActiveShape(id);
    setTool('shape');
  }, []);

  /* History: JSON snapshots of canvas objects */
  const historyRef = useRef({ stack: [], index: -1, locked: false });

  const syncHistoryUI = useCallback(() => {
    const h = historyRef.current;
    setHistoryState({ canUndo: h.index > 0, canRedo: h.index < h.stack.length - 1 });
    const c = fabricRef.current;
    setHasObjects(!!c && c.getObjects().length > 0);
  }, []);

  const pushHistory = useCallback(() => {
    const c = fabricRef.current;
    const h = historyRef.current;
    if (!c || h.locked) return;
    // Snapshots exclude the locked page image (tracked separately) and record the
    // frame they were taken in, so undo/redo stays aligned after a resize.
    const j = c.toJSON(['nbKind', 'nb3D', 'nbYaw', 'nbTilt']);
    j.objects = (j.objects || []).filter((o) => o.nbKind !== 'bgImage');
    j.nbFrame = pageRef.current ? { ...frameRef.current } : null;
    const snap = JSON.stringify(j);
    h.stack = h.stack.slice(0, h.index + 1);
    h.stack.push(snap);
    if (h.stack.length > 100) h.stack.shift();
    h.index = h.stack.length - 1;
    syncHistoryUI();
  }, [syncHistoryUI]);

  const historyDebounceRef = useRef(null);
  const pushHistoryDebounced = useCallback(() => {
    if (historyDebounceRef.current) clearTimeout(historyDebounceRef.current);
    historyDebounceRef.current = setTimeout(() => pushHistory(), 400);
  }, [pushHistory]);

  const restoreHistory = useCallback((idx) => {
    const c = fabricRef.current;
    const h = historyRef.current;
    if (!c || idx < 0 || idx >= h.stack.length) return;
    h.locked = true;
    const snap = JSON.parse(h.stack[idx]);
    const bgImg = bgImageObjRef.current;
    c.loadFromJSON(snap, () => {
      if (bgImg) { c.add(bgImg); c.sendToBack(bgImg); }
      if (pageRef.current && snap.nbFrame) {
        reframeObjects(c.getObjects().filter((o) => o.nbKind !== 'bgImage'), snap.nbFrame, frameRef.current);
      }
      c.renderAll();
      h.index = idx;
      h.locked = false;
      syncHistoryUI();
    });
  }, [syncHistoryUI]);

  const undo = useCallback(() => {
    const h = historyRef.current;
    if (h.index > 0) restoreHistory(h.index - 1);
  }, [restoreHistory]);

  const redo = useCallback(() => {
    const h = historyRef.current;
    if (h.index < h.stack.length - 1) restoreHistory(h.index + 1);
  }, [restoreHistory]);

  /* ---- Init Fabric ---- */
  useEffect(() => {
    const wrap = wrapRef.current;
    const el = canvasElRef.current;
    if (!wrap || !el || !window.fabric) return;

    const dpr = window.devicePixelRatio || 1;
    fabric.Object.prototype.transparentCorners = false;
    fabric.Object.prototype.cornerColor = '#38bdf8';
    fabric.Object.prototype.cornerStrokeColor = '#0f1420';
    fabric.Object.prototype.borderColor = '#38bdf8';
    fabric.Object.prototype.cornerStyle = 'circle';
    fabric.Object.prototype.cornerSize = 10;
    fabric.Object.prototype.borderScaleFactor = 1.5;
    fabric.Object.prototype.padding = 4;

    const canvas = new fabric.Canvas(el, {
      width: wrap.clientWidth,
      height: wrap.clientHeight,
      backgroundColor: initialBg || '#0d3824',
      selection: false,
      preserveObjectStacking: true,
      enableRetinaScaling: true,
      stopContextMenu: true,
      fireRightClick: false,
      perPixelTargetFind: true,
      targetFindTolerance: 8,
    });
    fabricRef.current = canvas;
    // Fabric applies retina scaling using window.devicePixelRatio when enabled.
    void dpr;

    historyRef.current = { stack: [], index: -1, locked: false };
    pushHistory(); // initial empty state

    /* ---- Custom drawing state ---- */
    let drawing = false;
    let pts = [];
    let widths = [];
    let lastT = 0;
    let lastPt = null;
    let smoothedW = widthRef.current;
    let livePath = null;
    let glowRaf = null;

    const stopGlowPulse = () => { if (glowRaf) { cancelAnimationFrame(glowRaf); glowRaf = null; } };

    /* ---- Shape drag-to-size state ---- */
    let shapeStart = null;
    let liveShape = null;

    const commonShapeProps = () => ({
      fill: 'transparent',
      stroke: colorRef.current,
      strokeWidth: widthRef.current,
      strokeUniform: true,
      selectable: false,
      evented: false,
      objectCaching: false,
    });

    const makeArrowHeadPath = (fromX, fromY, toX, toY, size) => {
      const ang = Math.atan2(toY - fromY, toX - fromX);
      const a1 = ang + Math.PI * 0.82, a2 = ang - Math.PI * 0.82;
      return `M ${toX + Math.cos(a1) * size} ${toY + Math.sin(a1) * size} L ${toX} ${toY} L ${toX + Math.cos(a2) * size} ${toY + Math.sin(a2) * size}`;
    };

    const buildStarPoints = (cx, cy, outerR, innerR) => {
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const ang = -Math.PI / 2 + (i * Math.PI) / 5;
        pts.push({ x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang) });
      }
      return pts;
    };

    /* Create (or update, if `existing` passed) a shape object spanning the drag rect. */
    const makeShapeFromDrag = (kind, x0, y0, x1, y1) => {
      const left = Math.min(x0, x1), top = Math.min(y0, y1);
      const w = Math.max(1, Math.abs(x1 - x0)), h = Math.max(1, Math.abs(y1 - y0));
      const cx = left + w / 2, cy = top + h / 2;

      if (kind === 'line') {
        return new fabric.Line([x0, y0, x1, y1], { ...commonShapeProps(), nbKind: 'line' });
      }
      if (kind === 'arrow2') {
        const size = Math.max(10, widthRef.current * 2.2);
        const d = `M ${x0} ${y0} L ${x1} ${y1} ${makeArrowHeadPath(x0, y0, x1, y1, size).slice(1)} `
          + `M ${x1} ${y1} L ${x0} ${y0} ${makeArrowHeadPath(x1, y1, x0, y0, size).slice(1)}`;
        return new fabric.Path(d, { ...commonShapeProps(), fill: null, strokeLineJoin: 'round', strokeLineCap: 'round', nbKind: 'arrow2' });
      }
      if (kind === 'rect') {
        return new fabric.Rect({ ...commonShapeProps(), left, top, width: w, height: h, nbKind: 'rect' });
      }
      if (kind === 'rectRound') {
        return new fabric.Rect({ ...commonShapeProps(), left, top, width: w, height: h, rx: 12, ry: 12, nbKind: 'rectRound' });
      }
      if (kind === 'ellipse') {
        return new fabric.Ellipse({ ...commonShapeProps(), left, top, rx: w / 2, ry: h / 2, nbKind: 'ellipse' });
      }
      if (kind === 'star') {
        const outerR = Math.max(w, h) / 2;
        const pts = buildStarPoints(0, 0, outerR, outerR * 0.42);
        const d = 'M ' + pts.map(p => `${p.x} ${p.y}`).join(' L ') + ' Z';
        return new fabric.Path(d, {
          ...commonShapeProps(), nbKind: 'star',
          left: cx, top: cy, originX: 'center', originY: 'center',
        });
      }
      if (SHAPE_3D_IDS.has(kind)) {
        const yaw = Math.PI / 6, tilt = Math.PI / 7.5;
        const geo = build3DGeometry(kind, yaw, tilt);
        const bw = geo.bounds.maxX - geo.bounds.minX, bh = geo.bounds.maxY - geo.bounds.minY;
        const scale = Math.max(0.2, Math.min(w / bw, h / bh)) || 1;
        const path = new fabric.Path(geo.path, {
          fill: (kind === 'sphere') ? 'transparent' : 'transparent',
          stroke: colorRef.current,
          strokeWidth: Math.max(1, widthRef.current * 0.6),
          strokeUniform: true,
          objectCaching: false,
          strokeLineJoin: 'round',
          strokeLineCap: 'round',
        });
        path.set({
          left: cx, top: cy, originX: 'center', originY: 'center',
          scaleX: scale, scaleY: scale,
          nbKind: kind, nb3D: true, nbYaw: yaw, nbTilt: tilt,
          selectable: false, evented: false,
        });
        return path;
      }
      return null;
    };

    /* Recompute a 3D wireframe's path in place for a new yaw/tilt (used by rotation slider). */
    const rebuild3DPath = (obj, yaw, tilt) => {
      const geo = build3DGeometry(obj.nbKind, yaw, tilt);
      const center = obj.getCenterPoint();
      const prevScaleX = obj.scaleX, prevScaleY = obj.scaleY, prevAngle = obj.angle;
      obj._setPath(fabric.util.parsePath(geo.path), {});
      obj.set({
        left: center.x, top: center.y, originX: 'center', originY: 'center',
        scaleX: prevScaleX, scaleY: prevScaleY, angle: prevAngle,
        nbYaw: yaw, nbTilt: tilt,
      });
      obj.setCoords();
    };
    rebuild3DPathRef.current = rebuild3DPath;

    const makeLivePath = () => {
      const p = penRef.current;
      const col = colorRef.current;
      const w = widthRef.current;
      const d = pointsToSmoothPath(pts);
      const common = {
        fill: null, objectCaching: false, selectable: false, evented: false,
        strokeLineCap: 'round', strokeLineJoin: 'round',
      };
      if (p === 'ballpoint') {
        return new fabric.Path(d, { ...common, stroke: col, strokeWidth: w, nbKind: 'ballpoint' });
      }
      if (p === 'highlighter') {
        // 'multiply' can only darken, so it makes light highlighter colours
        // vanish on dark boards. Use it on light boards (true marker feel,
        // ink shows through) and plain alpha blending on dark boards.
        const light = isLightColor(fabricRef.current?.backgroundColor || '#000');
        return new fabric.Path(d, {
          ...common,
          stroke: hexToRgba(col, 0.35),
          strokeWidth: Math.max(w, 10) * 1.6,
          strokeLineCap: 'butt',
          strokeLineJoin: 'bevel',
          globalCompositeOperation: light ? 'multiply' : 'source-over',
          nbKind: 'highlighter',
        });
      }
      if (p === 'neon') {
        return new fabric.Path(d, {
          ...common,
          stroke: col,
          strokeWidth: w,
          shadow: new fabric.Shadow({ color: col, blur: 14, offsetX: 0, offsetY: 0 }),
          nbKind: 'neon',
        });
      }
      // calligraphy — filled variable-width outline
      const vd = buildVariableWidthPath(pts, widths);
      return new fabric.Path(vd, {
        ...common,
        fill: col, stroke: col, strokeWidth: 0.5,
        nbKind: 'calligraphy',
      });
    };

    const redrawLive = () => {
      if (livePath) canvas.remove(livePath);
      livePath = makeLivePath();
      canvas.add(livePath);
      canvas.requestRenderAll();
    };

    const startNeonPulse = (pathObj) => {
      // brief pulsing glow after stroke finishes: animate shadow blur 14 -> 26 -> 14 once
      if (!pathObj || !pathObj.shadow) return;
      const t0 = performance.now();
      const dur = 650;
      const tick = (t) => {
        const k = Math.min(1, (t - t0) / dur);
        const blur = 14 + Math.sin(k * Math.PI) * 14;
        pathObj.shadow.blur = blur;
        canvas.requestRenderAll();
        if (k < 1) glowRaf = requestAnimationFrame(tick);
        else { pathObj.shadow.blur = 14; canvas.requestRenderAll(); glowRaf = null; }
      };
      glowRaf = requestAnimationFrame(tick);
    };

    const eraseAt = (pointer) => {
      const objs = canvas.getObjects();
      let hit = null;
      for (let i = objs.length - 1; i >= 0; i--) {
        const o = objs[i];
        if (!o.visible || o === livePath) continue;
        // The locked PDF/background image is never erasable, regardless of
        // hit-testing below — scrubbing the eraser over a PDF page must
        // never remove the page itself.
        if (o.nbKind === 'bgImage' || o === bgImageObjRef.current) continue;
        // Cheap bounding-box reject first, then a pixel-accurate check so
        // erasing only triggers when the pointer is actually on the stroke.
        if (!o.containsPoint(pointer)) continue;
        if (canvas.isTargetTransparent(o, pointer.x, pointer.y)) continue;
        hit = o;
        break;
      }
      if (hit) {
        canvas.remove(hit);
        canvas.requestRenderAll();
        return true;
      }
      return false;
    };

    let erasedDuringGesture = false;
    let erasing = false;

    canvas.on('mouse:down', (opt) => {
      const e = opt.e;
      if (e.button !== undefined && e.button !== 0) return;
      const t = toolRef.current;
      const pointer = canvas.getPointer(e);

      if (t === 'draw') {
        drawing = true;
        pts = [{ x: pointer.x, y: pointer.y }];
        widths = [widthRef.current];
        lastT = performance.now();
        lastPt = pointer;
        smoothedW = widthRef.current;
        redrawLive();
      } else if (t === 'eraser') {
        erasing = true;
        erasedDuringGesture = false;
        if (eraseAt(pointer)) erasedDuringGesture = true;
      } else if (t === 'shape') {
        shapeStart = { x: pointer.x, y: pointer.y };
        liveShape = makeShapeFromDrag(activeShapeRef.current, pointer.x, pointer.y, pointer.x + 0.01, pointer.y + 0.01);
        if (liveShape) canvas.add(liveShape);
        canvas.requestRenderAll();
      }
    });

    canvas.on('mouse:move', (opt) => {
      const t = toolRef.current;
      const pointer = canvas.getPointer(opt.e);

      if (t === 'shape' && shapeStart) {
        if (liveShape) canvas.remove(liveShape);
        liveShape = makeShapeFromDrag(activeShapeRef.current, shapeStart.x, shapeStart.y, pointer.x, pointer.y);
        if (liveShape) canvas.add(liveShape);
        canvas.requestRenderAll();
        return;
      }

      if (t === 'draw' && drawing) {
        const last = pts[pts.length - 1];
        const dist = Math.hypot(pointer.x - last.x, pointer.y - last.y);
        if (dist < 1.5) return;

        const now = performance.now();
        const dt = Math.max(1, now - lastT);
        const speed = dist / dt; // px per ms
        lastT = now;
        lastPt = pointer;

        let w = widthRef.current;
        if (penRef.current === 'calligraphy') {
          // fast => thin, slow => thick. Map speed 0..3 px/ms to 1.35x..0.25x of base width.
          const k = Math.min(1, speed / 3);
          const target = widthRef.current * (1.35 - 1.1 * k);
          smoothedW = smoothedW * 0.7 + target * 0.3;
          w = Math.max(1.5, smoothedW);
        }
        pts.push({ x: pointer.x, y: pointer.y });
        widths.push(w);
        redrawLive();
      } else if (t === 'eraser' && erasing) {
        if (eraseAt(pointer)) erasedDuringGesture = true;
      }
    });

    const finishGesture = () => {
      if (shapeStart) {
        const wasShape = liveShape;
        shapeStart = null;
        liveShape = null;
        if (wasShape) {
          const tooSmall = (wasShape.width || 0) * (wasShape.scaleX || 1) < 4
            && (wasShape.height || 0) * (wasShape.scaleY || 1) < 4
            && !wasShape.nb3D;
          if (tooSmall) {
            canvas.remove(wasShape);
          } else {
            wasShape.set({ selectable: true, evented: true, objectCaching: true });
            wasShape.setCoords();
            pushHistory();
            // A freshly-drawn shape should be immediately draggable without
            // an extra click to switch tools — canvas.skipTargetFind (only
            // cleared in Select mode) would otherwise block hit-testing on
            // it even though the object itself is already selectable.
            canvas.skipTargetFind = false;
            canvas.selection = true;
            canvas.setActiveObject(wasShape);
            setTool('select');
          }
          canvas.requestRenderAll();
        }
        return;
      }
      if (drawing) {
        drawing = false;
        if (livePath) {
          // freeze finished stroke: make it selectable for the Select tool
          livePath.set({ selectable: true, evented: true, objectCaching: true });
          livePath.setCoords();
          const finished = livePath;
          livePath = null;
          pts = []; widths = [];
          canvas.requestRenderAll();
          if (finished.nbKind === 'neon') startNeonPulse(finished);
          pushHistory();
        }
      }
      if (erasing) {
        erasing = false;
        if (erasedDuringGesture) pushHistory();
        erasedDuringGesture = false;
      }
    };

    canvas.on('mouse:up', finishGesture);

    /* Selection/transform modifications -> history */
    canvas.on('object:modified', () => { pushHistory(); });

    /* ---- Resize handling (keep sharp on DPR + container changes) ---- */
    const ro = new ResizeObserver(() => {
      const w = wrapRef.current;
      if (!w) return;
      const W = w.clientWidth, H = w.clientHeight;
      if (W <= 0 || H <= 0) return;
      canvas.setDimensions({ width: W, height: H });
      // PDF slide: recompute the contain/letterbox frame for the new stage size,
      // re-place the page, and carry every annotation across with it.
      const page = pageRef.current;
      if (page) {
        const next = computePageFrame(page.w, page.h, W, H);
        canvas.discardActiveObject();
        reframeObjects(canvas.getObjects().filter((o) => o.nbKind !== 'bgImage'), frameRef.current, next);
        frameRef.current = next;
        placeBgImage(bgImageObjRef.current, page, next);
      }
      canvas.requestRenderAll();
    });
    ro.observe(wrap);

    return () => {
      stopGlowPulse();
      ro.disconnect();
      canvas.dispose();
      fabricRef.current = null;
    };
    // Mount-only: one Fabric canvas lives for the whole CanvasScreen session;
    // switching slides swaps its contents via the imperative handle instead
    // of tearing down and recreating the canvas (cheaper, no flash).
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* ---- React to tool mode changes ---- */
  useEffect(() => {
    const c = fabricRef.current;
    if (!c) return;
    const isSelect = tool === 'select';
    c.selection = isSelect;
    c.skipTargetFind = !isSelect;
    c.forEachObject((o) => {
      if (o.nbKind === 'bgImage') return; // locked background never becomes selectable
      o.selectable = isSelect;
      o.evented = isSelect;
    });
    if (!isSelect) { c.discardActiveObject(); }
    c.defaultCursor = (tool === 'draw' || tool === 'shape') ? 'crosshair' : tool === 'eraser' ? 'cell' : 'default';
    c.hoverCursor = isSelect ? 'move' : c.defaultCursor;
    c.requestRenderAll();
  }, [tool]);

  /* ---- Rotation handle for the selected 3D wireframe object ---- */
  const updateRotateHandle = useCallback(() => {
    const c = fabricRef.current;
    if (!c) { setRotateHandle(null); return; }
    const active = c.getActiveObject();
    if (!active || !active.nb3D || c.getActiveObjects().length !== 1) { setRotateHandle(null); return; }
    const br = active.getBoundingRect(true, true);
    setRotateHandle({
      objId: active,
      x: br.left + br.width / 2,
      y: br.top + br.height + 22,
      yaw: active.nbYaw, tilt: active.nbTilt,
    });
  }, []);

  useEffect(() => {
    const c = fabricRef.current;
    if (!c) return;
    const handler = () => updateRotateHandle();
    c.on('selection:created', handler);
    c.on('selection:updated', handler);
    c.on('selection:cleared', handler);
    c.on('object:moving', handler);
    c.on('object:scaling', handler);
    c.on('object:rotating', handler);
    c.on('after:render', handler);
    return () => {
      c.off('selection:created', handler);
      c.off('selection:updated', handler);
      c.off('selection:cleared', handler);
      c.off('object:moving', handler);
      c.off('object:scaling', handler);
      c.off('object:rotating', handler);
      c.off('after:render', handler);
    };
  }, [updateRotateHandle]);

  const rebuild3DPathRef = useRef(null);

  const setObjectYawTilt = useCallback((obj, yaw, tilt) => {
    const c = fabricRef.current;
    if (!c || !rebuild3DPathRef.current) return;
    rebuild3DPathRef.current(obj, yaw, tilt);
    c.requestRenderAll();
    pushHistoryDebounced();
    updateRotateHandle();
  }, [updateRotateHandle]);

  /* Newly finished strokes/objects should respect current mode; also re-apply after history restore */
  useEffect(() => {
    const c = fabricRef.current;
    if (!c) return;
    const apply = () => {
      const isSelect = toolRef.current === 'select';
      c.forEachObject((o) => { if (o.nbKind === 'bgImage') return; o.selectable = isSelect; o.evented = isSelect; });
    };
    c.on('after:render', apply);
    return () => c.off('after:render', apply);
  }, []);

  /* ---- Keyboard shortcuts ---- */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
      if (mod && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
      if (mod) return;
      const k = e.key.toLowerCase();
      if (k === 'v') setTool('select');
      else if (k === 'e') setTool('eraser');
      else if (k === 'b') { setTool('draw'); setPen('ballpoint'); }
      else if (k === 'h') { setTool('draw'); setPen('highlighter'); }
      else if (k === 'c') { setTool('draw'); setPen('calligraphy'); }
      else if (k === 'n') { setTool('draw'); setPen('neon'); }
      else if (k === 'delete' || k === 'backspace') {
        const c = fabricRef.current;
        if (!c) return;
        const active = c.getActiveObjects();
        if (active.length) {
          e.preventDefault();
          active.forEach((o) => c.remove(o));
          c.discardActiveObject();
          c.requestRenderAll();
          pushHistory();
        }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undo, redo, pushHistory]);

  /* ---- Clear board (with confirm; undo also restores it) ---- */
  const doClear = useCallback(() => {
    const c = fabricRef.current;
    if (!c) return;
    c.discardActiveObject();
    c.getObjects().slice().forEach((o) => c.remove(o));
    c.requestRenderAll();
    pushHistory();
    setConfirmClear(false);
  }, [pushHistory]);

  const [bgColor, setBgColorState] = useState(initialBg || '#0d3824');

  /* ---- Imperative API used by CanvasScreen to drive multi-slide switching ---- */
  useImperativeHandle(ref, () => ({
    /* Serialize the current canvas (objects + bg color + bg image ref) into a slide-shaped patch. */
    saveIntoSlide(slide) {
      const c = fabricRef.current;
      if (!c) return slide;
      const bgImg = bgImageObjRef.current;
      // Temporarily pull the locked background image out so it never ends up
      // in the per-slide vector JSON (it's tracked separately as slide.bgImage).
      if (bgImg) c.remove(bgImg);
      const hasObjects = c.getObjects().length > 0;
      const json = hasObjects ? c.toJSON(['nbKind', 'nb3D', 'nbYaw', 'nbTilt']) : null;
      // PDF slides persist vectors in page space (frame-independent).
      if (json && pageRef.current) reframeObjects(json.objects || [], frameRef.current, PAGE_SPACE);
      if (bgImg) { c.add(bgImg); c.sendToBack(bgImg); }
      return { ...slide, bg: bgColor, json, history: historyRef.current };
    },
    /* Load a slide's saved state into the live canvas (used on slide switch). */
    loadSlide(slide) {
      const c = fabricRef.current;
      if (!c) return;
      const token = ++loadTokenRef.current;
      historyRef.current.locked = true;
      c.discardActiveObject();
      c.getObjects().slice().forEach((o) => c.remove(o));
      bgImageObjRef.current = null;
      pageRef.current = null;
      frameRef.current = { ...PAGE_SPACE };
      c.backgroundColor = slide.bg;
      setBgColorState(slide.bg);

      // Keep default ink visible: swap white<->near-black when moving between
      // dark and light blank pages (custom colours are never touched).
      if (!slide.bgImage) {
        const light = isLightColor(slide.bg);
        const cur = String(colorRef.current).toLowerCase();
        if (light && cur === '#ffffff') setColor('#0a0a0a');
        else if (!light && cur === '#0a0a0a') setColor('#ffffff');
      }

      const finishLoad = () => {
        historyRef.current = slide.history && slide.history.stack
          ? { stack: slide.history.stack, index: slide.history.index, locked: false }
          : { stack: [], index: -1, locked: false };
        if (historyRef.current.stack.length === 0) {
          historyRef.current.locked = false;
          pushHistory();
        }
        historyRef.current.locked = false;
        syncHistoryUI();
        c.requestRenderAll();
      };

      const addVectors = (img) => {
        fabric.util.enlivenObjects(slide.json.objects || [], (objs) => {
          if (token !== loadTokenRef.current) return;
          // Saved in page space -> project into the current stage frame.
          if (img) reframeObjects(objs, PAGE_SPACE, frameRef.current);
          objs.forEach((o) => c.add(o));
          const isSelect = toolRef.current === 'select';
          c.forEachObject((o) => { if (o !== img) { o.selectable = isSelect; o.evented = isSelect; } });
          finishLoad();
        });
      };

      if (slide.bgImage) {
        fabric.Image.fromURL(slide.bgImage, (img) => {
          if (token !== loadTokenRef.current) return;
          // Contain / letterbox: the page keeps its true aspect ratio, centred
          // in the stage, with the slide background showing in the bars.
          const page = { w: slide.bgImageW || img.width, h: slide.bgImageH || img.height };
          pageRef.current = page;
          frameRef.current = computePageFrame(page.w, page.h, c.getWidth(), c.getHeight());
          img.set({ selectable: false, evented: false, nbKind: 'bgImage' });
          placeBgImage(img, page, frameRef.current);
          c.add(img);
          c.sendToBack(img);
          bgImageObjRef.current = img;
          if (slide.json) addVectors(img);
          else finishLoad();
        });
      } else if (slide.json) {
        addVectors(null);
      } else {
        finishLoad();
      }
    },
    setBackgroundColor(hex) {
      const c = fabricRef.current;
      if (!c) return;
      c.backgroundColor = hex;
      c.requestRenderAll();
      setBgColorState(hex);
      pushHistory();
    },
    getThumbnail() {
      const c = fabricRef.current;
      if (!c) return null;
      return c.toDataURL({ format: 'jpeg', quality: 0.55, multiplier: 0.22 });
    },
    getBackgroundColor() { return bgColor; },
  }), [bgColor, pushHistory, syncHistoryUI]);

  return (
    <div
      className="canvas-stage flex-1 min-h-0 relative overflow-hidden"
      style={{ background: bgColor }}
    >
      {/* Sizing box is absolutely positioned so the canvas can never
          influence its parent's height (prevents a resize feedback loop). */}
      <div ref={wrapRef} className="absolute inset-0">
        <canvas ref={canvasElRef} />
      </div>
      {!hasObjects && (
        <div className="pointer-events-none absolute inset-0 flex items-center justify-center">
          <div className="text-center px-6">
            <div className="mono text-[11px] tracking-[0.25em] text-white/30 mb-2">CANVAS READY</div>
            <div className="text-white/40 text-sm">Pick a pen below and start drawing.</div>
          </div>
        </div>
      )}
      <DrawToolbar
        tool={tool} setTool={setTool}
        pen={pen} setPen={setPen}
        color={color} setColor={setColor}
        width={width} setWidth={setWidth}
        canUndo={historyState.canUndo} canRedo={historyState.canRedo}
        onUndo={undo} onRedo={redo}
        onClear={() => setConfirmClear(true)}
        hasObjects={hasObjects}
        activeShape={activeShape} onPickShape={pickShape}
      />
      {rotateHandle && (
        <RotateHandle
          x={rotateHandle.x} y={rotateHandle.y}
          yaw={rotateHandle.yaw} tilt={rotateHandle.tilt}
          onChange={(yaw, tilt) => setObjectYawTilt(rotateHandle.objId, yaw, tilt)}
        />
      )}
      {confirmClear && (
        <ConfirmDialog
          title="Clear the whole board?"
          body="Every stroke on this page will be removed. You can still bring it back with Undo (Ctrl/Cmd+Z)."
          confirmLabel="Clear board"
          danger
          onConfirm={doClear}
          onCancel={() => setConfirmClear(false)}
        />
      )}
    </div>
  );
});

function CanvasScreen({ session, onBackHome, onNewBoard }) {
  const viewportRef = useRef(null);
  const [slides, setSlides] = useState(() => [makeSlide(session?.bg || '#0d3824')]);
  const [activeIndex, setActiveIndex] = useState(0);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [importing, setImporting] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [importError, setImportError] = useState(null);
  const [confirmDeletePage, setConfirmDeletePage] = useState(false);
  const [newPageOpen, setNewPageOpen] = useState(false);

  const [widgetDockOpen, setWidgetDockOpen] = useState(false);
  const [widgets, setWidgets] = useState({}); // { timer: {minimized}, calculator: {minimized}, laser: {} }
  const canvasStageRef = useRef(null);

  const [dockSide, setDockSide] = useState('default'); // 'default' | 'swapped'

      activeIndexRef.current = newIndex;
      setActiveIndex(newIndex);
      if (vp) setTimeout(() => vp.loadSlide(next[newIndex]), 0);
      return next;
    });
  }, []);

  const handleReorder = useCallback((fromIdx, toIdx) => {
    setSlides((prev) => {
      const next = prev.slice();
      const [moved] = next.splice(fromIdx, 1);
      next.splice(toIdx, 0, moved);
      slidesRef.current = next;
      // Keep pointing at the same slide object even though its index moved.
      const activeSlideId = prev[activeIndexRef.current]?.id;
      const newActive = next.findIndex((s) => s.id === activeSlideId);
      if (newActive !== -1) { activeIndexRef.current = newActive; setActiveIndex(newActive); }
      return next;
    });
  }, []);

  /* ---- PDF import: rasterize every page into its own slide ---- */
  const importPdfFile = useCallback(async (file) => {
    if (!file) return;
    setImportError(null);
    setImporting(true);
    try {
      const pages = await rasterizePdfPages(file);
      if (pages.length === 0) throw new Error('This PDF has no pages to import.');
      // Use the already-rasterized page image as an instant thumbnail too, so
      // the sidebar shows real content immediately instead of "EMPTY" until
      // the slide is visited once.
      const newSlides = pages.map((p) => {
        const slide = makeSlide(PDF_LETTERBOX_BG, { bgImage: p.dataUrl, bgImageW: p.width, bgImageH: p.height });
        slide.thumb = p.dataUrl;
        return slide;
      });
      setSlides(newSlides);
      slidesRef.current = newSlides;
      activeIndexRef.current = 0;
      setActiveIndex(0);
      setTimeout(() => viewportRef.current?.loadSlide(newSlides[0]), 0);
    } catch (err) {
      console.error(err);
      setImportError(err.message || 'Could not read that PDF.');
    } finally {
      setImporting(false);
    }
  }, []);

  /* ---- PDF export: flatten every slide (bg + vectors) into a downloadable multi-page PDF ---- */
  const handleExportPdf = useCallback(async () => {
    const vp = viewportRef.current;
    if (!vp) return;
    setExporting(true);
    try {
      captureActiveSlide();
      // captureActiveSlide's setSlides is async; grab a synchronously-correct
      // copy by re-saving directly into a local array for export.
      const i = activeIndexRef.current;
      const current = slidesRef.current.slice();
      const saved = vp.saveIntoSlide(current[i]);
      current[i] = saved;
      await exportSessionAsPdf(current, session?.title || 'NovaBoard');
    } catch (err) {
      console.error(err);
      setImportError('Export failed: ' + (err.message || 'unknown error'));
    } finally {
      setExporting(false);
    }
  }, [captureActiveSlide, session?.title]);

  const activeSlide = slides[activeIndex];

  const navSide = dockSide === 'swapped' ? 'right' : 'left';
  const actionSide = dockSide === 'swapped' ? 'left' : 'right';

  /* Smooth dock swap (FLIP): record where each dock is, flip the side, then
     animate each from its old x-position to its new one. */
  const navWrapRef = useRef(null);
  const actWrapRef = useRef(null);
  const swapFromRef = useRef(null);
  const swapDocks = useCallback(() => {
    if (!navWrapRef.current || !actWrapRef.current) return;
    swapFromRef.current = {
      nav: navWrapRef.current.getBoundingClientRect().left,
      act: actWrapRef.current.getBoundingClientRect().left,
    };
    setWidgetDockOpen(false);
    setDockSide((v) => (v === 'swapped' ? 'default' : 'swapped'));
  }, []);
  useLayoutEffect(() => {
    const from = swapFromRef.current;
    if (!from) return;
    swapFromRef.current = null;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    [[navWrapRef.current, from.nav], [actWrapRef.current, from.act]].forEach(([el, x0]) => {
      if (!el || reduce) return;
      const dx = x0 - el.getBoundingClientRect().left;
      if (!dx) return;
      el.style.transition = 'none';
      el.style.transform = `translateX(${dx}px)`;
      void el.offsetWidth; // commit the starting position before animating
      el.style.transition = 'transform 420ms cubic-bezier(0.22, 1, 0.36, 1)';
      el.style.transform = 'translateX(0)';
      setTimeout(() => { el.style.transition = ''; el.style.transform = ''; }, 460);
    });
  }, [dockSide]);

  return (
    <div ref={rootRef} className="track-in h-full flex flex-col relative">
      {!topBarHidden && (
        <CanvasTopBar
          session={{ ...session, bg: activeSlide?.bg }}
          onBackHome={onBackHome}
          onNewBoard={onNewBoard}
          isFullscreen={isFullscreen}
          onToggleFullscreen={toggleFullscreen}
        />
      )}
      <TopBarCollapseTab hidden={topBarHidden} onToggle={() => setTopBarHidden((v) => !v)} />
      {topBarHidden && <PersistentClock />}

      <div className="flex-1 min-h-0 flex relative">
        <ThumbnailSidebar
          slides={slides}
          activeIndex={activeIndex}
          onSelect={goToSlide}
          onReorder={handleReorder}
          collapsed={sidebarCollapsed}
          onToggle={() => setSidebarCollapsed((v) => !v)}
        />
        <SidebarToggle collapsed={sidebarCollapsed} onToggle={() => setSidebarCollapsed((v) => !v)} />
        <div ref={canvasStageRef} className="flex-1 min-w-0 relative flex flex-col overflow-hidden">
          <div ref={navWrapRef} className={`absolute bottom-4 z-30 ${navSide === 'right' ? 'right-4' : 'left-4'}`}>
            <NavDock
              index={activeIndex}
              total={slides.length}
              onPrev={() => goToSlide(activeIndex - 1)}
              onNext={() => goToSlide(activeIndex + 1)}
              onAddPage={() => setNewPageOpen(true)}
              onDeletePage={() => setConfirmDeletePage(true)}
              onSwap={swapDocks}
              side={navSide}
            />
          </div>
          <div ref={actWrapRef} className={`absolute bottom-4 z-30 ${actionSide === 'right' ? 'right-4' : 'left-4'}`}>
            <ActionDock
              onImportPdf={importPdfFile}
              importing={importing}
              onExportPdf={handleExportPdf}
              exporting={exporting}
              widgetDockOpen={widgetDockOpen}
              setWidgetDockOpen={setWidgetDockOpen}
              activeWidgets={activeWidgetFlags}
              onLaunchWidget={launchWidget}
              onSwap={swapDocks}
              side={actionSide}
            />
          </div>
          <CanvasViewport ref={viewportRef} initialBg={activeSlide?.bg} />

          {widgets.laser && (
            <LaserPointerOverlay containerRef={canvasStageRef} color="#38bdf8" />
          )}

          {widgets.timer && (
            <WidgetWindow
              title="Timer / Stopwatch" icon={ITimerIcon}
              initialPos={{ x: 24, y: 70 }} boundsRef={canvasStageRef}
              minimized={widgets.timer.minimized}
              onMinimize={() => toggleMinimize('timer', true)}
              onRestore={() => toggleMinimize('timer', false)}
              onClose={() => closeWidget('timer')}
            >
              <TimerWidget />
            </WidgetWindow>
          )}

          {widgets.calculator && (
            <WidgetWindow
              title="Scientific Calculator" icon={ICalcIcon}
              initialPos={{ x: 24, y: 340 }} boundsRef={canvasStageRef}
              minimized={widgets.calculator.minimized}
              onMinimize={() => toggleMinimize('calculator', true)}
              onRestore={() => toggleMinimize('calculator', false)}
              onClose={() => closeWidget('calculator')}
            >
              <CalculatorWidget />
            </WidgetWindow>
          )}
        </div>
      </div>

      {newPageOpen && (
        <NewPageModal
          onCancel={() => setNewPageOpen(false)}
          onPick={(bg) => { setNewPageOpen(false); handleAddPage(bg); }}
        />
      )}
      {confirmDeletePage && (
        <ConfirmDialog
          title="Delete this page?"
          body={`Page ${activeIndex + 1} and everything drawn on it will be removed. This can't be undone.`}
          confirmLabel="Delete page"
          danger
          onConfirm={doDeletePage}
          onCancel={() => setConfirmDeletePage(false)}
        />
      )}
      {importError && (
        <ConfirmDialog
          title="Import problem"
          body={importError}
          confirmLabel="OK"
          onConfirm={() => setImportError(null)}
          onCancel={() => setImportError(null)}
        />
      )}
    </div>
  );
}

/* ============================== APP ROOT ============================== */

const VIEWS = { SPLASH: 'VIEW_SPLASH', HOME: 'VIEW_HOME', CANVAS: 'VIEW_CANVAS' };

function App() {
  const [view, setView] = useState(VIEWS.SPLASH);
  const [activeSession, setActiveSession] = useState(null);
  const [sessions, setSessions] = useState(() => loadSessions());

  const enterCanvas = useCallback((session) => {
    setActiveSession(session);
    setView(VIEWS.CANVAS);
  }, []);

  const goHome = useCallback(() => {
    setActiveSession(null);
    setView(VIEWS.HOME);
  }, []);

  return (
    <div className="h-full w-full relative">
      {view === VIEWS.SPLASH && (
        <SplashScreen onDone={() => setView(VIEWS.HOME)} />
      )}
      {view === VIEWS.HOME && (
        <HomeScreen onEnterCanvas={enterCanvas} sessions={sessions} setSessions={setSessions} />
      )}
      {view === VIEWS.CANVAS && (
        <CanvasScreen session={activeSession} onBackHome={goHome} onNewBoard={goHome} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
