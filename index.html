  }, [activeShape]);

  const PENS = [
    { id: 'ballpoint', title: 'Ballpoint (B)', icon: IPenBall, short: 'Ballpoint' },
    { id: 'highlighter', title: 'Highlighter (H)', icon: IHighlighter, short: 'Highlight' },
    { id: 'calligraphy', title: 'Calligraphy (C)', icon: ICalligraphy, short: 'Callig.' },
    { id: 'neon', title: 'Neon glow (N)', icon: INeon, short: 'Neon' },
    { id: 'dashed', title: 'Dashed pen (D)', icon: IDashedPen, short: 'Dashed' },
    { id: 'emoji', title: 'Emoji pen (M)', icon: IEmojiPen, short: 'Emoji' },
    { id: 'laser', title: 'Laser pen — fades in 3s (L)', icon: ILaserPen, short: 'Laser' },
  ];

  /* ---- Drag the whole bar by its grip (mouse + touch). Double-click the grip to re-dock. ---- */
  const onGripDown = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    const el = barRef.current;
    const parent = el && el.offsetParent;
    if (!el || !parent) return;
    e.preventDefault();
    setStyleFor(null);
    setShapeMenuOpen(false);
    setPenMenuOpen(false);
    const pr = parent.getBoundingClientRect();
    const er = el.getBoundingClientRect();
    const start = {
      px: e.clientX, py: e.clientY,
      left: er.left - pr.left, top: er.top - pr.top,
      w: er.width, h: er.height, pw: pr.width, ph: pr.height,
    };
    const move = (ev) => {
      setPos({
        left: clamp(start.left + ev.clientX - start.px, 0, Math.max(0, start.pw - start.w)),
        top: clamp(start.top + ev.clientY - start.py, 0, Math.max(0, start.ph - start.h)),
      });
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  };

  /* Keep a dragged bar inside the stage when the stage (or the bar) changes size. */
  useEffect(() => {
    const el = barRef.current;
    const parent = el && el.offsetParent;
    if (!el || !parent || !window.ResizeObserver) return;
    const ro = new ResizeObserver(() => {
      setPos((p) => {
        if (!p) return p;
        const pr = parent.getBoundingClientRect();
        const er = el.getBoundingClientRect();
        const left = clamp(p.left, 0, Math.max(0, pr.width - er.width));
        const top = clamp(p.top, 0, Math.max(0, pr.height - er.height));
        return (left === p.left && top === p.top) ? p : { left, top };
      });
    });
    ro.observe(parent);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // One pen button: it shows the current pen and opens the pen picker (also arms the pen tool).
  const activePen = PENS.find((pn) => pn.id === pen) || PENS[0];
  const onPenButtonClick = () => {
    setShapeMenuOpen(false);
    setStyleFor(null);
    if (!isDrawTool) setTool('draw');
    setPenMenuOpen((v) => !v);
  };
  const onPickPen = (id) => { setTool('draw'); setPen(id); setPenMenuOpen(false); };
  // Shape: inactive -> shape picker; active -> style popover.
  const onShapeClick = () => {
    if (tool === 'shape') { setShapeMenuOpen(false); setStyleFor((v) => (v === 'shape' ? null : 'shape')); return; }
    setStyleFor(null);
    setShapeMenuOpen((v) => !v);
  };
  // Text: inactive -> arm the text tool; active -> size + colour popover.
  const onTextClick = () => {
    setShapeMenuOpen(false);
    if (tool === 'text') { setStyleFor((v) => (v === 'text' ? null : 'text')); return; }
    setStyleFor(null);
    setTool('text');
  };

  const InkDot = () => (
    <span
      className="absolute bottom-0.5 right-0.5 w-2 h-2 rounded-full pointer-events-none"
      style={{ background: color, boxShadow: '0 0 0 1.5px rgba(15,20,32,0.95)' }}
    />
  );

  const popover = (id, label, extra) => styleFor === id && (
    <StylePopover
      anchorRef={refFor(id)} label={label}
      color={color} setColor={setColor} width={width} setWidth={setWidth}
      onClose={closeStyle} down={popDown}
      {...(extra || {})}
    />
  );

  const Divider = () => <div className="w-px h-5 bg-slate-700/60" />;

  const grip = (
    <div
      onPointerDown={onGripDown}
      onDoubleClick={() => setPos(null)}
      title="Drag to move the toolbar · double-click to dock it at the bottom"
      aria-label="Move toolbar"
      className="flex items-center justify-center w-5 h-8 rounded-md text-slate-500 hover:text-slate-300 cursor-grab active:cursor-grabbing select-none"
      style={{ touchAction: 'none' }}
    >
      <IGrip size={14} />
    </div>
  );

  return (
    <div
      ref={barRef}
      className={`glass-strong absolute z-30 rounded-xl px-1.5 py-1 flex flex-wrap items-center justify-center gap-x-1.5 gap-y-1 shadow-2xl ${pos ? '' : 'left-1/2 -translate-x-1/2 bottom-[72px]'}`}
      style={{ width: 'max-content', maxWidth: 'calc(100% - 12px)', ...(pos ? { left: pos.left, top: pos.top } : null) }}
    >
      {grip}

      {collapsed ? (
        <ToolButton onClick={() => setCollapsed(false)} title="Expand toolbar"><IChevronUpSmall size={15} /></ToolButton>
      ) : (
        <>
          {/* Mode tools */}
          <div className="flex items-center gap-0.5">
            <ToolButton active={gridMode !== 'off'} onClick={onCycleGrid} title={`Background guide: ${gridMode} (click to change)`}>
              <IGridIcon size={16} />
            </ToolButton>
            <ToolButton active={tool === 'select'} onClick={() => { setStyleFor(null); setTool('select'); }} title="Select / Move (V)">
              <ICursor size={16} />
            </ToolButton>
            <ToolButton active={tool === 'eraser'} onClick={() => { setStyleFor(null); setTool('eraser'); }} title="Stroke eraser (E)">
              <IEraser size={16} />
            </ToolButton>
          </div>

          <Divider />

          {/* Pens — a single button that opens the pen picker */}
          <div ref={anchorRef('pen')} className="relative">
            <ToolButton active={isDrawTool} onClick={onPenButtonClick} title={`${activePen.title} — click to switch pen`}>
              <activePen.icon size={16} />
            </ToolButton>
            {isDrawTool && <InkDot />}
            {penMenuOpen && (
              <PenFlyout
                pens={PENS} activePen={isDrawTool ? pen : null} down={popDown} anchorRef={refFor('pen')}
                onPick={onPickPen}
                onStyle={() => { setPenMenuOpen(false); setTool('draw'); setStyleFor('pen'); }}
                onClose={() => setPenMenuOpen(false)}
              />
            )}
            {popover('pen', activePen.title.replace(/ \(.\)$/, ''))}
          </div>

          {isDrawTool && pen === 'emoji' && (
            <div className="flex items-center gap-0.5 max-w-full overflow-x-auto" aria-label="Emoji palette">
              {NB_EMOJIS.map((em) => (
                <button key={em} onClick={() => setEmoji(em)} title={`Stamp ${em}`}
                  className={`w-7 h-7 rounded-md text-base leading-none focus-ring ${emoji === em ? 'bg-cyan-500/25 ring-1 ring-cyan-400/60' : 'hover:bg-slate-700/50'}`}
                  style={{ fontFamily: NB_EMOJI_FONT }}>{em}</button>
              ))}
            </div>
          )}

          <Divider />

          {/* Shapes + Text */}
          <div className="flex items-center gap-0.5">
            <div ref={anchorRef('shape')} className="relative">
              <ToolButton active={tool === 'shape'} onClick={onShapeClick} title={tool === 'shape' ? 'Shapes (S) — click for width & colour' : 'Shapes (S)'}>
                <ActiveShapeIcon size={16} />
              </ToolButton>
              {tool === 'shape' && <InkDot />}
              {shapeMenuOpen && (
                <ShapeFlyout
                  activeShape={activeShape} down={popDown} anchorRef={refFor('shape')}
                  onPick={(id) => { onPickShape(id); setShapeMenuOpen(false); }}
                  onClose={() => setShapeMenuOpen(false)}
                />
              )}
              {popover('shape', 'Shape')}
            </div>

            <div ref={anchorRef('text')} className="relative">
              <ToolButton active={tool === 'text'} onClick={onTextClick} title={tool === 'text' ? 'Text (T) — click for size & colour' : 'Text (T) — click the board to type'}>
                <span className="font-bold text-[15px] leading-none" style={{ fontFamily: TEXT_FONT }}>T</span>
              </ToolButton>
              {tool === 'text' && <InkDot />}
              {popover('text', 'Text', { widthLabel: 'TEXT SIZE', widthFormat: (w) => `${textSizeFor(w)}px` })}
            </div>
          </div>

          <Divider />

          {/* History */}
          <div className="flex items-center gap-0.5">
            <ToolButton onClick={onUndo} disabled={!canUndo} title="Undo (Ctrl/Cmd+Z)"><IUndo size={16} /></ToolButton>
            <ToolButton onClick={onRedo} disabled={!canRedo} title="Redo (Ctrl/Cmd+Y)"><IRedo size={16} /></ToolButton>
          </div>

          <Divider />

          {/* Copy / paste objects (works across pages) */}
          <div className="flex items-center gap-0.5">
            <ToolButton onClick={onCopy} disabled={!canCopy} title="Copy selected objects (Ctrl/Cmd+C)"><ICopy size={16} /></ToolButton>
            <ToolButton onClick={onPaste} disabled={!canPaste} title="Paste (Ctrl/Cmd+V) — works on any page"><IPaste size={16} /></ToolButton>
          </div>

          <Divider />

          <div className="flex items-center gap-0.5">
            <ToolButton onClick={onClear} disabled={!hasObjects} title="Clear board"><IEraseAll size={16} /></ToolButton>
            <ToolButton onClick={() => { setStyleFor(null); setShapeMenuOpen(false); setCollapsed(true); }} title="Collapse toolbar"><IChevronDownSmall size={15} /></ToolButton>
          </div>
        </>
      )}
    </div>
  );
}

/* ---------- Canvas viewport (Fabric.js) ---------- */

function RotateHandle({ x, y, yaw, tilt, onChange }) {
  const toDeg = (r) => Math.round((r * 180) / Math.PI);
  const toRad = (d) => (d * Math.PI) / 180;
  return (
    <div
      className="glass-strong absolute z-20 rounded-xl px-3 py-2.5 flex items-center gap-3 shadow-xl"
      style={{ left: x, top: y, transform: 'translate(-50%, 0)' }}
      onMouseDown={(e) => e.stopPropagation()}
    >
      <IRotate size={14} className="text-cyan-300 flex-shrink-0" />
      <div className="flex items-center gap-1.5">
        <span className="mono text-[10px] text-slate-500">YAW</span>
        <input
          type="range" min="-180" max="180" value={toDeg(yaw)}
          onChange={(e) => onChange(toRad(parseInt(e.target.value, 10)), tilt)}
          className="nb-slider w-20"
        />
      </div>
      <div className="flex items-center gap-1.5">
        <span className="mono text-[10px] text-slate-500">TILT</span>
        <input
          type="range" min="-90" max="90" value={toDeg(tilt)}
          onChange={(e) => onChange(yaw, toRad(parseInt(e.target.value, 10)))}
          className="nb-slider w-20"
        />
      </div>
    </div>
  );
}

/* ---------- Phase 4: Thumbnail sidebar ---------- */

function ThumbnailSidebar({
  slides, activeIndex, onSelect, onReorder, collapsed,
  selectMode, setSelectMode, selectedIds, setSelectedIds, onDeleteSelected,
  onAddPage, onDuplicateAt,
}) {
  // While a page is being dragged: { from, gap, x, y }. `gap` is the slot (0..n) it would drop into.
  const [drag, setDrag] = useState(null);
  const anchorRef = useRef(null);
  const listRef = useRef(null);
  const cellRefs = useRef([]);
  const dragRef = useRef(null);
  const justDraggedRef = useRef(false);
  const countRef = useRef(slides.length);
  countRef.current = slides.length;
  const reorderRef = useRef(onReorder);
  reorderRef.current = onReorder;
  const selectedSet = useMemo(() => new Set(selectedIds), [selectedIds]);
  const count = selectedIds.length;
  // At least one page must always remain.
  const canDelete = count > 0 && count < slides.length;

  const toggleSelectMode = () => {
    setSelectMode(!selectMode);
    setSelectedIds([]);
    anchorRef.current = null;
  };
  const toggleOne = (id, i) => {
    setSelectedIds(selectedSet.has(id) ? selectedIds.filter((x) => x !== id) : [...selectedIds, id]);
    anchorRef.current = i;
  };
  const selectRange = (i) => {
    const a = anchorRef.current == null ? activeIndex : anchorRef.current;
    const lo = Math.min(a, i), hi = Math.max(a, i);
    const ids = new Set(selectedIds);
    for (let k = lo; k <= hi; k++) { if (slides[k]) ids.add(slides[k].id); }
    setSelectedIds(Array.from(ids));
  };
  const onCardClick = (e, i, s) => {
    if (justDraggedRef.current) return; // the click that ends a drag is not a selection
    if (selectMode) {
      if (e.shiftKey) selectRange(i); else toggleOne(s.id, i);
      return;
    }
    // Desktop shortcuts: Shift+click = range, Ctrl/Cmd+click = add to selection.
    if (e.shiftKey) { setSelectMode(true); selectRange(i); return; }
    if (e.ctrlKey || e.metaKey) { setSelectMode(true); toggleOne(s.id, i); return; }
    onSelect(i);
  };

  /* ---- Drag to reorder (pointer events: mouse, pen and touch). Touch drags start from the grip. ---- */
  const gapAt = (clientY) => {
    const n = countRef.current;
    for (let k = 0; k < n; k++) {
      const el = cellRefs.current[k];
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (clientY < r.top + r.height / 2) return k;
    }
    return n;
  };
  const overList = (x) => {
    const l = listRef.current;
    if (!l) return false;
    const r = l.getBoundingClientRect();
    return x >= r.left - 30 && x <= r.right + 30;
  };
  const onCellPointerDown = (e, i, fromGrip) => {
    if (selectMode || dragRef.current) return;
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest && e.target.closest('[data-nodrag]')) return;
    if (e.pointerType === 'touch' && !fromGrip) return; // a touch on the card scrolls the list
    const st = { from: i, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, active: false };
    dragRef.current = st;
    let raf = 0;
    const publish = () => setDrag({ from: st.from, gap: overList(st.x) ? gapAt(st.y) : null, x: st.x, y: st.y });
    const scrollLoop = () => {
      if (dragRef.current !== st || !st.active) return;
      const l = listRef.current;
      if (l) {
        const r = l.getBoundingClientRect();
        const edge = 36;
        let dy = 0;
        if (st.y < r.top + edge) dy = -Math.ceil((r.top + edge - st.y) / 4);
        else if (st.y > r.bottom - edge) dy = Math.ceil((st.y - (r.bottom - edge)) / 4);
        if (dy) { const before = l.scrollTop; l.scrollTop += dy; if (l.scrollTop !== before) publish(); }
      }
      raf = requestAnimationFrame(scrollLoop);
    };
    const move = (ev) => {
      st.x = ev.clientX; st.y = ev.clientY;
      if (!st.active) {
        if (Math.hypot(st.x - st.sx, st.y - st.sy) < (fromGrip ? 3 : 6)) return;
        st.active = true;
        justDraggedRef.current = true;
        raf = requestAnimationFrame(scrollLoop);
      }
      publish();
    };
    const end = (commit) => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
      window.removeEventListener('keydown', onKey);
      cancelAnimationFrame(raf);
      dragRef.current = null;
      if (st.active) {
        if (commit && overList(st.x)) {
          const gap = gapAt(st.y);
          const to = gap > st.from ? gap - 1 : gap;
          if (to !== st.from) reorderRef.current(st.from, to);
        }
        setTimeout(() => { justDraggedRef.current = false; }, 0);
      }
      setDrag(null);
    };
    const onUp = () => end(true);
    const onCancel = () => end(false);
    const onKey = (ev) => { if (ev.key === 'Escape') end(false); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
    window.addEventListener('keydown', onKey);
  };

  const DropBar = ({ edge }) => (
    <div
      className="pointer-events-none absolute left-0 right-0 h-[3px] rounded-full bg-cyan-400 z-10"
      style={{ [edge]: -7, boxShadow: '0 0 8px rgba(34,211,238,0.85)' }}
    />
  );
  const btn = 'flex-1 flex items-center justify-center gap-1 mono text-[10px] px-1.5 py-1 rounded border transition-colors focus-ring';

  return (
    <div
      className={`thumb-strip glass border-r border-slate-700/40 flex flex-col flex-shrink-0 overflow-hidden ${collapsed ? 'w-0' : 'w-[168px]'}`}
    >
      <div className="px-3 py-2 border-b border-slate-700/40 flex-shrink-0">
        <div className="flex items-center justify-between">
          <span className="mono text-[10px] tracking-wider text-slate-500">PAGES</span>
          <div className="flex items-center gap-1.5">
            <span className="mono text-[10px] text-slate-600">{slides.length}</span>
            <button
              onClick={toggleSelectMode}
              title={selectMode ? 'Exit selection mode' : 'Select multiple pages'}
              className={`mono text-[10px] px-1.5 py-0.5 rounded border transition-colors focus-ring ${
                selectMode ? 'text-indigo-300 border-indigo-400/50 bg-indigo-500/10' : 'text-slate-400 border-slate-700/60 hover:text-slate-200 hover:border-slate-500'
              }`}
            >
              {selectMode ? 'Done' : 'Select'}
            </button>
          </div>
        </div>
        {!selectMode && (
          <div className="flex items-center gap-1.5 mt-2">
            <button
              onClick={onAddPage}
              title="New page (added after the current page)"
              className={`${btn} text-cyan-300 border-cyan-500/40 hover:bg-cyan-500/10`}
            ><IPlus size={11} /> New</button>
            <button
              onClick={() => onDuplicateAt(activeIndex)}
              title="Copy the current page"
              className={`${btn} text-slate-300 border-slate-700/60 hover:text-cyan-300 hover:border-cyan-500/40`}
            ><ICopy size={11} /> Copy</button>
          </div>
        )}
        {selectMode && (
          <div className="flex items-center gap-1 mt-2">
            <button
              onClick={() => setSelectedIds(slides.map((x) => x.id))}
              className="mono text-[10px] px-1.5 py-0.5 rounded border border-slate-700/60 text-slate-400 hover:text-slate-200 transition-colors focus-ring"
            >All</button>
            <button
              onClick={() => setSelectedIds([])}
              className="mono text-[10px] px-1.5 py-0.5 rounded border border-slate-700/60 text-slate-400 hover:text-slate-200 transition-colors focus-ring"
            >None</button>
            <button
              onClick={onDeleteSelected}
              disabled={!canDelete}
              title={count >= slides.length && count > 0 ? 'At least one page must remain' : 'Delete selected pages'}
              className="ml-auto flex items-center gap-1 mono text-[10px] px-1.5 py-0.5 rounded border border-red-500/40 text-red-300 hover:bg-red-500/15 transition-colors focus-ring disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-transparent"
            >
              <ITrash2 size={11} /> {count}
            </button>
          </div>
        )}
      </div>
      <div ref={listRef} className="flex-1 overflow-y-auto p-2.5 flex flex-col gap-2.5 select-none">
        {slides.map((s, i) => {
          const isSel = selectedSet.has(s.id);
          const gap = drag ? drag.gap : null;
          const barBefore = drag && gap === i && gap !== drag.from && gap !== drag.from + 1;
          const barAfter = drag && i === slides.length - 1 && gap === slides.length && drag.from !== slides.length - 1;
          return (
            <div
              key={s.id}
              ref={(el) => { cellRefs.current[i] = el; }}
              className="relative flex-shrink-0"
              onPointerDown={(e) => onCellPointerDown(e, i, false)}
            >
              {barBefore && <DropBar edge="top" />}
              <div
                onClick={(e) => onCardClick(e, i, s)}
                className={`thumb-card rounded-lg overflow-hidden relative ${i === activeIndex ? 'active' : ''} ${isSel ? 'selected' : ''} ${drag && drag.from === i ? 'opacity-40' : ''}`}
                style={{ aspectRatio: '4 / 3', background: s.bg }}
                title={`Page ${i + 1}`}
              >
                {s.thumb ? (
                  <img src={s.thumb} alt={`Page ${i + 1}`} className="w-full h-full object-cover" draggable={false} />
                ) : (
                  <div className="w-full h-full flex items-center justify-center">
                    <span className="mono text-[9px] text-white/30">EMPTY</span>
                  </div>
                )}
                {selectMode && (
                  <span
                    className={`absolute top-1 left-1 w-4 h-4 rounded-full border flex items-center justify-center ${
                      isSel ? 'bg-indigo-400 border-indigo-200 text-slate-950' : 'bg-black/40 border-white/50'
                    }`}
                  >
                    {isSel && <ICheck size={10} />}
                  </span>
                )}
                {!selectMode && (
                  <>
                    <button
                      data-nodrag
                      onClick={(e) => { e.stopPropagation(); onDuplicateAt(i); }}
                      title={`Copy page ${i + 1}`}
                      aria-label={`Copy page ${i + 1}`}
                      className="absolute top-1 right-1 w-7 h-7 rounded-md bg-black/55 text-white/80 hover:text-cyan-300 hover:bg-black/75 flex items-center justify-center focus-ring"
                    ><ICopy size={13} /></button>
                    <span
                      onPointerDown={(e) => { e.stopPropagation(); onCellPointerDown(e, i, true); }}
                      title="Drag to move this page"
                      aria-label={`Move page ${i + 1}`}
                      className="absolute bottom-1 left-1 w-7 h-6 rounded-md bg-black/55 text-white/70 hover:text-cyan-300 flex items-center justify-center cursor-grab active:cursor-grabbing"
                      style={{ touchAction: 'none' }}
                    ><IGrip size={14} /></span>
                  </>
                )}
                <span className="absolute bottom-1 right-1.5 mono text-[9px] px-1 rounded bg-black/50 text-white/70">{i + 1}</span>
              </div>
              {barAfter && <DropBar edge="bottom" />}
            </div>
          );
        })}
      </div>
      {drag && drag.gap !== null && ReactDOM.createPortal(
        <div
          className="fixed z-[90] pointer-events-none mono text-[11px] px-2 py-1 rounded-md bg-slate-900/90 border border-cyan-400/60 text-cyan-200 shadow-xl"
          style={{ left: drag.x + 14, top: drag.y + 10 }}
        >Page {drag.from + 1}</div>,
        document.body
      )}
    </div>
  );
}

function SidebarToggle({ collapsed, onToggle }) {
  return (
    <button
      onClick={onToggle}
      title={collapsed ? 'Show pages' : 'Hide pages'}
      className="absolute left-0 top-1/2 -translate-y-1/2 z-20 glass-strong rounded-r-lg py-3 px-1 text-slate-400 hover:text-cyan-300 transition-colors focus-ring"
      style={{ borderLeft: 'none' }}
    >
      {collapsed ? <IChevronRight size={14} /> : <IChevronLeft size={14} />}
    </button>
  );
}

/* ---------- Phase 4: Bottom navigation dock ---------- */

function DockSwapButton({ onClick, side }) {
  // Sits on the dock's inner edge (toward the screen centre).
  return (
    <div className={`flex items-center gap-1 ${side === 'right' ? 'order-first flex-row-reverse' : 'order-last'}`}>
      <div className="w-px h-5 bg-slate-700/60 mx-1" />
      <button className="navdock-btn focus-ring" onClick={onClick} title="Swap dock positions" aria-label="Swap dock positions">
        <span className="text-[15px] leading-none">{'\u21C4'}</span>
      </button>
    </div>

/* ---------- Phase 5: floating widget window shell ---------- */

function useDraggable(initialPos, boundsRef) {
  const [pos, setPos] = useState(initialPos);
  const posRef = useRef(initialPos);
  const dragState = useRef(null);

  const onPointerDown = useCallback((e) => {
    if (e.button !== undefined && e.button !== 0) return;
    dragState.current = { startX: e.clientX, startY: e.clientY, origin: posRef.current };
    e.preventDefault();
    e.stopPropagation();
    const onMove = (ev) => {
      if (!dragState.current) return;
      const dx = ev.clientX - dragState.current.startX;
      const dy = ev.clientY - dragState.current.startY;
      let next = { x: dragState.current.origin.x + dx, y: dragState.current.origin.y + dy };
      // boundsRef points at the canvas-stage DOM element; read its live size
      // via getBoundingClientRect() rather than assuming a {width,height} shape.
      const boundsEl = boundsRef?.current;
      if (boundsEl) {
        const rect = boundsEl.getBoundingClientRect();
        next.x = Math.max(4, Math.min(next.x, rect.width - 60));
        next.y = Math.max(4, Math.min(next.y, rect.height - 44));
      }
      posRef.current = next;
      setPos(next);
    };
    const onUp = () => {
      dragState.current = null;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }, [boundsRef]);

  return [pos, onPointerDown];
}

function WidgetWindow({ title, icon: Icon, initialPos, boundsRef, minimized, onMinimize, onRestore, onClose, width = 260, children }) {
  const [pos, onHeaderDown] = useDraggable(initialPos, boundsRef);

/* ---------- Phase 5: Widget 1 — Stopwatch & Timer ---------- */

function formatStopwatch(ms) {
  const totalCs = Math.floor(ms / 10); // centiseconds
  const cs = totalCs % 100;
  const totalSec = Math.floor(totalCs / 100);
  const s = totalSec % 60;
  const m = Math.floor(totalSec / 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
}
function formatCountdown(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const s = total % 60;
  const m = Math.floor(total / 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function TimerWidget() {
  const [mode, setMode] = useState('stopwatch'); // 'stopwatch' | 'countdown'

  // Stopwatch state
  const [swElapsed, setSwElapsed] = useState(0);
  const [swRunning, setSwRunning] = useState(false);
  const [laps, setLaps] = useState([]);
  const swStartRef = useRef(0);
  const swBaseRef = useRef(0);

  // Countdown state
  const [cdDurationMs, setCdDurationMs] = useState(5 * 60 * 1000);
  const [cdRemaining, setCdRemaining] = useState(5 * 60 * 1000);
  const [cdRunning, setCdRunning] = useState(false);
  const [cdFinished, setCdFinished] = useState(false);
  const [customInput, setCustomInput] = useState('');
  const cdEndRef = useRef(0);

  const rafRef = useRef(null);

  useEffect(() => {
    const tick = () => {
      const now = performance.now();
      if (swRunning) setSwElapsed(swBaseRef.current + (now - swStartRef.current));
      if (cdRunning) {
        const remaining = cdEndRef.current - now;
        if (remaining <= 0) {
          setCdRemaining(0);
          setCdRunning(false);
          setCdFinished(true);
          playChime();
        } else {
          setCdRemaining(remaining);
        }
      }
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [swRunning, cdRunning]);

  const startStopwatch = () => { swStartRef.current = performance.now(); setSwRunning(true); };
  const pauseStopwatch = () => { swBaseRef.current = swElapsed; setSwRunning(false); };
  const resetStopwatch = () => { setSwRunning(false); setSwElapsed(0); swBaseRef.current = 0; setLaps([]); };
  const addLap = () => setLaps((prev) => [swElapsed, ...prev]);

  const startCountdown = (ms) => {
    const dur = ms !== undefined ? ms : cdRemaining > 0 ? cdRemaining : cdDurationMs;
    cdEndRef.current = performance.now() + dur;
    setCdRemaining(dur);
    setCdRunning(true);
    setCdFinished(false);
  };
  const pauseCountdown = () => setCdRunning(false);
  const resetCountdown = () => { setCdRunning(false); setCdFinished(false); setCdRemaining(cdDurationMs); };
  const addPreset = (minutes) => {
    const addMs = minutes * 60 * 1000;
    const base = cdRunning ? cdEndRef.current - performance.now() : cdRemaining;
    const next = Math.max(0, base) + addMs;
    setCdDurationMs(next);
    setCdRemaining(next);
    if (cdRunning) cdEndRef.current = performance.now() + next;
    setCdFinished(false);
  };
  const applyCustom = () => {
    const m = parseFloat(customInput);
    if (!Number.isFinite(m) || m <= 0) return;
    const ms = m * 60 * 1000;
    setCdDurationMs(ms);
    setCdRemaining(ms);
    setCdFinished(false);
    setCustomInput('');
  };

  const progress = cdDurationMs > 0 ? Math.max(0, Math.min(1, cdRemaining / cdDurationMs)) : 0;
  const R = 42, CIRC = 2 * Math.PI * R;

  return (
    <div className="w-56">
      <div className="flex rounded-lg bg-slate-950/50 p-0.5 mb-3">
        {['stopwatch', 'countdown'].map((m) => (
          <button
            key={m}
            onClick={() => setMode(m)}
            className={`flex-1 text-[11px] py-1.5 rounded-md transition-colors ${mode === m ? 'bg-cyan-500/20 text-cyan-300' : 'text-slate-500 hover:text-slate-300'}`}
          >
            {m === 'stopwatch' ? 'Stopwatch' : 'Timer'}
          </button>
        ))}
      </div>

      {mode === 'stopwatch' ? (
        <div>
          <div className="mono text-3xl text-center text-slate-100 tabular-nums py-3">{formatStopwatch(swElapsed)}</div>
          <div className="flex gap-2 mb-2">
            {!swRunning ? (
              <button onClick={startStopwatch} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg bg-emerald-500/20 text-emerald-300 text-xs hover:bg-emerald-500/30 transition-colors focus-ring">
                <IPlay size={12} /> Start
              </button>
            ) : (
              <button onClick={pauseStopwatch} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg bg-amber-500/20 text-amber-300 text-xs hover:bg-amber-500/30 transition-colors focus-ring">
                <IPause size={12} /> Pause
              </button>
            )}
            <button onClick={addLap} disabled={!swRunning} className="px-3 py-2 rounded-lg bg-slate-800/60 text-slate-300 text-xs hover:bg-slate-700/60 disabled:opacity-30 transition-colors focus-ring">
              <IFlag size={12} />
            </button>
            <button onClick={resetStopwatch} className="px-3 py-2 rounded-lg bg-slate-800/60 text-slate-300 text-xs hover:bg-slate-700/60 transition-colors focus-ring">
              <IRotateCcw size={12} />
            </button>
          </div>
          {laps.length > 0 && (
            <div className="max-h-24 overflow-y-auto mono text-[11px] text-slate-400 space-y-0.5 border-t border-slate-800 pt-1.5">
              {laps.map((l, i) => (
                <div key={i} className="flex justify-between px-1">
                  <span className="text-slate-600">#{laps.length - i}</span>
                  <span>{formatStopwatch(l)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      ) : (
        <div>
          <div className="relative flex items-center justify-center py-2">
            <svg width="100" height="100" viewBox="0 0 100 100" className="-rotate-90">
              <circle cx="50" cy="50" r={R} fill="none" stroke="rgba(148,163,184,0.15)" strokeWidth="6" />
              <circle
                cx="50" cy="50" r={R} fill="none"
                stroke={cdFinished ? '#f43f5e' : '#38bdf8'}
                strokeWidth="6" strokeLinecap="round"
                strokeDasharray={CIRC}
                strokeDashoffset={CIRC * (1 - progress)}
                style={{ transition: 'stroke-dashoffset 0.2s linear' }}
              />
            </svg>
            <span className={`absolute mono text-lg tabular-nums ${cdFinished ? 'text-rose-400' : 'text-slate-100'}`}>
              {formatCountdown(cdRemaining)}
            </span>
          </div>
          <div className="flex gap-1.5 mb-2">
            {[1, 5, 15].map((m) => (
              <button key={m} onClick={() => addPreset(m)} className="flex-1 py-1.5 rounded-lg bg-slate-800/60 text-slate-300 text-[11px] hover:bg-slate-700/60 transition-colors focus-ring">
                +{m}m
              </button>
            ))}
          </div>
          <div className="flex gap-1.5 mb-2">
            <input
              value={customInput}
              onChange={(e) => setCustomInput(e.target.value.replace(/[^0-9.]/g, ''))}
              onKeyDown={(e) => e.key === 'Enter' && applyCustom()}
              placeholder="Custom minutes"
              className="flex-1 min-w-0 bg-slate-950/60 border border-slate-700/60 rounded-lg px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-cyan-500/50"
            />
            <button onClick={applyCustom} className="px-2.5 py-1.5 rounded-lg bg-slate-800/60 text-slate-300 text-xs hover:bg-slate-700/60 transition-colors focus-ring">Set</button>
          </div>
          <div className="flex gap-2">
            {!cdRunning ? (
              <button onClick={() => startCountdown()} disabled={cdRemaining <= 0} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg bg-emerald-500/20 text-emerald-300 text-xs hover:bg-emerald-500/30 disabled:opacity-30 transition-colors focus-ring">
                <IPlay size={12} /> Start
              </button>
            ) : (
              <button onClick={pauseCountdown} className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg bg-amber-500/20 text-amber-300 text-xs hover:bg-amber-500/30 transition-colors focus-ring">
                <IPause size={12} /> Pause
              </button>
            )}
            <button onClick={resetCountdown} className="px-3 py-2 rounded-lg bg-slate-800/60 text-slate-300 text-xs hover:bg-slate-700/60 transition-colors focus-ring">
              <IRotateCcw size={12} />
            </button>
          </div>
          {cdFinished && <div className="text-center text-rose-400 text-xs mt-2 animate-pulse">Time's up!</div>}
        </div>
      )}
    </div>
  );
}

/* ---------- Phase 5: Widget 2 — Scientific Calculator ---------- */

function CalculatorWidget() {
  const [expr, setExpr] = useState('');
  const [result, setResult] = useState(null);
  const [error, setError] = useState(false);

  const lastCharIsOp = () => /[+\-*/%^]$/.test(expr);
  const lastCharIsOpenParen = () => /\($/.test(expr);

  const append = (token) => {
    setError(false);
    setExpr((prev) => {
      if (/[+\-*/%^]/.test(token) && lastCharIsOp()) return prev.slice(0, -1) + token;
      return prev + token;
    });
  };

  const applyFn = (fn) => {
    setError(false);
    try {
      const base = expr.length ? safeEvalExpr(expr) : 0;
      let val;
      switch (fn) {
        case 'sin': val = Math.sin(base * Math.PI / 180); break;
        case 'cos': val = Math.cos(base * Math.PI / 180); break;
        case 'tan': val = Math.tan(base * Math.PI / 180); break;
        case 'sqrt': if (base < 0) throw new Error('neg sqrt'); val = Math.sqrt(base); break;
        case 'sq': val = base * base; break;
        case 'ln': if (base <= 0) throw new Error('bad ln'); val = Math.log(base); break;
        case 'log': if (base <= 0) throw new Error('bad log'); val = Math.log10(base); break;
        default: return;
      }
      val = Math.round(val * 1e10) / 1e10;
      if (val === 0) val = 0; // avoid '-0'
      setExpr(String(val));
      setResult(null);
    } catch (e) {
      setError(true);
    }
  };

  const backspace = () => setExpr((prev) => prev.slice(0, -1));
  const clearAll = () => { setExpr(''); setResult(null); setError(false); };
  const evaluate = () => {
    try {
      if (!expr.length) return;
      const val = safeEvalExpr(expr);
      const rounded = Math.round(val * 1e10) / 1e10;
      setResult(rounded);
      setError(false);
    } catch (e) {
      setError(true);
      setResult(null);
    }
  };

  const onKeyDown = (e) => {
    if (/[0-9.+\-*/%^()]/.test(e.key)) { append(e.key); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === '=') { evaluate(); e.preventDefault(); }
    else if (e.key === 'Backspace') { backspace(); e.preventDefault(); }
    else if (e.key === 'Escape') { clearAll(); e.preventDefault(); }
  };

  const Key = ({ label, onClick, className = '', span = 1 }) => (
    <button
      onClick={onClick}
      className={`calc-key py-2.5 focus-ring ${className}`}
      style={{ gridColumn: span > 1 ? `span ${span}` : undefined }}
    >
      {label}
    </button>
  );

  return (
    <div className="w-64" tabIndex={0} onKeyDown={onKeyDown}>
      <div className="bg-slate-950/60 rounded-lg px-3 py-3 mb-3 text-right border border-slate-800/60">
        <div className="mono text-xs text-slate-500 h-4 truncate">{expr || '0'}</div>
        <div className={`mono text-2xl truncate ${error ? 'text-rose-400' : 'text-slate-100'}`}>
          {error ? 'Error' : result !== null ? result : '\u00A0'}
        </div>
      </div>

      <div className="grid grid-cols-4 gap-1.5 mb-1.5">
        <Key label="sin" className="fn" onClick={() => applyFn('sin')} />
        <Key label="cos" className="fn" onClick={() => applyFn('cos')} />
        <Key label="tan" className="fn" onClick={() => applyFn('tan')} />
        <Key label="AC" className="op" onClick={clearAll} />

        <Key label="ln" className="fn" onClick={() => applyFn('ln')} />
        <Key label="log" className="fn" onClick={() => applyFn('log')} />
        <Key label="√" className="fn" onClick={() => applyFn('sqrt')} />
        <Key label="⌫" className="op" onClick={backspace} />

        <Key label="x²" className="fn" onClick={() => applyFn('sq')} />
        <Key label="(" onClick={() => append('(')} />
        <Key label=")" onClick={() => append(')')} />
        <Key label="÷" className="op" onClick={() => append('/')} />

        <Key label="7" onClick={() => append('7')} />
        <Key label="8" onClick={() => append('8')} />
        <Key label="9" onClick={() => append('9')} />
        <Key label="×" className="op" onClick={() => append('*')} />

        <Key label="4" onClick={() => append('4')} />
        <Key label="5" onClick={() => append('5')} />
        <Key label="6" onClick={() => append('6')} />
        <Key label="−" className="op" onClick={() => append('-')} />

        <Key label="1" onClick={() => append('1')} />
        <Key label="2" onClick={() => append('2')} />
        <Key label="3" onClick={() => append('3')} />
        <Key label="+" className="op" onClick={() => append('+')} />

        <Key label="π" className="fn" onClick={() => append(String(Math.PI))} />
        <Key label="0" onClick={() => append('0')} />
        <Key label="." onClick={() => append('.')} />
        <Key label="=" className="accent" onClick={evaluate} />
      </div>
      <div className="grid grid-cols-2 gap-1.5">
        <Key label="%" className="fn" onClick={() => append('%')} />
        <Key label="±" className="fn" onClick={() => setExpr((p) => (p.startsWith('-') ? p.slice(1) : '-' + p))} />
      </div>
    </div>
  );
}

/* ---------- Dice & random number widget ---------- */

function DiceWidget() {
  const [mode, setMode] = useState('dice');   // 'dice' | 'number'
  const [count, setCount] = useState(2);
  const [faces, setFaces] = useState([1, 1]);
  const [lo, setLo] = useState(1);
  const [hi, setHi] = useState(30);
  const [num, setNum] = useState(null);
  const [rolling, setRolling] = useState(false);
  const timerRef = useRef(null);
  useEffect(() => () => clearInterval(timerRef.current), []);
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  const roll = () => {
    if (rolling) return;
    setRolling(true);
    let n = 0;
    clearInterval(timerRef.current);
    timerRef.current = setInterval(() => {
      n += 1;
      if (mode === 'dice') setFaces(Array.from({ length: count }, () => rnd(1, 6)));
      else setNum(rnd(Math.min(lo, hi), Math.max(lo, hi)));
      if (n >= 9) { clearInterval(timerRef.current); setRolling(false); }
    }, 70);
  };
  const pickCount = (c) => { setCount(c); setFaces(Array.from({ length: c }, (_, i) => faces[i] || 1)); };
  const asInt = (v) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.max(-9999, Math.min(9999, n)) : 0; };
  const tab = (active) => `flex-1 text-xs mono py-1.5 rounded-md border transition-colors focus-ring ${active ? 'text-cyan-300 border-cyan-500/40 bg-cyan-500/10' : 'text-slate-400 border-slate-700/60 hover:text-slate-200'}`;

  return (
    <div className="flex flex-col gap-3">
      <div className="flex gap-1.5">
        <button className={tab(mode === 'dice')} onClick={() => setMode('dice')}>Dice</button>
        <button className={tab(mode === 'number')} onClick={() => setMode('number')}>Number</button>
      </div>
      {mode === 'dice' ? (
        <>
          <div className="flex items-center gap-1.5">
            <span className="mono text-[10px] tracking-wider text-slate-500 mr-auto">DICE</span>
            {[1, 2, 3].map((c) => (
              <button key={c} onClick={() => pickCount(c)} className={`w-7 h-7 rounded-md text-xs mono border focus-ring ${count === c ? 'text-cyan-300 border-cyan-500/40 bg-cyan-500/10' : 'text-slate-400 border-slate-700/60'}`}>{c}</button>
            ))}
          </div>
          <div className="flex items-center justify-center gap-2.5 min-h-[56px]">
            {faces.slice(0, count).map((f, i) => (
              <div key={i} className="w-14 h-14 rounded-xl flex items-center justify-center text-2xl font-semibold text-slate-900 bg-slate-100 shadow-lg" style={{ transform: rolling ? `rotate(${(i % 2 ? 1 : -1) * 8}deg)` : 'none', transition: 'transform 0.07s' }}>{f}</div>
            ))}
          </div>
          {!rolling && count > 1 && <div className="text-center mono text-[11px] text-slate-400">Total {faces.slice(0, count).reduce((a, b) => a + b, 0)}</div>}
        </>
      ) : (
        <>
          <div className="flex items-center gap-2">
            <input type="number" value={lo} onChange={(e) => setLo(asInt(e.target.value))} aria-label="Minimum" className="mono text-xs text-slate-200 bg-slate-900/60 border border-slate-700/60 rounded-lg px-2 h-8 w-full min-w-0 focus-ring" />
            <span className="text-slate-500 text-xs">to</span>
            <input type="number" value={hi} onChange={(e) => setHi(asInt(e.target.value))} aria-label="Maximum" className="mono text-xs text-slate-200 bg-slate-900/60 border border-slate-700/60 rounded-lg px-2 h-8 w-full min-w-0 focus-ring" />
          </div>
          <div className="flex items-center justify-center min-h-[56px] text-5xl font-semibold text-cyan-300 tabular-nums">{num === null ? '–' : num}</div>
        </>
      )}
      <button onClick={roll} disabled={rolling} className="rounded-lg py-2 text-sm font-medium text-slate-950 bg-gradient-to-r from-cyan-300 to-indigo-300 disabled:opacity-60 focus-ring">
        {mode === 'dice' ? 'Roll' : 'Pick a number'}
      </button>
    </div>
  );
}

/* ---------- Ruler overlay: drag to move, buttons to rotate ---------- */

function RulerOverlay({ boundsRef, onClose }) {
  const CM = 37.8;                 // CSS pixels per centimetre
  const LEN = 15;                  // ruler length in cm
  const PAD = 14;
  const W = Math.round(LEN * CM + PAD * 2);
  const H = 64;
  const [st, setSt] = useState({ x: 60, y: 110, angle: 0 });
  const stRef = useRef(st);
  stRef.current = st;

  const onDown = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const o = { px: e.clientX, py: e.clientY, x: stRef.current.x, y: stRef.current.y };
    const move = (ev) => {
      let x = o.x + ev.clientX - o.px, y = o.y + ev.clientY - o.py;
      const el = boundsRef && boundsRef.current;
      if (el) {
        const r = el.getBoundingClientRect();
        x = Math.max(-W + 90, Math.min(x, r.width - 90));
        y = Math.max(-30, Math.min(y, r.height - 40));
      }
      setSt((p) => ({ ...p, x, y }));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  };
  const rot = (d) => setSt((p) => ({ ...p, angle: (((p.angle + d) % 360) + 360) % 360 }));
  const stop = (e) => e.stopPropagation();
  const ticks = [];
  for (let i = 0; i <= LEN * 10; i++) {
    const x = PAD + i * CM / 10;
    const len = i % 10 === 0 ? 20 : i % 5 === 0 ? 14 : 9;
    ticks.push(<line key={i} x1={x} y1={0} x2={x} y2={len} stroke="#451a03" strokeWidth={i % 10 === 0 ? 1.4 : 1} />);
    if (i % 10 === 0 && i > 0 && i < LEN * 10) ticks.push(<text key={'t' + i} x={x} y={32} fontSize="10" textAnchor="middle" fill="#451a03" fontFamily="JetBrains Mono, monospace">{i / 10}</text>);
  }
  const rb = 'w-7 h-6 rounded-md bg-amber-900/15 hover:bg-amber-900/30 text-amber-950 flex items-center justify-center focus-ring';

  return (
    <div
      className="absolute z-[26] select-none"
      style={{ left: st.x, top: st.y, width: W, height: H, transform: `rotate(${st.angle}deg)`, transformOrigin: '50% 50%', touchAction: 'none', cursor: 'grab' }}
      onPointerDown={onDown}
    >
      <div className="absolute inset-0 rounded-md shadow-2xl" style={{ background: 'linear-gradient(180deg, rgba(253,230,138,0.95), rgba(251,191,36,0.9))', border: '1px solid rgba(120,53,15,0.5)' }} />
      <svg width={W} height={H} className="absolute inset-0 pointer-events-none"><g>{ticks}</g></svg>
      <div className="absolute left-0 right-0 bottom-1 flex items-center justify-center gap-1.5" onPointerDown={stop}>
        <button className={rb} onClick={() => rot(-15)} title="Rotate left 15°" aria-label="Rotate left"><IRotateCcw size={13} /></button>
        <span className="mono text-[10px] text-amber-950 w-9 text-center tabular-nums">{st.angle}°</span>
        <button className={rb} onClick={() => rot(15)} title="Rotate right 15°" aria-label="Rotate right"><IRotate size={13} /></button>
        <button className={rb} onClick={() => setSt((p) => ({ ...p, angle: 0 }))} title="Level" aria-label="Level">0°</button>
        <button className={rb} onClick={onClose} title="Close ruler" aria-label="Close ruler"><IX size={13} /></button>
      </div>
    </div>
  );
}

function LaserPointerOverlay({ containerRef, color = '#38bdf8' }) {
  const canvasRef = useRef(null);
  const pointsRef = useRef([]); // {x, y, t}
  const rafRef = useRef(null);
  const activeRef = useRef(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    const container = containerRef.current;
    if (!canvas || !container) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    const resize = () => {
      canvas.width = container.clientWidth * dpr;
      canvas.height = container.clientHeight * dpr;
      canvas.style.width = container.clientWidth + 'px';
      canvas.style.height = container.clientHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(container);

    const LIFETIME = 800;
    const draw = () => {
      const now = performance.now();
      pointsRef.current = pointsRef.current.filter((p) => now - p.t < LIFETIME);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const pts = pointsRef.current;
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i - 1], p1 = pts[i];
        const age = now - p1.t;
        const alpha = Math.max(0, 1 - age / LIFETIME);
        if (alpha <= 0) continue;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.strokeStyle = color;
        ctx.globalAlpha = alpha * 0.8;
        ctx.lineWidth = 3 + alpha * 4;
        ctx.lineCap = 'round';
        ctx.shadowColor = color;
        ctx.shadowBlur = 12 * alpha;
        ctx.stroke();
      }
      // head dot
      if (pts.length) {
        const head = pts[pts.length - 1];
        const age = now - head.t;
        const alpha = Math.max(0, 1 - age / LIFETIME);
        ctx.beginPath();
        ctx.arc(head.x, head.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = Math.min(1, alpha + 0.3);
        ctx.shadowBlur = 16;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);

    const rect = () => container.getBoundingClientRect();
    const addPoint = (clientX, clientY) => {
      const r = rect();
      pointsRef.current.push({ x: clientX - r.left, y: clientY - r.top, t: performance.now() });
      if (pointsRef.current.length > 200) pointsRef.current.shift();
    };
    // Listens on its own canvas (it sits above Fabric's canvas while active),
    // so drawing a laser trail never reaches Fabric and can't create objects
    // or touch the undo/redo stack.
    const onDown = (e) => { activeRef.current = true; addPoint(e.clientX, e.clientY); };
    const onMove = (e) => { if (activeRef.current) addPoint(e.clientX, e.clientY); };
    const onUp = () => { activeRef.current = false; };

    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);

    return () => {
      cancelAnimationFrame(rafRef.current);
      ro.disconnect();
      canvas.removeEventListener('pointerdown', onDown);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
  }, [containerRef, color]);

  return <canvas ref={canvasRef} className="laser-trail-canvas" />;
}

const CanvasViewport = React.forwardRef(function CanvasViewport({ initialBg, onContentChange }, ref) {
  const onChangeRef = useRef(onContentChange);
  onChangeRef.current = onContentChange;
  const suppressNotifyRef = useRef(false);   // true while a page is being (re)loaded
  const gestureBusyRef = useRef(null);       // () => is a shape/erase/text gesture in flight?
  const wrapRef = useRef(null);
  const canvasElRef = useRef(null);
  const fabricRef = useRef(null);
  const bgImageObjRef = useRef(null); // the fabric.Image used as a locked PDF-page background, if any
  const pageRef = useRef(null);       // {w,h} of the PDF page in page-space px, or null on blank slides
  const frameRef = useRef({ ...PAGE_SPACE }); // current page->stage frame {scale, offsetX, offsetY}
  const loadTokenRef = useRef(0);     // guards against out-of-order async slide loads

  const [tool, setTool] = useState('draw');
  const [pen, setPen] = useState('ballpoint');
  const [emoji, setEmoji] = useState('⭐');
  const [gridMode, setGridMode] = useState('off'); // off | grid | dots | lines
  const [selChip, setSelChip] = useState(null);   // floating 'erase selection' button position
  const [color, setColor] = useState('#ffffff');
  const [width, setWidth] = useState(6);
  const [activeShape, setActiveShape] = useState('rect');

  const [historyState, setHistoryState] = useState({ canUndo: false, canRedo: false });
  const [hasObjects, setHasObjects] = useState(false);
  const [confirmClear, setConfirmClear] = useState(false);
  const [rotateHandle, setRotateHandle] = useState(null); // {x,y,yaw,tilt} screen-space, for selected 3D object
  const [hasSelection, setHasSelection] = useState(false);
  const [hasClipboard, setHasClipboard] = useState(!!NB_CLIPBOARD.obj);
  const stickyCounterRef = useRef(0);

  /* Mutable refs so Fabric event handlers (bound once) always read fresh values */
  const toolRef = useRef(tool);
  const penRef = useRef(pen);
  const emojiRef = useRef(emoji);
  const colorRef = useRef(color);
  const widthRef = useRef(width);
  const activeShapeRef = useRef(activeShape);
  useEffect(() => { toolRef.current = tool; }, [tool]);
  useEffect(() => { penRef.current = pen; }, [pen]);
  useEffect(() => { emojiRef.current = emoji; }, [emoji]);
  useEffect(() => { colorRef.current = color; }, [color]);
  useEffect(() => { widthRef.current = width; }, [width]);
  useEffect(() => { activeShapeRef.current = activeShape; }, [activeShape]);

  const pickShape = useCallback((id) => {
    setActiveShape(id);
    setTool('shape');
  }, []);

  /* History: JSON snapshots of canvas objects */
  const historyRef = useRef({ stack: [], index: -1, locked: false });

  const syncHistoryUI = useCallback(() => {
    const h = historyRef.current;
    setHistoryState({ canUndo: h.index > 0, canRedo: h.index < h.stack.length - 1 });
    const c = fabricRef.current;
    setHasObjects(!!c && c.getObjects().length > 0);
  }, []);

  const pushHistory = useCallback(() => {
    const c = fabricRef.current;
    const h = historyRef.current;
    if (!c || h.locked) return;
    // Snapshots exclude the locked page image (tracked separately) and record the
    // frame they were taken in, so undo/redo stays aligned after a resize.
    const j = c.toJSON(NB_PROPS);
    j.objects = (j.objects || []).filter((o) => o.nbKind !== 'bgImage' && o.nbKind !== 'laser');
    j.nbFrame = pageRef.current ? { ...frameRef.current } : null;
    const snap = JSON.stringify(j);
    h.stack = h.stack.slice(0, h.index + 1);
    h.stack.push(snap);
    if (h.stack.length > 100) h.stack.shift();
    h.index = h.stack.length - 1;
    syncHistoryUI();
    // Tell the auto-saver the page content changed (not for the initial snapshot taken on page load).
    if (!suppressNotifyRef.current && onChangeRef.current) onChangeRef.current();
  }, [syncHistoryUI]);

  const historyDebounceRef = useRef(null);
  const pushHistoryDebounced = useCallback(() => {
    if (historyDebounceRef.current) clearTimeout(historyDebounceRef.current);
    historyDebounceRef.current = setTimeout(() => pushHistory(), 400);
  }, [pushHistory]);

  const restoreHistory = useCallback((idx) => {
    const c = fabricRef.current;
    const h = historyRef.current;
    if (!c || idx < 0 || idx >= h.stack.length) return;
    h.locked = true;
    const snap = JSON.parse(h.stack[idx]);
    const bgImg = bgImageObjRef.current;
    c.loadFromJSON(snap, () => {
      if (bgImg) { c.add(bgImg); c.sendToBack(bgImg); }
      if (pageRef.current && snap.nbFrame) {
        reframeObjects(c.getObjects().filter((o) => o.nbKind !== 'bgImage'), snap.nbFrame, frameRef.current);
      }
      c.renderAll();
      h.index = idx;
      h.locked = false;
      syncHistoryUI();
      if (onChangeRef.current) onChangeRef.current();
    });
  }, [syncHistoryUI]);

  const undo = useCallback(() => {
    const h = historyRef.current;
    if (h.index > 0) restoreHistory(h.index - 1);
  }, [restoreHistory]);

  const redo = useCallback(() => {
    const h = historyRef.current;
    if (h.index < h.stack.length - 1) restoreHistory(h.index + 1);
  }, [restoreHistory]);

  /* ---- Init Fabric ---- */
  useEffect(() => {
    const wrap = wrapRef.current;
    const el = canvasElRef.current;
    if (!wrap || !el || !window.fabric) return;

    const dpr = window.devicePixelRatio || 1;
    fabric.Object.prototype.transparentCorners = false;
    fabric.Object.prototype.cornerColor = '#38bdf8';
    fabric.Object.prototype.cornerStrokeColor = '#0f1420';
    fabric.Object.prototype.borderColor = '#38bdf8';
    fabric.Object.prototype.cornerStyle = 'circle';
    fabric.Object.prototype.cornerSize = 10;
    fabric.Object.prototype.borderScaleFactor = 1.5;
    fabric.Object.prototype.padding = 4;

    const canvas = new fabric.Canvas(el, {
      width: wrap.clientWidth,
      height: wrap.clientHeight,
      backgroundColor: initialBg || '#0d3824',
      selection: false,
      preserveObjectStacking: true,
      enableRetinaScaling: true,
      stopContextMenu: true,
      fireRightClick: false,
      perPixelTargetFind: true,
      targetFindTolerance: 8,
    });
    fabricRef.current = canvas;
    // Fabric applies retina scaling using window.devicePixelRatio when enabled.
    void dpr;

    historyRef.current = { stack: [], index: -1, locked: false };
    pushHistory(); // initial empty state

    /* ---- Custom drawing state ---- */
    let drawing = false;
    let pts = [];
    let widths = [];
    let lastT = 0;
    let lastPt = null;
    let smoothedW = widthRef.current;
    let livePath = null;
    let glowRaf = null;

    const stopGlowPulse = () => { if (glowRaf) { cancelAnimationFrame(glowRaf); glowRaf = null; } };

    /* ---- Shape drag-to-size state ---- */
    let shapeStart = null;
    let liveShape = null;

    const commonShapeProps = () => ({
      fill: 'transparent',
      stroke: colorRef.current,
      strokeWidth: widthRef.current,
      strokeUniform: true,
      selectable: false,
      evented: false,
      objectCaching: false,
    });

    const makeArrowHeadPath = (fromX, fromY, toX, toY, size) => {
      const ang = Math.atan2(toY - fromY, toX - fromX);
      const a1 = ang + Math.PI * 0.82, a2 = ang - Math.PI * 0.82;
      return `M ${toX + Math.cos(a1) * size} ${toY + Math.sin(a1) * size} L ${toX} ${toY} L ${toX + Math.cos(a2) * size} ${toY + Math.sin(a2) * size}`;
    };

    const buildStarPoints = (cx, cy, outerR, innerR) => {
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const ang = -Math.PI / 2 + (i * Math.PI) / 5;
        pts.push({ x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang) });
      }
      return pts;
    };
