<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="NovaBoard OS: interactive smartboard whiteboard that runs in one HTML file" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#101d3d"/></linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .t1 { font: 800 74px 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; fill: url(#ttl); }
    .sub { font: 500 24px 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; fill: #cbd5e1; opacity: 0; }
    .chip { font: 600 15px 'Segoe UI', system-ui, sans-serif; fill: #e2e8f0; }
    .s1 { animation: cyc 12s infinite 0s; } .s2 { animation: cyc 12s infinite 4s; } .s3 { animation: cyc 12s infinite 8s; }
    @keyframes cyc { 0% { opacity: 0; transform: translateY(10px); } 4%, 29% { opacity: 1; transform: translateY(0); } 33%, 100% { opacity: 0; transform: translateY(-8px); } }
    .b1 { animation: f1 14s ease-in-out infinite alternate; } .b2 { animation: f2 17s ease-in-out infinite alternate; } .b3 { animation: f3 19s ease-in-out infinite alternate; }
    @keyframes f1 { to { transform: translate(180px, 60px); } } @keyframes f2 { to { transform: translate(-220px, 40px); } } @keyframes f3 { to { transform: translate(120px, -70px); } }
    .in { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .5s; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    .sq { animation: chase 1.35s cubic-bezier(.45,0,.25,1) infinite; }
    @keyframes chase { 0% { transform: translate(0,0); } 33% { transform: translate(78px,30px); } 66% { transform: translate(26px,78px); } 100% { transform: translate(0,0); } }
    .glow { animation: pulse 3.2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .s1 { opacity: 1; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="b1" cx="140" cy="60" r="130" fill="#38bdf8" opacity=".55"/>
      <circle class="b2" cx="1020" cy="120" r="150" fill="#a78bfa" opacity=".5"/>
      <circle class="b3" cx="560" cy="330" r="130" fill="#f472b6" opacity=".38"/>
    </g>
    <rect width="1200" height="340" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2" rx="22"/>
    <g class="in"><text x="70" y="148" class="t1">NovaBoard OS</text></g>
    <g class="in d2">
      <text x="72" y="206" class="sub s1">An interactive smartboard in a single HTML file.</text>
      <text x="72" y="206" class="sub s2">Draw, present, import PDF &amp; PowerPoint, and teach.</text>
      <text x="72" y="206" class="sub s3">Free AI slides, liquid-glass themes, zero setup.</text>
    </g>
    <g class="in d3">
      <rect x="72" y="248" width="150" height="36" rx="18" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.22)"/><text x="147" y="272" text-anchor="middle" class="chip">No build step</text>
      <rect x="236" y="248" width="150" height="36" rx="18" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.22)"/><text x="311" y="272" text-anchor="middle" class="chip">No backend</text>
      <rect x="400" y="248" width="150" height="36" rx="18" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.22)"/><text x="475" y="272" text-anchor="middle" class="chip">No account</text>
    </g>
    <g transform="translate(960 106)">
      <circle class="glow" cx="60" cy="60" r="96" fill="none" stroke="rgba(125,211,252,.35)" stroke-width="2"/>
      <rect class="sq" x="0" y="0" width="50" height="50" rx="13" fill="#ff5577"/>
      <rect class="sq" x="0" y="0" width="50" height="50" rx="13" fill="#c6ee3f" style="animation-delay:-.45s"/>
      <rect class="sq" x="0" y="0" width="50" height="50" rx="13" fill="#3fd8ff" style="animation-delay:-.9s"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
