<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Loading animation: three chasing squares" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .sq { animation: chase 1.35s cubic-bezier(.45,0,.25,1) infinite; }
    @keyframes chase { 0% { transform: translate(8px,8px); } 33% { transform: translate(46px,22px); } 66% { transform: translate(22px,46px); } 100% { transform: translate(8px,8px); } }
    @media (prefers-reduced-motion: reduce) { .sq { animation: none; } }
  </style>
  <rect class="sq" width="30" height="30" rx="8" fill="#ff5577"/>
  <rect class="sq" width="30" height="30" rx="8" fill="#c6ee3f" style="animation-delay:-.45s"/>
  <rect class="sq" width="30" height="30" rx="8" fill="#3fd8ff" style="animation-delay:-.9s"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
